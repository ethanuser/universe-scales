<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><rect width="1200" height="800" fill="#081322"/><text x="64" y="81" fill="#ecf3fc" font-size="44" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Hubble radius</text><text x="64" y="124" fill="#a8b9d0" font-size="24" text-anchor="start" font-family="Arial,Helvetica,sans-serif">The distance where expansion gives a recession speed of light</text><circle cx="302" cy="400" r="182" fill="#0c2034" stroke="#77cff5" stroke-width="2"/><circle cx="302" cy="400" r="5" fill="#ecf3fc" stroke="none" stroke-width="2"/><line x1="302" y1="400" x2="483" y2="400" stroke="#ffd398" stroke-width="4" stroke-dasharray=""/><text x="397" y="382" fill="#ffd398" font-size="29" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">R = c / H₀</text><text x="302" y="623" fill="#ecf3fc" font-size="27" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">A distance marker</text><text x="302" y="660" fill="#a8b9d0" font-size="23" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">No physical wall at this radius</text><line x1="692" y1="583" x2="1082" y2="583" stroke="#21344a" stroke-width="1" stroke-dasharray=""/><line x1="692" y1="583" x2="692" y2="193" stroke="#21344a" stroke-width="1" stroke-dasharray=""/><text x="692" y="617" fill="#a8b9d0" font-size="21" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">0</text><text x="674" y="590" fill="#a8b9d0" font-size="21" text-anchor="end" font-family="Arial,Helvetica,sans-serif">0</text><line x1="692" y1="388" x2="1082" y2="388" stroke="#21344a" stroke-width="1" stroke-dasharray=""/><line x1="887" y1="583" x2="887" y2="193" stroke="#21344a" stroke-width="1" stroke-dasharray=""/><text x="887" y="617" fill="#a8b9d0" font-size="21" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">1</text><text x="674" y="395" fill="#a8b9d0" font-size="21" text-anchor="end" font-family="Arial,Helvetica,sans-serif">1</text><line x1="692" y1="193" x2="1082" y2="193" stroke="#21344a" stroke-width="1" stroke-dasharray=""/><line x1="1082" y1="583" x2="1082" y2="193" stroke="#21344a" stroke-width="1" stroke-dasharray=""/><text x="1082" y="617" fill="#a8b9d0" font-size="21" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">2</text><text x="674" y="200" fill="#a8b9d0" font-size="21" text-anchor="end" font-family="Arial,Helvetica,sans-serif">2</text><line x1="692" y1="583" x2="1082" y2="583" stroke="#ecf3fc" stroke-width="2" stroke-dasharray=""/><line x1="692" y1="583" x2="692" y2="193" stroke="#ecf3fc" stroke-width="2" stroke-dasharray=""/><line x1="692" y1="583" x2="1082" y2="193" stroke="#77cff5" stroke-width="5" stroke-dasharray=""/><line x1="887" y1="583" x2="887" y2="388" stroke="#ffd398" stroke-width="2" stroke-dasharray="8 7"/><line x1="692" y1="388" x2="887" y2="388" stroke="#ffd398" stroke-width="2" stroke-dasharray="8 7"/><circle cx="887" cy="388" r="8" fill="#ffd398" stroke="none" stroke-width="2"/><text x="907" y="370" fill="#ffd398" font-size="29" text-anchor="start" font-family="Arial,Helvetica,sans-serif">v = c</text><text x="892" y="665" fill="#a8b9d0" font-size="23" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">Distance / Hubble radius</text><text x="691" y="175" fill="#a8b9d0" font-size="23" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Recession speed / c</text><text x="650" y="716" fill="#ecf3fc" font-size="23" text-anchor="start" font-family="Arial,Helvetica,sans-serif">v = H₀ d · expansion at one cosmic time</text><text x="64" y="756" fill="#a8b9d0" font-size="20" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Original explanatory diagram · NASA/WMAP Hubble law · CC0</text></svg>