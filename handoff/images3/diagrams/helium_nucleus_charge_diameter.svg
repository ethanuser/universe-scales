<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><rect width="1200" height="800" fill="#081321"/><line x1="56" y1="39" x2="100" y2="39" stroke="#ffd398" stroke-width="4" stroke-dasharray=""/><text x="56" y="98" fill="#edf4fc" font-size="43" text-anchor="start" font-weight="bold" font-family="Arial,Helvetica,sans-serif">Helium nucleus charge diameter</text><text x="56" y="143" fill="#a5b8cd" font-size="24" text-anchor="start" font-weight="normal" font-family="Arial,Helvetica,sans-serif">Helium-4 · twice the root-mean-square charge radius</text><defs><radialGradient id="charge"><stop offset="0" stop-color="#fff0cc"/><stop offset="0.25" stop-color="#ffc36c" stop-opacity="0.9"/><stop offset="0.55" stop-color="#f49d4b" stop-opacity="0.35"/><stop offset="1" stop-color="#f49d4b" stop-opacity="0"/></radialGradient></defs><circle cx="354" cy="397" r="253" fill="url(#charge)" stroke="none" stroke-width="2" opacity="1"/><circle cx="354" cy="397" r="160" fill="none" stroke="#ffd398" stroke-width="2" stroke-dasharray="8 9"/><circle cx="354" cy="397" r="4" fill="#edf4fc" stroke="none" stroke-width="2" opacity="1"/><line x1="354" y1="397" x2="514" y2="397" stroke="#ffd398" stroke-width="3" stroke-dasharray=""/><text x="433" y="375" fill="#ffd398" font-size="27" text-anchor="middle" font-weight="normal" font-family="Arial,Helvetica,sans-serif">r rms</text><line x1="194" y1="397" x2="194" y2="608" stroke="#557086" stroke-width="1" stroke-dasharray="5 7"/><line x1="514" y1="397" x2="514" y2="608" stroke="#557086" stroke-width="1" stroke-dasharray="5 7"/><line x1="194" y1="603" x2="514" y2="603" stroke="#ffd398" stroke-width="3" stroke-dasharray=""/><line x1="194" y1="591" x2="194" y2="615" stroke="#ffd398" stroke-width="3" stroke-dasharray=""/><line x1="514" y1="591" x2="514" y2="615" stroke="#ffd398" stroke-width="3" stroke-dasharray=""/><text x="354.0" y="661" fill="#ffd398" font-size="34" text-anchor="middle" font-weight="normal" font-family="Arial,Helvetica,sans-serif">2 × r rms</text><text x="696" y="307" fill="#ffd398" font-size="68" text-anchor="start" font-weight="bold" font-family="Arial,Helvetica,sans-serif">≈ 3.36 fm</text><text x="700" y="362" fill="#edf4fc" font-size="30" text-anchor="start" font-weight="normal" font-family="Arial,Helvetica,sans-serif">Charge spread</text><text x="700" y="403" fill="#a5b8cd" font-size="26" text-anchor="start" font-weight="normal" font-family="Arial,Helvetica,sans-serif">rather than a sharp surface</text><line x1="700" y1="446" x2="1105" y2="446" stroke="#2d4358" stroke-width="1" stroke-dasharray=""/><text x="700" y="492" fill="#edf4fc" font-size="29" text-anchor="start" font-weight="normal" font-family="Arial,Helvetica,sans-serif">r rms = 1.6785 fm</text><text x="700" y="533" fill="#a5b8cd" font-size="23" text-anchor="start" font-weight="normal" font-family="Arial,Helvetica,sans-serif">CODATA 2022 recommended value</text><text x="600" y="704" fill="#a5b8cd" font-size="23" text-anchor="middle" font-weight="normal" font-family="Arial,Helvetica,sans-serif">Cloud and dashed radius marker are schematic, not a measured density map.</text><line x1="56" y1="741" x2="1144" y2="741" stroke="#24364a" stroke-width="1" stroke-dasharray=""/><text x="56" y="779" fill="#a5b8cd" font-size="19" text-anchor="start" font-weight="normal" font-family="Arial,Helvetica,sans-serif">Original explanatory diagram · CC0</text><text x="1144" y="779" fill="#a5b8cd" font-size="19" text-anchor="end" font-weight="normal" font-family="Arial,Helvetica,sans-serif">NIST · CODATA 2022</text></svg>
