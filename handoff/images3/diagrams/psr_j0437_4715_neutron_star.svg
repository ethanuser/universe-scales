<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><rect width="1200" height="800" fill="#081321"/><line x1="56" y1="39" x2="100" y2="39" stroke="#ffd398" stroke-width="4" stroke-dasharray=""/><text x="56" y="98" fill="#edf4fc" font-size="43" text-anchor="start" font-weight="bold" font-family="Arial,Helvetica,sans-serif">PSR J0437–4715</text><text x="56" y="143" fill="#a5b8cd" font-size="24" text-anchor="start" font-weight="normal" font-family="Arial,Helvetica,sans-serif">Neutron-star size inferred from NICER X-ray pulse modeling · 2024 result</text><defs><radialGradient id="star" cx="35%" cy="29%" r="76%"><stop offset="0" stop-color="#d7f5ff"/><stop offset="0.37" stop-color="#70c9ea"/><stop offset="0.75" stop-color="#237aab"/><stop offset="1" stop-color="#113654"/></radialGradient><clipPath id="disk"><circle cx="350" cy="393" r="178"/></clipPath></defs><circle cx="350" cy="393" r="193" fill="#77c9eb" stroke="none" stroke-width="2" opacity="0.06"/><circle cx="350" cy="393" r="184" fill="#77c9eb" stroke="none" stroke-width="2" opacity="0.09"/><circle cx="350" cy="393" r="178" fill="url(#star)" stroke="#b1e2f4" stroke-width="1" opacity="1"/><g clip-path="url(#disk)" fill="none" stroke="#d5f1ff" opacity="0.22" stroke-width="1.3"><ellipse cx="350" cy="393" rx="178" ry="37"/><ellipse cx="350" cy="393" rx="178" ry="100"/><ellipse cx="350" cy="393" rx="178" ry="155"/><ellipse cx="350" cy="393" rx="62" ry="178"/><ellipse cx="350" cy="393" rx="125" ry="178"/></g><line x1="172" y1="393" x2="528" y2="393" stroke="#ffd398" stroke-width="3" stroke-dasharray="7 6"/><line x1="172" y1="393" x2="172" y2="615" stroke="#557086" stroke-width="1" stroke-dasharray="5 7"/><line x1="528" y1="393" x2="528" y2="615" stroke="#557086" stroke-width="1" stroke-dasharray="5 7"/><line x1="172" y1="610" x2="528" y2="610" stroke="#ffd398" stroke-width="3" stroke-dasharray=""/><line x1="172" y1="598" x2="172" y2="622" stroke="#ffd398" stroke-width="3" stroke-dasharray=""/><line x1="528" y1="598" x2="528" y2="622" stroke="#ffd398" stroke-width="3" stroke-dasharray=""/><text x="350.0" y="668" fill="#ffd398" font-size="40" text-anchor="middle" font-weight="normal" font-family="Arial,Helvetica,sans-serif">≈ 22.7 km</text><text x="680" y="306" fill="#edf4fc" font-size="35" text-anchor="start" font-weight="bold" font-family="Arial,Helvetica,sans-serif">A star on a city’s scale</text><text x="680" y="367" fill="#a5b8cd" font-size="27" text-anchor="start" font-weight="normal" font-family="Arial,Helvetica,sans-serif">Equatorial radius</text><text x="680" y="429" fill="#83d8f2" font-size="56" text-anchor="start" font-weight="normal" font-family="Arial,Helvetica,sans-serif">11.36 km</text><line x1="680" y1="465" x2="1120" y2="465" stroke="#2d4358" stroke-width="1" stroke-dasharray=""/><text x="680" y="511" fill="#edf4fc" font-size="30" text-anchor="start" font-weight="normal" font-family="Arial,Helvetica,sans-serif">Diameter = 2 × radius</text><text x="680" y="551" fill="#a5b8cd" font-size="25" text-anchor="start" font-weight="normal" font-family="Arial,Helvetica,sans-serif">Inferred from a physical model</text><text x="600" y="705" fill="#a5b8cd" font-size="22" text-anchor="middle" font-weight="normal" font-family="Arial,Helvetica,sans-serif">Original size diagram · surface color and grid are illustrative, not an image of the star.</text><line x1="56" y1="741" x2="1144" y2="741" stroke="#24364a" stroke-width="1" stroke-dasharray=""/><text x="56" y="779" fill="#a5b8cd" font-size="19" text-anchor="start" font-weight="normal" font-family="Arial,Helvetica,sans-serif">Original explanatory diagram · CC0</text><text x="1144" y="779" fill="#a5b8cd" font-size="19" text-anchor="end" font-weight="normal" font-family="Arial,Helvetica,sans-serif">NASA / NICER · Choudhury et al. (2024)</text></svg>
