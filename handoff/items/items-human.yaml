- name: Cat Flea
  value: 1.6e-3
  source: https://trace.tennessee.edu/utk_agexdise/16
  description: >-
    An adult cat flea is only about 1.6 mm long, barely bigger than a grain of sand, yet its enlarged
    hind legs can launch it almost 200 times its own height. A human with the same ratio would clear
    something close to the height of the Eiffel Tower. Newly emerged adults jump to a host within
    seconds of leaving the cocoon, so the animal sits just above the 1 mm sand grain and well below the
    5 mm ant while behaving like a spring-loaded projectile.
  measures: body length of an adult
  model_idea: "procedural: laterally flattened body, spiny comb, oversized hind legs; or Sketchfab CC-BY search 'Ctenocephalides felis' (uid unverified)"
  wonder: A mote-sized animal whose jump, scaled to a person, clears a skyscraper.

- name: Fruit Fly
  value: 2.5e-3
  source: https://en.wikipedia.org/wiki/Drosophila_melanogaster
  description: >-
    A female fruit fly (Drosophila melanogaster) is about 2.5 mm long, roughly a third the length of a
    housefly. Its short life cycle and easily studied genes made it a workhorse of biology for more than
    a century, and its entire adult brain has now been mapped as a
    [connectome](https://en.wikipedia.org/wiki/Connectome), a neuron-by-neuron wiring diagram. An insect
    smaller than a grain of rice is therefore one of the few animals whose brain circuitry can be read
    like a circuit board.
  measures: body length of an adult female
  model_idea: "Sketchfab CC-BY search 'Drosophila melanogaster' (uid unverified); or procedural fly with red eyes and striped abdomen"
  wonder: The standard laboratory animal of genetics, small enough that its whole brain wiring is now known.

