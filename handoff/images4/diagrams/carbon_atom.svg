<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><rect x="0" y="0" width="1200" height="800" rx="0" fill="#081321" stroke="none"/><path d="M56,39 L100,39" fill="none" stroke="#ffd398" stroke-width="4" stroke-dasharray=""/><text x="56" y="101" fill="#edf4fc" font-size="46" text-anchor="start" font-weight="bold" font-family="Arial,Helvetica,sans-serif">Carbon atom</text><text x="56" y="148" fill="#a5b8cd" font-size="25" text-anchor="start" font-weight="normal" font-family="Arial,Helvetica,sans-serif">Neutral carbon · a quantum electron cloud</text><defs><radialGradient id="cloud"><stop stop-color="#badff0" stop-opacity="0.8"/><stop offset="0.4" stop-color="#76badc" stop-opacity="0.4"/><stop offset="1" stop-color="#76badc" stop-opacity="0"/></radialGradient></defs><circle cx="360" cy="402" r="238" fill="url(#cloud)" stroke="none" stroke-width="2" opacity="1"/><g transform="translate(360 402) rotate(0)"><ellipse cx="82" rx="130" ry="65" fill="url(#cloud)"/><ellipse cx="-82" rx="130" ry="65" fill="url(#cloud)"/></g><g transform="translate(360 402) rotate(90)"><ellipse cx="82" rx="130" ry="65" fill="url(#cloud)"/><ellipse cx="-82" rx="130" ry="65" fill="url(#cloud)"/></g><circle cx="360" cy="402" r="170" fill="none" stroke="#7995af" stroke-width="1.5" opacity="1"/><circle cx="360" cy="402" r="7" fill="#ffd398" stroke="none" stroke-width="2" opacity="1"/><path d="M190,402 L190,606" fill="none" stroke="#a5b8cd" stroke-width="1" stroke-dasharray="5 7"/><path d="M530,402 L530,606" fill="none" stroke="#a5b8cd" stroke-width="1" stroke-dasharray="5 7"/><path d="M190,603 L530,603" fill="none" stroke="#ffd398" stroke-width="3" stroke-dasharray=""/><path d="M190,591 L190,615" fill="none" stroke="#ffd398" stroke-width="3" stroke-dasharray=""/><path d="M530,591 L530,615" fill="none" stroke="#ffd398" stroke-width="3" stroke-dasharray=""/><text x="360.0" y="660" fill="#ffd398" font-size="40" text-anchor="middle" font-weight="normal" font-family="Arial,Helvetica,sans-serif">140 pm</text><text x="700" y="290" fill="#83d8f2" font-size="53" text-anchor="start" font-weight="bold" font-family="Arial,Helvetica,sans-serif">1s²  2s²  2p²</text><text x="700" y="351" fill="#edf4fc" font-size="31" text-anchor="start" font-weight="normal" font-family="Arial,Helvetica,sans-serif">Six electrons</text><text x="700" y="416" fill="#ffd398" font-size="29" text-anchor="start" font-weight="normal" font-family="Arial,Helvetica,sans-serif">Empirical size convention</text><text x="700" y="461" fill="#a5b8cd" font-size="27" text-anchor="start" font-weight="normal" font-family="Arial,Helvetica,sans-serif">2 × 70 pm atomic radius</text><text x="700" y="522" fill="#edf4fc" font-size="27" text-anchor="start" font-weight="normal" font-family="Arial,Helvetica,sans-serif">The cloud has no hard edge.</text><text x="600" y="705" fill="#a5b8cd" font-size="22" text-anchor="middle" font-weight="normal" font-family="Arial,Helvetica,sans-serif">Schematic orbital shapes and enlarged nucleus · not a measured probability-density map.</text><path d="M56,741 L1144,741" fill="none" stroke="#24364a" stroke-width="1" stroke-dasharray=""/><text x="56" y="780" fill="#a5b8cd" font-size="20" text-anchor="start" font-weight="normal" font-family="Arial,Helvetica,sans-serif">Original explanatory diagram · CC0</text><text x="1144" y="780" fill="#a5b8cd" font-size="19" text-anchor="end" font-weight="normal" font-family="Arial,Helvetica,sans-serif">WebElements · carbon radii</text></svg>
