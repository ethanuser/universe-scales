<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><rect x="0" y="0" width="1200" height="800" rx="0" fill="#081321" stroke="none"/><path d="M56,39 L100,39" fill="none" stroke="#ffd398" stroke-width="4" stroke-dasharray=""/><text x="56" y="101" fill="#edf4fc" font-size="46" text-anchor="start" font-weight="bold" font-family="Arial,Helvetica,sans-serif">Muonic hydrogen atom</text><text x="56" y="148" fill="#a5b8cd" font-size="25" text-anchor="start" font-weight="normal" font-family="Arial,Helvetica,sans-serif">A proton bound to one negative muon</text><defs><radialGradient id="mucloud"><stop stop-color="#83d8f2" stop-opacity="0.85"/><stop offset="0.4" stop-color="#65aed7" stop-opacity="0.25"/><stop offset="1" stop-color="#65aed7" stop-opacity="0"/></radialGradient></defs><circle cx="355" cy="407" r="228" fill="url(#mucloud)" stroke="none" stroke-width="2" opacity="1"/><circle cx="355" cy="407" r="9" fill="#ffd398" stroke="none" stroke-width="2" opacity="1"/><circle cx="355" cy="407" r="159" fill="none" stroke="#67869e" stroke-width="1.5" opacity="1"/><path d="M355,407 L514,407" fill="none" stroke="#ffd398" stroke-width="2" stroke-dasharray=""/><text x="438" y="388" fill="#ffd398" font-size="29" text-anchor="middle" font-weight="normal" font-family="Arial,Helvetica,sans-serif">aμ</text><text x="720" y="292" fill="#ffd398" font-size="59" text-anchor="start" font-weight="bold" font-family="Arial,Helvetica,sans-serif">≈ 0.57 pm</text><text x="720" y="352" fill="#edf4fc" font-size="28" text-anchor="start" font-weight="normal" font-family="Arial,Helvetica,sans-serif">2 × muonic Bohr radius</text><text x="720" y="422" fill="#83d8f2" font-size="35" text-anchor="start" font-weight="normal" font-family="Arial,Helvetica,sans-serif">aμ ≈ 285 fm</text><text x="720" y="485" fill="#a5b8cd" font-size="26" text-anchor="start" font-weight="normal" font-family="Arial,Helvetica,sans-serif">Muon probability cloud</text><text x="720" y="531" fill="#a5b8cd" font-size="24" text-anchor="start" font-weight="normal" font-family="Arial,Helvetica,sans-serif">Proton enlarged for visibility</text><path d="M196,610 L514,610" fill="none" stroke="#ffd398" stroke-width="3" stroke-dasharray=""/><path d="M196,598 L196,622" fill="none" stroke="#ffd398" stroke-width="3" stroke-dasharray=""/><path d="M514,598 L514,622" fill="none" stroke="#ffd398" stroke-width="3" stroke-dasharray=""/><text x="355.0" y="667" fill="#ffd398" font-size="38" text-anchor="middle" font-weight="normal" font-family="Arial,Helvetica,sans-serif">2aμ</text><text x="600" y="710" fill="#a5b8cd" font-size="23" text-anchor="middle" font-weight="normal" font-family="Arial,Helvetica,sans-serif">Characteristic size convention · the bound-state cloud extends beyond this radius.</text><path d="M56,741 L1144,741" fill="none" stroke="#24364a" stroke-width="1" stroke-dasharray=""/><text x="56" y="780" fill="#a5b8cd" font-size="20" text-anchor="start" font-weight="normal" font-family="Arial,Helvetica,sans-serif">Original explanatory diagram · CC0</text><text x="1144" y="780" fill="#a5b8cd" font-size="19" text-anchor="end" font-weight="normal" font-family="Arial,Helvetica,sans-serif">FAMU collaboration (2020)</text></svg>
