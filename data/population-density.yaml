dimension: population-density
base_unit: people_per_square_kilometer
dimension_description: Population density here means people per unit total land area. It is a clean way to compare remote regions, countries, city-states, boroughs, and extreme urban enclaves. Because jurisdiction boundaries matter, the label should always say what region is being measured.
related_resources:
- name: Population density
  url: https://en.wikipedia.org/wiki/Population_density
show_limitations: true
units:
- name: people per square kilometer
  symbol: people/km^2
  conversion_factor: 1.0
  description: People per square kilometer are the canonical storage unit for population density.
- name: people per hectare
  symbol: people/ha
  conversion_factor: 0.01
  description: People per hectare are useful for urban density.
- name: people per square mile
  symbol: people/mi^2
  conversion_factor: 2.5899881103
  description: People per square mile are familiar in the United States.
- name: people per square meter
  symbol: people/m^2
  conversion_factor: 1.0e-06
  description: People per square meter are useful only for extremely dense spaces.
required_min_items: 24
preferred_target_items: 50
preferred_max_items: 80
selection_bin_count: 24
description_format: markdown
scale_mode: log
frontend_group: global
frontend_group_label: Global & Geography
frontend_order: 810
items:
