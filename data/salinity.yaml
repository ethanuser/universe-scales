dimension: salinity
base_unit: mass_fraction
dimension_description: This salinity scale stores dissolved-salt content as mass fraction. That makes freshwater, blood plasma, seawater, brines, and hypersaline lakes comparable on one axis. The exact chemical makeup varies, so these are representative total-salinity benchmarks rather than precise ionic analyses.
related_resources:
- name: Salinity
  url: https://en.wikipedia.org/wiki/Salinity
show_limitations: true
units:
- name: mass fraction
  symbol: fraction
  conversion_factor: 1.0
  description: Mass fraction of dissolved salts.
- name: percent salt by mass
  symbol: '%'
  conversion_factor: 100.0
  description: Familiar percent salinity.
- name: parts per thousand
  symbol: ppt
  conversion_factor: 1000.0
  description: Oceanography-style salinity unit.
- name: parts per million
  symbol: ppm
  conversion_factor: 1000000.0
  description: Useful for freshwater trace salinity.
required_min_items: 24
preferred_target_items: 50
preferred_max_items: 80
selection_bin_count: 24
description_format: markdown
scale_mode: log
frontend_group: materials
frontend_group_label: Materials & Matter
frontend_order: 480
