dimension: viscosity
base_unit: pascal_seconds
dimension_description: Dynamic viscosity measures how strongly a fluid resists being sheared or made to flow. Some entries are ordinary room-temperature liquids, others are effective viscosities for materials like glacier ice or the mantle that only flow over long timescales. Because viscosity changes strongly with temperature and composition, qualifiers matter here more than they do for many other scales.
related_resources:
- name: Viscosity
  url: https://en.wikipedia.org/wiki/Viscosity
- name: Dynamic viscosity
  url: https://en.wikipedia.org/wiki/Viscosity#Dynamic_viscosity
show_limitations: true
units:
- conversion_factor: 1.0
  description: Pascal-seconds are the canonical storage unit for dynamic viscosity.
  name: pascal-seconds
  symbol: Pa*s
- name: millipascal-seconds
  symbol: mPa*s
  conversion_factor: 1000.0
  description: Millipascal-seconds are intuitive for ordinary liquids near room temperature.
- name: centipoise
  symbol: cP
  conversion_factor: 1000.0
  description: Centipoise remain common in chemistry and fluid-property tables.
- name: kilopascal-seconds
  symbol: kPa*s
  conversion_factor: 0.001
  description: Kilopascal-seconds help with very thick fluids and soft solids.
- name: megapascal-seconds
  symbol: MPa*s
  conversion_factor: 1.0e-06
  description: Megapascal-seconds are useful for bitumen, pitch, and viscous magma.
required_min_items: 24
preferred_target_items: 50
preferred_max_items: 80
selection_bin_count: 24
description_format: markdown
scale_mode: log
frontend_group: materials
frontend_group_label: Materials & Matter
frontend_order: 450
