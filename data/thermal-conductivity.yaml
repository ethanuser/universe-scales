dimension: thermal-conductivity
base_unit: watts_per_meter_kelvin
dimension_description: Thermal conductivity measures how readily heat flows through a material under a temperature gradient. It helps connect insulators, building materials, fluids, metals, semiconductors, and diamond on one scale. Values depend on temperature, porosity, and orientation, so they should be read as representative rather than universal.
related_resources:
- name: Thermal conductivity
  url: https://en.wikipedia.org/wiki/Thermal_conductivity
show_limitations: true
units:
- name: watts per meter kelvin
  symbol: W/(m*K)
  conversion_factor: 1.0
  description: Watts per meter kelvin are the canonical storage unit for thermal conductivity.
- name: milliwatts per meter kelvin
  symbol: mW/(m*K)
  conversion_factor: 1000.0
  description: Useful for insulators and gases.
- name: kilowatts per meter kelvin
  symbol: kW/(m*K)
  conversion_factor: 0.001
  description: Useful for extreme conductors.
required_min_items: 24
preferred_target_items: 50
preferred_max_items: 80
selection_bin_count: 24
description_format: markdown
scale_mode: log
frontend_group: materials
frontend_group_label: Materials & Matter
frontend_order: 520
