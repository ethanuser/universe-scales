dimension: sound-intensity
base_unit: watts_per_square_meter
dimension_description: This scale stores acoustic intensity in watts per square meter, but by default it can be read in decibels because that is how people usually reason about loudness. Most source-side figures are reported in dB SPL and then converted into physical intensity for canonical storage, so the item names emphasize context such as distance from the source. That keeps whispers, appliances, traffic, thunder, jets, and launch pads on one comparable axis while still allowing direct intensity units when needed.
related_resources:
- name: Sound intensity
  url: https://en.wikipedia.org/wiki/Sound_intensity
- name: Sound intensity level
  url: https://en.wikipedia.org/wiki/Sound_intensity#Sound_intensity_level
show_limitations: true
units:
- name: watts per square meter
  symbol: W/m^2
  conversion_factor: 1.0
  description: Watts per square meter are the canonical storage unit for sound intensity.
- name: decibels
  symbol: dB
  conversion_factor: 1.0
  description: Decibel sound level referenced to the standard threshold of hearing. This is the most intuitive default way to read loudness, even though the canonical stored quantity is physical intensity.
- name: microwatts per square meter
  symbol: uW/m^2
  conversion_factor: 1000000.0
  description: Microwatts per square meter are useful for quiet everyday sound levels.
- name: milliwatts per square meter
  symbol: mW/m^2
  conversion_factor: 1000.0
  description: Milliwatts per square meter are useful for loud urban or industrial sound.
required_min_items: 24
preferred_target_items: 50
preferred_max_items: 80
selection_bin_count: 24
description_format: markdown
scale_mode: log
frontend_group: fields
frontend_group_label: Fields, Waves & Radiation
frontend_order: 550
