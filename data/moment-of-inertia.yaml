dimension: moment-of-inertia
base_unit: kilogram_square_meters
dimension_description: Moment of inertia measures resistance to angular acceleration. It depends not just on mass but on how far that mass sits from the axis, which is why a bicycle wheel, a door, and the Earth can all appear here meaningfully. Values are always axis-specific, so the item label matters a lot.
related_resources:
- name: Moment of inertia
  url: https://en.wikipedia.org/wiki/Moment_of_inertia
show_limitations: true
units:
- name: kilogram square meters
  symbol: kg*m^2
  conversion_factor: 1.0
  description: Kilogram square meters are the canonical storage unit for moment of inertia.
- name: gram square centimeters
  symbol: g*cm^2
  conversion_factor: 10000000.0
  description: Common small-rotor and flywheel unit.
required_min_items: 24
preferred_target_items: 50
preferred_max_items: 80
selection_bin_count: 24
description_format: markdown
scale_mode: log
frontend_group: motion
frontend_group_label: Motion & Mechanics
frontend_order: 370
