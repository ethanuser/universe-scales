dimension: magnetic-field
base_unit: tesla
dimension_description: Magnetic-field strength is expressed here as magnetic flux density in tesla. Some entries are ambient fields, some are surface fields of magnets or stars, and others are instrument fields from MRI scanners or laboratory magnets. The result is a scale that connects biology, everyday magnets, planets, plasma devices, and compact stars.
related_resources:
- name: Magnetic field
  url: https://en.wikipedia.org/wiki/Magnetic_field
- name: Tesla (unit)
  url: https://en.wikipedia.org/wiki/Tesla_(unit)
show_limitations: true
units:
- conversion_factor: 1.0
  description: Tesla are the canonical storage unit for magnetic-field strength.
  name: tesla
  symbol: T
- name: microtesla
  symbol: uT
  conversion_factor: 1000000.0
  description: Microtesla are useful for planetary and ambient environmental fields.
- name: millitesla
  symbol: mT
  conversion_factor: 1000.0
  description: Millitesla are useful for everyday magnets and sensors.
- name: gauss
  symbol: G
  conversion_factor: 10000.0
  description: Gauss remain common in magnetics, astronomy, and older literature.
- name: kilotesla
  symbol: kT
  conversion_factor: 0.001
  description: Kilotesla are useful for white dwarfs and extreme laboratory fields.
- name: megatesla
  symbol: MT
  conversion_factor: 1.0e-06
  description: Megatesla are useful for neutron stars and extreme astrophysical fields.
- name: gigatesla
  symbol: GT
  conversion_factor: 1.0e-09
  description: Gigatesla are useful for magnetars and the most extreme known fields.
required_min_items: 24
preferred_target_items: 50
preferred_max_items: 80
selection_bin_count: 24
description_format: markdown
scale_mode: log
frontend_group: fields
frontend_group_label: Fields, Waves & Radiation
frontend_order: 540
