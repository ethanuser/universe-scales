dimension: attention
base_unit: person_seconds
dimension_description: This scale treats attention pragmatically as person-seconds of engaged time. That is more comparable and more additive than raw views, impressions, or clicks, and it lets a glance, a lecture, a concert, and a livestream all live on one axis. Views and audience counts can still appear as qualifiers or source notes.
related_resources:
- name: Attention
  url: https://en.wikipedia.org/wiki/Attention
show_limitations: true
units:
- name: person-seconds
  symbol: person*s
  conversion_factor: 1.0
  description: Person-seconds are the canonical storage unit for this attention scale.
- name: person-minutes
  symbol: person*min
  conversion_factor: 0.0166666666667
  description: Person-minutes are useful for short media and tasks.
- name: person-hours
  symbol: person*h
  conversion_factor: 0.0002777777778
  description: Person-hours are useful for classes, meetings, and media.
- name: person-days
  symbol: person*d
  conversion_factor: 1.15740741e-05
  description: Person-days are useful for aggregate events and projects.
- name: person-years
  symbol: person*yr
  conversion_factor: 3.168808781e-08
  description: Person-years are useful for very large attention totals.
required_min_items: 24
preferred_target_items: 50
preferred_max_items: 80
selection_bin_count: 24
description_format: markdown
scale_mode: log
frontend_group: society
frontend_group_label: Society, Economy & Abstract Quantities
frontend_order: 1090
