dimension: flow-rate
base_unit: cubic_meters_per_second
dimension_description: Flow rate measures how much volume passes a boundary per unit time. This scale is useful for comparing microfluidics, medical drips, household plumbing, industrial systems, and the largest geophysical currents and rivers. Flow depends strongly on context, so representative operating conditions are part of the meaning.
related_resources:
- name: Volumetric flow rate
  url: https://en.wikipedia.org/wiki/Volumetric_flow_rate
- name: Flow measurement
  url: https://en.wikipedia.org/wiki/Flow_measurement
show_limitations: true
units:
- name: cubic meters per second
  symbol: m^3/s
  conversion_factor: 1.0
  description: Cubic meters per second are the canonical storage unit for volumetric flow rate.
- name: liters per second
  symbol: L/s
  conversion_factor: 1000.0
  description: Liters per second are useful for plumbing, pumps, and physiology.
- name: milliliters per second
  symbol: mL/s
  conversion_factor: 1000000.0
  description: Milliliters per second are useful for drips and microfluidics.
- name: liters per minute
  symbol: L/min
  conversion_factor: 60000.0
  description: Liters per minute are useful for household and industrial flow.
required_min_items: 24
preferred_target_items: 50
preferred_max_items: 80
selection_bin_count: 24
description_format: markdown
scale_mode: log
frontend_group: materials
frontend_group_label: Materials & Matter
frontend_order: 460
