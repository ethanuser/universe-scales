dimension: historical-time
base_unit: years
dimension_description: 'Historical time is stored here as years before the present, so that human memory, recorded history, deep prehistory, and cosmological time can live on one logarithmic axis. It overlaps with duration, but the emphasis is different: these entries are about how far back events sit from now, not how long a process lasted.'
related_resources:
- name: Chronology
  url: https://en.wikipedia.org/wiki/Chronology
- name: Age of the universe
  url: https://en.wikipedia.org/wiki/Age_of_the_universe
show_limitations: true
units:
- name: years
  symbol: yr
  conversion_factor: 1.0
  description: Years are the canonical storage unit for historical time in this dataset.
- name: days
  symbol: d
  conversion_factor: 365.25
  description: Days are useful for recent historical offsets.
- name: thousand years
  symbol: kyr
  conversion_factor: 0.001
  description: Thousands of years are useful for archaeology and prehistory.
- name: million years
  symbol: Myr
  conversion_factor: 1.0e-06
  description: Millions of years are useful for geology and evolution.
- name: billion years
  symbol: Gyr
  conversion_factor: 1.0e-09
  description: Billions of years are useful for planetary and cosmic history.
required_min_items: 24
preferred_target_items: 50
preferred_max_items: 80
selection_bin_count: 24
description_format: markdown
scale_mode: log
frontend_group: society
frontend_group_label: Society, Economy & Abstract Quantities
frontend_order: 1020
