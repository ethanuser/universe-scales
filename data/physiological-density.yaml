dimension: physiological-density
base_unit: people_per_square_kilometer_arable_land
dimension_description: Physiological density is population divided by arable land area rather than total land area. That makes it a rough measure of how heavily a society leans on its food-producing land. It is more conceptually loaded than ordinary population density, so the arable-land qualifier is essential.
related_resources:
- name: Physiological density
  url: https://en.wikipedia.org/wiki/Physiological_density
show_limitations: true
units:
- name: people per square kilometer of arable land
  symbol: people/km^2 arable
  conversion_factor: 1.0
  description: People per square kilometer of arable land are the canonical storage unit for physiological density.
- name: people per hectare of arable land
  symbol: people/ha arable
  conversion_factor: 0.01
  description: People per hectare of arable land.
- name: people per square mile of arable land
  symbol: people/mi^2 arable
  conversion_factor: 2.5899881103
  description: People per square mile of arable land.
required_min_items: 24
preferred_target_items: 50
preferred_max_items: 80
selection_bin_count: 24
description_format: markdown
scale_mode: log
frontend_group: global
frontend_group_label: Global & Geography
frontend_order: 820
