dimension: specific-heat
base_unit: joules_per_kilogram_kelvin
dimension_description: Specific heat capacity measures how much energy a kilogram of material needs to change temperature by one kelvin. This scale is good for intuition about why water moderates climate, why metals heat quickly, and why gases and cryogens behave so differently. Values depend on temperature and phase, so representative conditions matter.
related_resources:
- name: Specific heat capacity
  url: https://en.wikipedia.org/wiki/Specific_heat_capacity
show_limitations: true
units:
- name: joules per kilogram kelvin
  symbol: J/(kg*K)
  conversion_factor: 1.0
  description: Joules per kilogram kelvin are the canonical storage unit for specific heat.
- name: kilojoules per kilogram kelvin
  symbol: kJ/(kg*K)
  conversion_factor: 0.001
  description: Common thermodynamics display unit.
- name: joules per gram kelvin
  symbol: J/(g*K)
  conversion_factor: 0.001
  description: Convenient materials-science unit.
- name: calories per gram kelvin
  symbol: cal/(g*K)
  conversion_factor: 0.0002390057361
  description: Older calorimetry-style unit.
required_min_items: 24
preferred_target_items: 50
preferred_max_items: 80
selection_bin_count: 24
description_format: markdown
scale_mode: log
frontend_group: materials
frontend_group_label: Materials & Matter
frontend_order: 530
