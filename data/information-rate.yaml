dimension: information-rate
base_unit: bits_per_second
dimension_description: Information rate measures how quickly symbols, bits, or higher-level messages move through a channel. Some entries here are literal interface or codec rates quoted directly by a standard, while others are derived from a source-side rate such as bytes per second or DNA bases per second. That lets one logarithmic axis connect teletypes, genomes, display links, Ethernet, and modern memory buses.
related_resources:
- name: Bit rate
  url: https://en.wikipedia.org/wiki/Bit_rate
- name: Data-rate units
  url: https://en.wikipedia.org/wiki/Data-rate_units
show_limitations: true
units:
- conversion_factor: 1.0
  description: Bits per second are the canonical storage unit for information-rate observations.
  name: bits per second
  symbol: bit/s
- name: bytes per second
  symbol: B/s
  conversion_factor: 0.125
  description: Bytes per second are useful for storage devices, downloads, and memory bandwidth.
- name: kilobits per second
  symbol: kbit/s
  conversion_factor: 0.001
  description: Kilobits per second are common for older modems, audio codecs, and navigation messages.
- name: megabits per second
  symbol: Mbit/s
  conversion_factor: 1.0e-06
  description: Megabits per second are common for household internet and media streams.
- name: gigabits per second
  symbol: Gbit/s
  conversion_factor: 1.0e-09
  description: Gigabits per second are useful for modern networking, display links, and high-speed I/O.
- name: terabits per second
  symbol: Tbit/s
  conversion_factor: 1.0e-12
  description: Terabits per second are useful for memory stacks and backbone-scale interfaces.
- name: kilobytes per second
  symbol: kB/s
  conversion_factor: 0.000125
  description: Kilobytes per second remain intuitive for small file transfers and legacy devices.
- name: megabytes per second
  symbol: MB/s
  conversion_factor: 1.25e-07
  description: Megabytes per second are useful for storage and memory comparisons.
- name: gigabytes per second
  symbol: GB/s
  conversion_factor: 1.25e-10
  description: Gigabytes per second are useful for high-end memory and interconnect bandwidth.
required_min_items: 24
preferred_target_items: 50
preferred_max_items: 80
selection_bin_count: 24
description_format: markdown
scale_mode: log
frontend_group: information
frontend_group_label: Information & Computation
frontend_order: 620
