dimension: sound-frequency
base_unit: hertz
dimension_description: This hearing-focused frequency scale emphasizes sound-producing or sound-perceiving systems rather than arbitrary oscillations. It connects musical pitch, voice, animal calls, ultrasound, and familiar engineering standards. Because many sources quote ranges, several items use representative center frequencies.
related_resources:
- name: Audio frequency
  url: https://en.wikipedia.org/wiki/Audio_frequency
- name: Pitch (music)
  url: https://en.wikipedia.org/wiki/Pitch_(music)
show_limitations: true
units:
- name: hertz
  symbol: Hz
  conversion_factor: 1.0
  description: Hertz are the canonical storage unit for sound frequency.
- name: kilohertz
  symbol: kHz
  conversion_factor: 0.001
  description: Kilohertz are useful for speech, audio engineering, and many animal calls.
- name: megahertz
  symbol: MHz
  conversion_factor: 1.0e-06
  description: Megahertz are useful for ultrasound systems.
required_min_items: 24
preferred_target_items: 50
preferred_max_items: 80
selection_bin_count: 24
description_format: markdown
scale_mode: log
frontend_group: senses
frontend_group_label: Senses & Perception
frontend_order: 730
