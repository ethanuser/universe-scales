dimension: agricultural-density
base_unit: farmers_per_square_kilometer_arable_land
dimension_description: Agricultural density is agricultural population divided by arable land area. It is often used to contrast labor-intensive farming with heavily mechanized farming. The numerator is not total population, so that qualifier should stay visible anywhere the value is shown.
related_resources:
- name: Agricultural density
  url: https://en.wikipedia.org/wiki/Agricultural_density
show_limitations: true
units:
- name: farmers per square kilometer of arable land
  symbol: farmers/km^2 arable
  conversion_factor: 1.0
  description: Farmers per square kilometer of arable land are the canonical storage unit for agricultural density.
- name: farmers per hectare of arable land
  symbol: farmers/ha arable
  conversion_factor: 0.01
  description: Farmers per hectare of arable land.
- name: farmers per square mile of arable land
  symbol: farmers/mi^2 arable
  conversion_factor: 2.5899881103
  description: Farmers per square mile of arable land.
required_min_items: 24
preferred_target_items: 50
preferred_max_items: 80
selection_bin_count: 24
description_format: markdown
scale_mode: log
frontend_group: global
frontend_group_label: Global & Geography
frontend_order: 830
