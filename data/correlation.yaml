dimension: correlation
base_unit: absolute_pearson_r
dimension_description: 'This phase-one correlation scale stores the magnitude of Pearson correlation as |r|, from almost no linear association up to perfect correlation. The sign and domain context belong in qualifiers, because a strong negative correlation is just as strong as a strong positive one. This is useful pedagogically, but it is also easy to misuse: correlation depends on the variables chosen, sample definition, and whether the underlying relationship is actually linear.'
related_resources:
- name: Pearson correlation coefficient
  url: https://en.wikipedia.org/wiki/Pearson_correlation_coefficient
- name: Effect size
  url: https://en.wikipedia.org/wiki/Effect_size
show_limitations: true
units:
- name: absolute Pearson correlation
  symbol: '|r|'
  conversion_factor: 1.0
  description: The canonical stored unit is the absolute magnitude of Pearson correlation.
- name: percent of perfect correlation
  symbol: '% perfect'
  conversion_factor: 100.0
  description: 100% means a perfect linear correlation magnitude of 1.
- name: permille of perfect correlation
  symbol: permille
  conversion_factor: 1000.0
  description: Permille is handy for very tiny correlation magnitudes.
- name: basis points of perfect correlation
  symbol: bp
  conversion_factor: 10000.0
  description: Basis points are useful when comparing very small correlations.
required_min_items: 24
preferred_target_items: 50
preferred_max_items: 80
selection_bin_count: 24
description_format: markdown
scale_mode: linear
frontend_group: society
frontend_group_label: Society, Economy & Abstract Quantities
frontend_order: 1060
