dimension: angular-velocity
base_unit: radians_per_second
dimension_description: Angular velocity measures how fast something rotates. This scale connects orbital motion, clocks, household appliances, turbines, and compact stars. Many entries are converted from revolutions per minute or periods, so the derivations are intentionally exposed.
related_resources:
- name: Angular velocity
  url: https://en.wikipedia.org/wiki/Angular_velocity
- name: Radians per second
  url: https://en.wikipedia.org/wiki/Radian_per_second
show_limitations: true
units:
- name: radians per second
  symbol: rad/s
  conversion_factor: 1.0
  description: Radians per second are the canonical storage unit for angular velocity.
- name: revolutions per minute
  symbol: rpm
  conversion_factor: 9.54929658551
  description: RPM is a familiar rotation-rate unit for motors and appliances.
- name: degrees per second
  symbol: deg/s
  conversion_factor: 57.2957795131
  description: Degrees per second are useful in motion-control systems.
required_min_items: 24
preferred_target_items: 50
preferred_max_items: 80
selection_bin_count: 24
description_format: markdown
scale_mode: log
frontend_group: motion
frontend_group_label: Motion & Mechanics
frontend_order: 390
