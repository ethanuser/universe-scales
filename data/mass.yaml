dimension: mass
base_unit: kilograms
dimension_description: Mass tracks inertia and the amount of matter under a stated definition, from subatomic particles to galaxies. Some entries are direct measurements, while others are derived estimates such as the mass of a lake from its volume and density. Every item names the object and the measurement basis so the scale remains comparable.
related_resources:
- name: Wikidata mass property
  url: https://www.wikidata.org/wiki/Property:P2067
- name: Mass
  url: https://en.wikipedia.org/wiki/Mass
show_limitations: true
units:
- conversion_factor: 1.0
  description: The kilogram is the SI base unit of mass. All canonical mass values in this dataset are stored in kilograms before conversion.
  name: kilograms
  symbol: kg
- conversion_factor: 1000.0
  description: Grams are convenient for laboratory and everyday masses.
  name: grams
  symbol: g
- conversion_factor: 1000000.0
  description: Milligrams make very small biological and chemical masses readable.
  name: milligrams
  symbol: mg
- conversion_factor: 0.001
  description: Metric tons are useful for vehicles, buildings, and cargo.
  name: metric tons
  symbol: t
- conversion_factor: 1.6744248350691536e-25
  description: Earth masses are convenient for planetary comparisons.
  name: earth masses
  symbol: M_earth
- conversion_factor: 5.027652086475616e-31
  description: Solar masses are convenient for stars, galaxies, and cosmology.
  name: solar masses
  symbol: M_sun
- name: micrograms
  symbol: ug
  conversion_factor: 1000000000.0
  description: Micrograms are useful for drugs, particulates, and trace quantities.
- name: ounces
  symbol: oz
  conversion_factor: 35.27396195
  description: Ounces are a familiar small-mass unit in everyday contexts.
- name: pounds
  symbol: lb
  conversion_factor: 2.2046226218
  description: Pounds are a familiar body-mass and cargo unit in the United States.
- name: atomic mass units
  symbol: u
  conversion_factor: 6.0221407621e+26
  description: Atomic mass units are useful for atoms, isotopes, and molecules.
- name: carats
  symbol: ct
  conversion_factor: 5000.0
  description: Carats are used for gemstones and other small high-value masses.
- name: lunar masses
  symbol: M_moon
  conversion_factor: 1.3605442176871e-23
  description: Lunar masses are useful for moons and small planetary bodies.
- name: jupiter masses
  symbol: M_jup
  conversion_factor: 5.2687038988409e-28
  description: Jupiter masses are useful for giant planets and brown dwarfs.
- name: Planck masses
  symbol: m_P
  conversion_factor: 45946714.65122226
  description: Planck mass is the natural quantum-gravity mass scale.
