dimension: frequency
base_unit: hertz
dimension_description: Frequency measures how often something repeats per second, from once-per-cosmic-era cycles to electromagnetic radiation oscillating millions of trillions of times each second. Some entries here are direct oscillation frequencies, while others are derived from a reported period using frequency = 1 / period. That makes this dimension especially useful for connecting rotations, rhythms, waves, resonance, and light on a single logarithmic axis.
related_resources:
- name: Frequency
  url: https://en.wikipedia.org/wiki/Frequency
- name: Angular frequency and oscillation
  url: https://en.wikipedia.org/wiki/Angular_frequency
show_limitations: true
units:
- conversion_factor: 1.0
  description: Hertz are cycles per second and the canonical storage unit for frequency.
  name: hertz
  symbol: Hz
- conversion_factor: 1000000.0
  description: Microhertz are useful for very slow astronomical or geological cycles.
  name: microhertz
  symbol: uHz
- name: millihertz
  symbol: mHz
  conversion_factor: 1000.0
  description: Millihertz are useful for very slow cycles such as astronomical and climatic periods.
- name: kilohertz
  symbol: kHz
  conversion_factor: 0.001
  description: Kilohertz are useful for sound, motors, and rotating machinery.
- name: megahertz
  symbol: MHz
  conversion_factor: 1.0e-06
  description: Megahertz are useful for radio, resonance, and spectroscopy.
- name: gigahertz
  symbol: GHz
  conversion_factor: 1.0e-09
  description: Gigahertz are useful for microwaves, wireless systems, and atomic transitions.
- name: terahertz
  symbol: THz
  conversion_factor: 1.0e-12
  description: Terahertz are useful for infrared and submillimeter radiation.
- name: revolutions per minute
  symbol: rpm
  conversion_factor: 60.0
  description: RPM gives an intuitive view of rotating machinery and cyclic motion.
required_min_items: 24
preferred_target_items: 50
preferred_max_items: 80
selection_bin_count: 24
description_format: markdown
scale_mode: log
frontend_group: fields
frontend_group_label: Fields, Waves & Radiation
frontend_order: 510
