  description: The diameter of the observable universe, the ultimate limit of what we can see. This boundary exists because light has only had 13.8 billion years to travel since the Big Bang. Beyond this distance, objects are receding faster than light can reach us due to cosmic expansion. The observable universe contains about 2 trillion galaxies and represents only a tiny fraction of the entire universe, which may be infinite in extent. This diameter defines the horizon of human knowledge about cosmic reality.
