- id: obs:length:entity-universe
  name: Observable Universe
  value: 8.8e+26
  description: The diameter of the observable universe, the ultimate limit of what we can see. This boundary exists because light has only had 13.8 billion years to travel since the Big Bang. Cosmic expansion has stretched the present distance to those regions to about 46.5 billion light-years; recession faster than light does not by itself make a galaxy unobservable. The observable universe contains about 2 trillion galaxies and may represent only a tiny fraction of the entire universe, which may be infinite in extent. This diameter defines the horizon of human knowledge about cosmic reality.
