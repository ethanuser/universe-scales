- id: obs:length:scenario-length-quark
  name: Quark
  value: 4.3e-19
  description: An experimental upper limit on an effective quark radius from combined HERA electron-proton collision data, at 95% confidence within the study's form-factor model. It is not a measured particle surface. Quarks are never found alone due to 'color confinement' - the strong force becomes stronger as you try to separate them, like cosmic rubber bands. Scattering lets us probe these hidden building blocks without ever holding an isolated quark in our hands.
