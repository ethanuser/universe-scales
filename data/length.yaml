- id: obs:length:scenario-length-oort-cloud
  name: Oort Cloud
  value: 2.991957414e+16
  description: A representative 200,000-au diameter of the hypothesized Oort Cloud, using the upper end of NASA's uncertain 10,000-100,000-au outer-radius range. This vast reservoir of icy objects lies at the outer reaches of our solar system rather than having a directly observed sharp edge. This distant region contains trillions of comets and extends halfway to the nearest star. The Oort Cloud is the source of long-period comets that occasionally visit the inner solar system. These icy bodies are pristine remnants from the solar system's formation, preserving the original composition of the protoplanetary disk.
