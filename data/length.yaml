- id: obs:length:scenario-length-sloan-great-wall
  name: Sloan Great Wall
  value: 1.388554911671115e+25
  description: The length of the Sloan Great Wall, one of the largest structures in the observable universe. This massive filament contains thousands of galaxies arranged in a wall-like formation. Gott and colleagues estimated its curved length as 450 megaparsecs in present-epoch comoving coordinates, about 1.47 billion light-years. At the epoch seen in its light, the same estimate is about 419 Mpc. Such walls also occur in simulations of standard cosmology; their connected extent depends on how the structure is defined. This structure represents the cosmic web's filamentary nature, where galaxies cluster along vast interconnected threads.
