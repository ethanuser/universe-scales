- id: obs:length:scenario-length-weak-force-range
  name: Weak Force Range
  value: 2.4552562474181655e-18
  description: The weak force, which lets the Sun fuse hydrogen and makes some atomic nuclei decay, reaches only about 2.5 billionths of a billionth of a meter. Its carriers, the W and Z bosons, are about 86 times heavier than a proton, and a force carried by heavy particles fades within roughly their reduced Compton wavelength, here hbar divided by the W mass times the speed of light. A proton is about 340 times wider than the reach of this force.
