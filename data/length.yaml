  name: Atomic Nucleus
  value: 1.0e-14
  description: The diameter of atomic nuclei, where 99.97% of an atom's mass is concentrated in a space 100,000 times smaller than the atom itself. Nuclear size scales roughly as the cube root of atomic mass, meaning uranium nuclei are only about 6 times larger than hydrogen nuclei despite being 238 times more massive. This incredible density means nuclear matter is 100 trillion times denser than water.
