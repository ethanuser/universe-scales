- id: obs:length:scenario-length-hercules-corona-borealis-great-wall
  name: Hercules-Corona Borealis Great Wall
  value: 9.4607304725808e+25
  description: A reported gamma-ray-burst concentration nicknamed the Hercules-Corona Borealis Great Wall, with a proposed extent of roughly 2,000-3,000 megaparsecs. The marker uses the upper end, about 10 billion light-years; it is not a measured edge of a mapped galaxy wall. Bursts can act as distant tracers of stellar populations, but their rarity and uneven detection make this an intriguing, disputed inference. Studies disagree about whether selection effects can explain the clustering. The question is not whether a visible wall fills this span, but whether sparse flashes reveal an unusually large structure.
