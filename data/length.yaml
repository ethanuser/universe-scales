- id: obs:length:scenario-length-infrared-wavelength
  name: Infrared Wavelength
  value: 9.35e-06
  description: A body near 310 K, roughly human body temperature, emits a broad spread of thermal radiation. Wien's law puts the peak of its wavelength spectrum near 9.35 µm, deep in the infrared. This is why thermal cameras look at wavelengths far longer than visible light. The peak is only a marker within that broad spectrum, not the sole wavelength emitted, and a real body's emissivity changes its detailed spectrum. [NASA explains the temperature and peak-wavelength relation](https://lhea.gsfc.nasa.gov/archive/mwmw/mmw_bbody.html).
