- id: obs:length:scenario-length-electron
  name: Electron
  value: 2.8179403205e-15
  description: The classical electron radius, an electromagnetic length scale derived from its charge and rest energy, not an observed electron size. Electrons appear point-like in experiments. In the classical picture, spreading a charge over a small sphere stores electrostatic energy; equating a characteristic Coulomb energy to the electron's rest energy gives this scale. The exact self-energy depends on the assumed charge distribution, so it does not define a physical surface for the electron.
