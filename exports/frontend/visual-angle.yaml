dimension: visual-angle
base_unit: radians
dimension_description: Visual angle measures how large something looks from a given viewpoint. It is one of the most direct ways to compare the apparent size of the Moon, a smartphone pixel, a doorway, or your whole field of view. These are geometry-driven values, so distance assumptions are part of the meaning.
related_resources:
- name: Visual angle
  url: https://en.wikipedia.org/wiki/Visual_angle
- name: Angular diameter
  url: https://en.wikipedia.org/wiki/Angular_diameter
show_limitations: true
units:
- name: radians
  symbol: rad
  conversion_factor: 1.0
  description: Radians are the canonical storage unit for visual angle.
- name: degrees
  symbol: deg
  conversion_factor: 57.2957795131
  description: Degrees are a familiar everyday apparent-size unit.
- name: arcminutes
  symbol: arcmin
  conversion_factor: 3437.74677078
  description: Arcminutes are useful for the Moon, eyesight, and astronomy.
- name: arcseconds
  symbol: arcsec
  conversion_factor: 206264.806247
  description: Arcseconds are useful for telescopes and precision optical systems.
required_min_items: 24
preferred_target_items: 50
preferred_max_items: 80
selection_bin_count: 24
description_format: markdown
scale_mode: log
frontend_group: senses
frontend_group_label: Senses & Perception
frontend_order: 740
