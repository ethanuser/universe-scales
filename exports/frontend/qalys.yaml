dimension: qalys
base_unit: qaly
dimension_description: Quality-adjusted life years compress length of life and quality of life into one metric. This is a powerful but highly model-dependent quantity, so each item should state whether it is a stock of healthy time, a gain from an intervention, or a loss from disability. It is useful here because it gives a common pedagogical axis for many health choices.
related_resources:
- name: Quality-adjusted life year
  url: https://en.wikipedia.org/wiki/Quality-adjusted_life_year
show_limitations: true
units:
- name: quality-adjusted life years
  symbol: QALY
  conversion_factor: 1.0
  description: Quality-adjusted life years are the canonical storage unit for this health-economics scale.
- name: milliqalys
  symbol: mQALY
  conversion_factor: 1000.0
  description: MilliQALYs are useful for small health-state changes.
- name: quality-adjusted days
  symbol: QAD
  conversion_factor: 365.25
  description: Quality-adjusted days are intuitive for short gains or losses.
- name: quality-adjusted hours
  symbol: QAH
  conversion_factor: 8766.0
  description: Quality-adjusted hours are useful for very small effects.
required_min_items: 24
preferred_target_items: 50
preferred_max_items: 80
selection_bin_count: 24
description_format: markdown
scale_mode: log
frontend_group: health
frontend_group_label: Health & Biology
frontend_order: 910
