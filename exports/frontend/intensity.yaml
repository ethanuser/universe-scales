dimension: intensity
base_unit: watts_per_square_meter
dimension_description: This scale stores physical intensity as power per unit area in watts per square meter. It is meant for radiation, beams, and flux-like limits rather than photometric brightness or sound loudness. That makes it the natural home for solar irradiance, laser focus, collapse-threshold estimates, and the Planck-intensity scale.
related_resources:
- name: Irradiance
  url: https://en.wikipedia.org/wiki/Irradiance
- name: Planck units
  url: https://en.wikipedia.org/wiki/Planck_units
show_limitations: true
units:
- name: watts per square meter
  symbol: W/m^2
  conversion_factor: 1.0
  description: Canonical storage unit for physical intensity or power flux.
- name: kilowatts per square meter
  symbol: kW/m^2
  conversion_factor: 0.001
  description: Convenient for sunlight and engineering heat-flux scales.
- name: megawatts per square meter
  symbol: MW/m^2
  conversion_factor: 1.0e-06
  description: Useful for concentrated heat flux and industrial beams.
- name: watts per square centimeter
  symbol: W/cm^2
  conversion_factor: 0.0001
  description: Common beam-intensity unit in laser physics.
- name: gigawatts per square meter
  symbol: GW/m^2
  conversion_factor: 1.0e-09
  description: Useful for very intense beams and compact heat fluxes.
- name: terawatts per square meter
  symbol: TW/m^2
  conversion_factor: 1.0e-12
  description: Useful for extreme laser systems and astrophysical fluxes.
- name: Planck intensities
  symbol: I_P
  conversion_factor: 2.158e-114
  description: Planck intensity is the natural maximum intensity scale c^8/(hbar G^2).
required_min_items: 12
preferred_target_items: 24
preferred_max_items: 40
selection_bin_count: 12
description_format: markdown
scale_mode: log
frontend_group: fields
frontend_group_label: Fields, Waves & Radiation
frontend_order: 560
