dimension: roughness
base_unit: meters
dimension_description: This roughness scale treats surface roughness as a characteristic amplitude, usually comparable to an Ra-style average roughness. It connects optical polishing, semiconductor surfaces, paper, skin, machined parts, and construction materials. Surface texture is method-dependent, so the labels and notes matter here more than for simpler geometric scales.
related_resources:
- name: Surface roughness
  url: https://en.wikipedia.org/wiki/Surface_roughness
show_limitations: true
units:
- name: meters
  symbol: m
  conversion_factor: 1.0
  description: Meters are the canonical storage unit for surface roughness amplitude.
- name: nanometers
  symbol: nm
  conversion_factor: 1000000000.0
  description: Useful for optics and semiconductors.
- name: micrometers
  symbol: um
  conversion_factor: 1000000.0
  description: Useful for machining and paper.
- name: millimeters
  symbol: mm
  conversion_factor: 1000.0
  description: Useful for concrete and coarse materials.
required_min_items: 24
preferred_target_items: 50
preferred_max_items: 80
selection_bin_count: 24
description_format: markdown
scale_mode: log
frontend_group: senses
frontend_group_label: Senses & Perception
frontend_order: 750
