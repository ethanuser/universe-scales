dimension: concentration
base_unit: moles_per_cubic_meter
dimension_description: This phase-one concentration scale uses molar concentration, stored canonically in moles per cubic meter. It connects trace atmospheric or biochemical concentrations with laboratory solutions and nearly pure substances. Concentration is highly definition-sensitive, so each item states what is dissolved or counted.
related_resources:
- name: Amount concentration
  url: https://en.wikipedia.org/wiki/Amount_concentration
- name: Molar concentration
  url: https://en.wikipedia.org/wiki/Molar_concentration
show_limitations: true
units:
- name: moles per cubic meter
  symbol: mol/m^3
  conversion_factor: 1.0
  description: Moles per cubic meter are the canonical storage unit for this concentration scale.
- name: moles per liter
  symbol: M
  conversion_factor: 0.001
  description: Molarity is the most common laboratory concentration unit.
- name: millimolar
  symbol: mM
  conversion_factor: 1.0
  description: Millimolar concentrations are common in biochemistry.
- name: micromolar
  symbol: uM
  conversion_factor: 1000.0
  description: Micromolar concentrations are common for signaling molecules and assays.
- name: nanomolar
  symbol: nM
  conversion_factor: 1000000.0
  description: Nanomolar concentrations are common for trace compounds.
required_min_items: 24
preferred_target_items: 50
preferred_max_items: 80
selection_bin_count: 24
description_format: markdown
scale_mode: log
frontend_group: materials
frontend_group_label: Materials & Matter
frontend_order: 490
