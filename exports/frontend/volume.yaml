dimension: volume
base_unit: cubic_meters
dimension_description: Volume tracks three-dimensional extent under explicit geometric assumptions. Many values here are derived from a stated radius, diameter, or envelope shape rather than directly measured container capacity. Each item therefore includes a short qualifier describing whether it is a literal volume, an effective occupied volume, or an approximate geometric envelope.
related_resources:
- name: Wikidata volume property
  url: https://www.wikidata.org/wiki/Property:P2234
- name: Volume
  url: https://en.wikipedia.org/wiki/Volume
show_limitations: true
units:
- conversion_factor: 1.0
  description: Cubic meters are the canonical storage unit for volume.
  name: cubic meters
  symbol: m^3
- conversion_factor: 1000.0
  description: Liters are convenient for household and laboratory volumes.
  name: liters
  symbol: L
- conversion_factor: 1000000.0
  description: Milliliters are useful for droplets, teaspoons, and lab samples.
  name: milliliters
  symbol: mL
- conversion_factor: 1.0e-09
  description: Cubic kilometers are convenient for lakes, planets, and nebulae.
  name: cubic kilometers
  symbol: km^3
- name: cubic centimeters
  symbol: cm^3
  conversion_factor: 1000000.0
  description: Cubic centimeters are common for engines, syringes, and lab volumes.
- name: cubic inches
  symbol: in^3
  conversion_factor: 61023.7440947323
  description: Cubic inches are useful for displacement and small mechanical volumes.
- name: cubic feet
  symbol: ft^3
  conversion_factor: 35.3146667215
  description: Cubic feet are useful for rooms, refrigerators, and gas volumes.
- name: gallons
  symbol: gal
  conversion_factor: 264.1720523581
  description: Gallons are a familiar unit for household and fuel volumes.
- name: teaspoons
  symbol: tsp
  conversion_factor: 202884.13621106
  description: Teaspoons are useful for tiny everyday cooking-scale volumes.
- name: Planck volumes
  symbol: l_P^3
  conversion_factor: 2.369e+104
  description: Planck volume is the natural volume scale from the Planck length cubed.
required_min_items: 24
preferred_target_items: 50
preferred_max_items: 80
selection_bin_count: 24
description_format: markdown
scale_mode: log
frontend_group: geometry
frontend_group_label: Geometry & Scale
frontend_order: 220
