dimension: cell-count
base_unit: count
dimension_description: This scale counts biological cells, from a single bacterium up to all bacteria on Earth. It is dimensionless mathematically but still extremely informative conceptually. Qualifiers matter because “cell count” can mean one organism, one tissue sample, or a planetary total.
related_resources:
- name: Cell
  url: https://en.wikipedia.org/wiki/Cell_(biology)
show_limitations: true
units:
- name: count
  symbol: count
  conversion_factor: 1.0
  description: Dimensionless count of cells.
- name: thousand cells
  symbol: k cells
  conversion_factor: 0.001
  description: Thousands of cells are useful for small organisms and samples.
- name: million cells
  symbol: M cells
  conversion_factor: 1.0e-06
  description: Millions of cells are useful for cultures and tissues.
- name: billion cells
  symbol: B cells
  conversion_factor: 1.0e-09
  description: Billions of cells are useful for blood and microbiology.
- name: trillion cells
  symbol: T cells
  conversion_factor: 1.0e-12
  description: Trillions of cells are useful for whole-organism counts.
required_min_items: 24
preferred_target_items: 50
preferred_max_items: 80
selection_bin_count: 24
description_format: markdown
scale_mode: log
frontend_group: health
frontend_group_label: Health & Biology
frontend_order: 940
