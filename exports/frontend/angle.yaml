dimension: angle
base_unit: radians
dimension_description: Angle measures rotational separation or apparent offset. This scale can represent anything from astronomical micro-offsets to human-scale fields of view and full turns. Because angles can be used both for geometry and for apparent size, the description of each item matters.
related_resources:
- name: Angle
  url: https://en.wikipedia.org/wiki/Angle
- name: Radian
  url: https://en.wikipedia.org/wiki/Radian
show_limitations: true
units:
- name: radians
  symbol: rad
  conversion_factor: 1.0
  description: Radians are the canonical storage unit for angle.
- name: degrees
  symbol: deg
  conversion_factor: 57.2957795131
  description: Degrees are a familiar everyday angular unit.
- name: milliradians
  symbol: mrad
  conversion_factor: 1000.0
  description: Milliradians are useful for optics and targeting.
- name: arcminutes
  symbol: arcmin
  conversion_factor: 3437.74677078
  description: Arcminutes are useful for visual and astronomical angles.
- name: arcseconds
  symbol: arcsec
  conversion_factor: 206264.806247
  description: Arcseconds are useful for precise astronomical and optical angles.
required_min_items: 24
preferred_target_items: 50
preferred_max_items: 80
selection_bin_count: 24
description_format: markdown
scale_mode: log
frontend_group: motion
frontend_group_label: Motion & Mechanics
frontend_order: 380
