dimension: precision
base_unit: relative_uncertainty
dimension_description: This scale stores precision as relative uncertainty or fractional error. Smaller values mean higher precision, so it is inverted compared with everyday language like “more precise.” That inversion is worth it because relative uncertainty is much more coherent and log-friendly than a vague notion of accuracy.
related_resources:
- name: Measurement uncertainty
  url: https://en.wikipedia.org/wiki/Measurement_uncertainty
show_limitations: true
units:
- name: relative uncertainty
  symbol: fraction
  conversion_factor: 1.0
  description: Fractional uncertainty is the canonical storage unit for precision.
- name: percent
  symbol: '%'
  conversion_factor: 100.0
  description: Relative uncertainty shown as a percent.
- name: parts per million
  symbol: ppm
  conversion_factor: 1000000.0
  description: PPM is useful for clocks and electronics.
- name: parts per billion
  symbol: ppb
  conversion_factor: 1000000000.0
  description: PPB is useful for very high precision.
- name: parts per trillion
  symbol: ppt
  conversion_factor: 1000000000000.0
  description: PPT is useful for the most precise metrology references.
required_min_items: 24
preferred_target_items: 50
preferred_max_items: 80
selection_bin_count: 24
description_format: markdown
scale_mode: log
frontend_group: society
frontend_group_label: Society, Economy & Abstract Quantities
frontend_order: 1050
