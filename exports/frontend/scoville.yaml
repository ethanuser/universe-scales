dimension: scoville
base_unit: scoville_heat_units
dimension_description: Scoville heat units are a familiar rough scale for pungency from capsaicinoids. They are not a fundamental physical unit, but they are pedagogically useful for comparing mild peppers, hot sauces, pepper sprays, and nearly pure capsaicin. Reported values often come as ranges, so the entries here use representative central values.
related_resources:
- name: Scoville scale
  url: https://en.wikipedia.org/wiki/Scoville_scale
- name: Capsaicin
  url: https://en.wikipedia.org/wiki/Capsaicin
show_limitations: true
units:
- name: Scoville heat units
  symbol: SHU
  conversion_factor: 1.0
  description: Scoville heat units are the canonical storage unit for this pungency scale.
- name: thousand Scoville heat units
  symbol: kSHU
  conversion_factor: 0.001
  description: Thousands of SHU are useful for common peppers and sauces.
- name: million Scoville heat units
  symbol: MSHU
  conversion_factor: 1.0e-06
  description: Millions of SHU are useful for extreme peppers and pepper sprays.
required_min_items: 24
preferred_target_items: 50
preferred_max_items: 80
selection_bin_count: 24
description_format: markdown
scale_mode: log
frontend_group: senses
frontend_group_label: Senses & Perception
frontend_order: 710
items:
