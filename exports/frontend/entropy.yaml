dimension: entropy
base_unit: joules_per_kelvin
dimension_description: 'This first-pass entropy scale focuses on entropy change, not total entropy and not raw microstate counts. That makes the dimension much more concrete: each item is a process like erasing a bit, melting ice, or vaporizing water. Temperature and process definitions matter a lot here, so qualifiers are especially important.'
related_resources:
- name: Entropy
  url: https://en.wikipedia.org/wiki/Entropy
show_limitations: true
units:
- name: joules per kelvin
  symbol: J/K
  conversion_factor: 1.0
  description: Joules per kelvin are the canonical storage unit for entropy change.
- name: millijoules per kelvin
  symbol: mJ/K
  conversion_factor: 1000.0
  description: Millijoules per kelvin are useful for small laboratory-scale entropy changes.
- name: kilojoules per kelvin
  symbol: kJ/K
  conversion_factor: 0.001
  description: Kilojoules per kelvin are useful for large thermal processes.
- name: Boltzmann constants
  symbol: k_B
  conversion_factor: 7.242970516e+22
  description: Boltzmann-constant units are useful for microscopic entropy changes.
required_min_items: 24
preferred_target_items: 50
preferred_max_items: 80
selection_bin_count: 24
description_format: markdown
scale_mode: log
frontend_group: fields
frontend_group_label: Fields, Waves & Radiation
frontend_order: 520
