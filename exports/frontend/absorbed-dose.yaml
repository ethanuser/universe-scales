dimension: absorbed-dose
base_unit: gray
dimension_description: Absorbed dose measures how much ionizing-radiation energy is deposited per kilogram. It spans dental X-rays, CT scans, cancer therapy, acute radiation syndrome, and industrial sterilization. Body part, fractionation, and exposure type matter enough here that the qualifiers should stay visible.
related_resources:
- name: Absorbed dose
  url: https://en.wikipedia.org/wiki/Absorbed_dose
show_limitations: true
units:
- name: gray
  symbol: Gy
  conversion_factor: 1.0
  description: Gray are the canonical storage unit for absorbed dose.
- name: milligray
  symbol: mGy
  conversion_factor: 1000.0
  description: Milligray are common for medical imaging.
- name: microgray
  symbol: uGy
  conversion_factor: 1000000.0
  description: Microgray are useful for very small exposures.
- name: centigray
  symbol: cGy
  conversion_factor: 100.0
  description: Centigray are often used in radiotherapy.
- name: rad
  symbol: rad
  conversion_factor: 100.0
  description: The older rad unit remains common in some contexts.
required_min_items: 24
preferred_target_items: 50
preferred_max_items: 80
selection_bin_count: 24
description_format: markdown
scale_mode: log
frontend_group: health
frontend_group_label: Health & Biology
frontend_order: 950
