dimension: event-rate
base_unit: counts_per_second
dimension_description: 'This scale measures how often discrete events happen, canonically in counts per second. It is intentionally broad: biological rhythms, industrial lines, social platforms, digital packets, and physical decays can all be compared once they are expressed as event rates. Each entry states what is being counted so unlike things are not silently conflated.'
related_resources:
- name: Rate
  url: https://en.wikipedia.org/wiki/Rate_(mathematics)
- name: Frequency
  url: https://en.wikipedia.org/wiki/Frequency
show_limitations: true
units:
- name: counts per second
  symbol: 1/s
  conversion_factor: 1.0
  description: Counts per second are the canonical storage unit for event-rate observations.
- name: counts per minute
  symbol: 1/min
  conversion_factor: 60.0
  description: Counts per minute are useful for physiology and everyday repeated events.
- name: counts per hour
  symbol: 1/h
  conversion_factor: 3600.0
  description: Counts per hour are useful for slow recurring processes.
- name: counts per day
  symbol: 1/day
  conversion_factor: 86400.0
  description: Counts per day are useful for social and operational rates.
- name: counts per year
  symbol: 1/yr
  conversion_factor: 31557600.0
  description: Counts per year are useful for large-scale production or civilizational activity.
required_min_items: 24
preferred_target_items: 50
preferred_max_items: 80
selection_bin_count: 24
description_format: markdown
scale_mode: log
frontend_group: society
frontend_group_label: Society, Economy & Abstract Quantities
frontend_order: 1030
