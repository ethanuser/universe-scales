dimension: odor-concentration
base_unit: parts_per_billion_by_volume
dimension_description: This first-pass odor scale is not “how smelly” in the abstract. It is the airborne concentration of a named odorant, usually in parts per billion by volume, which makes the axis more objective and shareable. Perception still depends on chemistry and thresholds, so the named compound is part of the data, not a side note.
related_resources:
- name: Odor
  url: https://en.wikipedia.org/wiki/Odor
show_limitations: true
units:
- name: parts per billion by volume
  symbol: ppbv
  conversion_factor: 1.0
  description: Parts per billion by volume are the canonical storage unit for odor concentration.
- name: parts per trillion by volume
  symbol: pptv
  conversion_factor: 1000.0
  description: PPTV is useful for extremely potent odorants.
- name: parts per million by volume
  symbol: ppmv
  conversion_factor: 0.001
  description: PPMV is useful for stronger vapors.
required_min_items: 24
preferred_target_items: 50
preferred_max_items: 80
selection_bin_count: 24
description_format: markdown
scale_mode: log
frontend_group: senses
frontend_group_label: Senses & Perception
frontend_order: 720
