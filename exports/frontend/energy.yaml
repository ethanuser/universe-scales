dimension: energy
base_unit: joules
dimension_description: Energy measures the capacity to cause change, whether moving a mass, breaking a bond, or warming a room. In practice it ties together force, distance, and heat with a single bookkeeping number that must be conserved. For any process you care about, from a heartbeat to a supernova, energy is the currency that balances the before and after. Here we compare characteristic amounts for specific objects and conditions so the numbers map to lived experience.
related_resources: []
show_limitations: true
units:
- conversion_factor: 1
  description: The joule is the SI work and energy unit defined as one newton applied over one meter. It relates directly to heat through mechanical equivalence and to electricity via watts times seconds. Counting in joules lets you add chemical, thermal, mechanical, and radiant budgets without changing units. In this dataset all item values are recorded in joules before conversion.
  name: joules
  symbol: J
- conversion_factor: 0.001
  description: A kilojoule is one thousand joules, a convenient scale for food labels and small appliances. Cooking, exercise, and small batteries often live in this unit. Using kilojoules keeps numbers readable while staying tied to SI definitions. It bridges chemistry lab quantities with everyday tasks like boiling water.
  name: kilojoules
  symbol: kJ
- conversion_factor: 1e-6
  description: A megajoule is one million joules, useful for vehicles, industrial heaters, and large batteries. It lets us compare a car’s kinetic energy and a home appliance on the same footing. Many engineering datasheets report capacities or outputs in this range. It compresses big but not astronomical numbers into human friendly form.
  name: megajoules
  symbol: MJ
- conversion_factor: 2.77778e-07
  description: The kilowatt hour is the energy delivered by one kilowatt sustained for one hour. Electric utilities bill in this unit because time based use is central to grids. One kilowatt hour equals 3.6 million joules, so you can convert bills into physics cleanly. It couples power intuition to calendar time.
  name: kilowatt-hours
  symbol: kWh
- conversion_factor: 0.239006
  description: The calorie in scientific use is the heat needed to warm one gram of water by one degree Celsius. Food packaging typically uses kilocalories, which are a thousand times larger, but the conversion to joules is fixed. Chemists favor calories in solution thermodynamics because water is the reference. Here we use the precise factor to align dietary and laboratory numbers.
  name: calories
  symbol: cal
- conversion_factor: 6.242e18
  description: The electronvolt measures the energy gained by a single electron when it moves through one volt of potential. It is natural for atomic and particle physics where energies arrive as quanta. Large numbers of electronvolts map comfortably to keV, MeV, and GeV in accelerators and detectors. Converting to joules ties the microscopic to macroscopic engines.
  name: electronvolts
  symbol: eV
- conversion_factor: 5.112262516908872e-10
  description: Planck energy is the natural high-energy scale from fundamental constants.
  name: Planck energies
  symbol: E_P
- conversion_factor: 1e-9
  description: A gigajoule is one billion joules, a useful scale for infrastructure, fuel, and large batteries. It lets you compare appliances with transport and small industrial systems without scientific notation. Many annual or fleet-level totals become readable in gigajoules. The factor is exact by definition.
  name: gigajoules
  symbol: GJ
- conversion_factor: 1e-12
  description: A terajoule is one trillion joules, useful for city-scale energy budgets and medium infrastructure. It helps bridge the gap between household bills and national totals. Researchers often use it when talking about fuel throughput or grid dispatch. The factor is exact by definition.
  name: terajoules
  symbol: TJ
- conversion_factor: 1e-15
  description: A petajoule is one quadrillion joules and is a common scale for national energy systems. It is large enough to make annual electricity use and transportation demand easy to compare. This unit is handy whenever gigajoules are still too small to be readable. The factor is exact by definition.
  name: petajoules
  symbol: PJ
- conversion_factor: 1e-18
  description: An exajoule is one quintillion joules, a scale used for global energy demand and climate bookkeeping. World electricity use and transportation totals often live here. It is the most convenient human-scale bridge to planetary accounting. The factor is exact by definition.
  name: exajoules
  symbol: EJ
- name: watt-hours
  symbol: Wh
  conversion_factor: 0.0002777777777778
  description: Watt-hours are useful for batteries, devices, and electricity usage.
- name: megawatt-hours
  symbol: MWh
  conversion_factor: 2.7777777777778e-10
  description: Megawatt-hours are useful for grids, utilities, and industrial usage.
- name: tons of TNT
  symbol: t TNT
  conversion_factor: 2.3900573613767e-10
  description: TNT equivalent helps compare explosions and energetic events.
