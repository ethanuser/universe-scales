dimension: strain
base_unit: strain
dimension_description: 'Strain is fractional deformation: how much a material stretches, compresses, or shears relative to its original size. It is dimensionless, but it is still highly informative across engineering, geology, and precision physics. This scale connects tiny metrological strains with yield strains and large deformations in soft materials.'
related_resources:
- name: Strain (mechanics)
  url: https://en.wikipedia.org/wiki/Strain_(mechanics)
show_limitations: true
units:
- name: strain
  symbol: strain
  conversion_factor: 1.0
  description: Dimensionless fractional deformation.
- name: percent strain
  symbol: '%'
  conversion_factor: 100.0
  description: Common engineering display for larger strains.
- name: microstrain
  symbol: ue
  conversion_factor: 1000000.0
  description: Common metrology and structural-health unit.
- name: parts per million
  symbol: ppm
  conversion_factor: 1000000.0
  description: Equivalent display for small strains.
required_min_items: 24
preferred_target_items: 50
preferred_max_items: 80
selection_bin_count: 24
description_format: markdown
scale_mode: log
frontend_group: materials
frontend_group_label: Materials & Matter
frontend_order: 510
items:
