dimension: micromorts
base_unit: micromorts
dimension_description: A micromort is a one-in-a-million chance of death. It is especially useful for one-off acute risks like a skydive, a marathon, or a surgical procedure. Long-term chronic risks can be represented here too, but only if the time basis is stated explicitly.
related_resources:
- name: Micromort
  url: https://en.wikipedia.org/wiki/Micromort
show_limitations: true
units:
- name: micromorts
  symbol: uMort
  conversion_factor: 1.0
  description: One micromort equals a one-in-a-million chance of death.
- name: nanomorts
  symbol: nMort
  conversion_factor: 1000.0
  description: Nanomorts are useful for very small acute risks.
- name: millimorts
  symbol: mMort
  conversion_factor: 0.001
  description: Millimorts are useful for large acute risks.
- name: death probability
  symbol: p
  conversion_factor: 1.0e-06
  description: One micromort equals 1e-6 probability of death.
required_min_items: 24
preferred_target_items: 50
preferred_max_items: 80
selection_bin_count: 24
description_format: markdown
scale_mode: log
frontend_group: health
frontend_group_label: Health & Biology
frontend_order: 920
