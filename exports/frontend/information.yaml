dimension: information
base_unit: bytes
dimension_description: Information here means a storage or message size expressed as bytes, whether the source talks about a literal file capacity, a memory size, or a derived information estimate. Some entries are direct capacities like discs and tapes, while others are derived from genome lengths, audio sample rates, or raw video formats. That makes this scale useful for comparing messages, media, genomes, and storage technologies on one logarithmic axis.
related_resources:
- name: Information
  url: https://en.wikipedia.org/wiki/Information
- name: Byte
  url: https://en.wikipedia.org/wiki/Byte
show_limitations: true
units:
- conversion_factor: 1.0
  description: Bytes are the canonical storage unit for information observations.
  name: bytes
  symbol: B
- name: bits
  symbol: bit
  conversion_factor: 8.0
  description: Bits are useful for tiny messages, hashes, and entropy-scale comparisons.
- name: kilobytes
  symbol: kB
  conversion_factor: 0.001
  description: Kilobytes are useful for tiny files, messages, and genome-scale examples.
- name: megabytes
  symbol: MB
  conversion_factor: 1.0e-06
  description: Megabytes are useful for songs, photos, and small datasets.
- name: gigabytes
  symbol: GB
  conversion_factor: 1.0e-09
  description: Gigabytes are useful for genomes, discs, and consumer storage.
- name: terabytes
  symbol: TB
  conversion_factor: 1.0e-12
  description: Terabytes are useful for large storage devices and archive-scale collections.
- name: petabytes
  symbol: PB
  conversion_factor: 1.0e-15
  description: Petabytes are useful for datacenter and scientific archive scales.
- name: exabytes
  symbol: EB
  conversion_factor: 1.0e-18
  description: Exabytes are useful for global-scale data comparisons.
- name: zettabytes
  symbol: ZB
  conversion_factor: 1.0e-21
  description: Zettabytes are useful for very large aggregate information scales.
- name: yottabytes
  symbol: YB
  conversion_factor: 1.0e-24
  description: Yottabytes are useful for extreme civilization-scale or physical-information comparisons.
required_min_items: 24
preferred_target_items: 50
preferred_max_items: 80
selection_bin_count: 24
description_format: markdown
scale_mode: log
frontend_group: information
frontend_group_label: Information & Computation
frontend_order: 610
