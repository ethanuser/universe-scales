dimension: current
base_unit: amperes
dimension_description: Electric current measures how quickly charge moves through a circuit, membrane, plasma, or conductor. The examples now deliberately include biology, implants, consumer electronics, household power, heavy industry, and lightning so the scale is easier to orient yourself on. Some values are direct ratings, while others are stated as representative operating currents for a concrete scenario.
related_resources:
- name: Electric current
  url: https://en.wikipedia.org/wiki/Electric_current
- name: Ampere
  url: https://en.wikipedia.org/wiki/Ampere
show_limitations: true
units:
- conversion_factor: 1.0
  description: Amperes are the canonical storage unit for electric current.
  name: amperes
  symbol: A
- name: microamperes
  symbol: uA
  conversion_factor: 1000000.0
  description: Microamperes are useful for sensors, watches, and leakage currents.
- name: milliamperes
  symbol: mA
  conversion_factor: 1000.0
  description: Milliamperes are useful for LEDs, small electronics, and chargers.
- name: kiloamperes
  symbol: kA
  conversion_factor: 0.001
  description: Kiloamperes are useful for lightning, welding, and rail systems.
- name: megaamperes
  symbol: MA
  conversion_factor: 1.0e-06
  description: Megaamperes are useful for pulsed-power and fusion-scale currents.
- name: Planck currents
  symbol: I_P
  conversion_factor: 2.874473253614646e-26
  description: Planck current is the natural current scale from Planck-unit definitions.
required_min_items: 24
preferred_target_items: 50
preferred_max_items: 80
selection_bin_count: 24
description_format: markdown
scale_mode: log
frontend_group: fundamental
frontend_group_label: Fundamental Scales
frontend_order: 160
