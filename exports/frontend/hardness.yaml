dimension: hardness
base_unit: pascals
dimension_description: Hardness here is treated pragmatically as indentation hardness expressed in pascals where possible. This is not a perfect universal property because Mohs, Vickers, Brinell, and other hardness scales emphasize different tests. Still, a pressure-like canonical scale makes the ordering of soft metals, glass, carbides, and diamond easier to compare logarithmically.
related_resources:
- name: Hardness
  url: https://en.wikipedia.org/wiki/Hardness
- name: Vickers hardness test
  url: https://en.wikipedia.org/wiki/Vickers_hardness_test
show_limitations: true
units:
- name: pascals
  symbol: Pa
  conversion_factor: 1.0
  description: Pascals as an approximate indentation-hardness scale.
- name: megapascals
  symbol: MPa
  conversion_factor: 1.0e-06
  description: Useful for softer materials.
- name: gigapascals
  symbol: GPa
  conversion_factor: 1.0e-09
  description: Useful for hard materials and ceramics.
required_min_items: 24
preferred_target_items: 50
preferred_max_items: 80
selection_bin_count: 24
description_format: markdown
scale_mode: log
frontend_group: materials
frontend_group_label: Materials & Matter
frontend_order: 500
