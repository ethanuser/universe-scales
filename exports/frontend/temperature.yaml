dimension: temperature
base_unit: kelvin
dimension_description: Temperature measures how hot or cold a system is, but on a deeper level it tracks the distribution of energy among microscopic degrees of freedom. This makes it one of the rare scales that links kitchen experience, planetary climate, stellar interiors, and particle collisions. Many values are quoted directly in kelvin, while others are converted from Celsius or Fahrenheit values reported in the source.
related_resources:
- name: Temperature
  url: https://en.wikipedia.org/wiki/Temperature
- name: Kelvin
  url: https://en.wikipedia.org/wiki/Kelvin
show_limitations: true
units:
- conversion_factor: 1.0
  description: Kelvin is the canonical storage unit for thermodynamic temperature.
  name: kelvin
  symbol: K
- name: celsius
  symbol: deg C
  conversion_factor: 1.0
  offset: -273.15
  description: Celsius is the most intuitive everyday temperature scale.
- name: fahrenheit
  symbol: deg F
  conversion_factor: 1.8
  offset: -459.67
  description: Fahrenheit remains common for weather and household temperatures in the United States.
- name: millikelvin
  symbol: mK
  conversion_factor: 1000.0
  description: Millikelvin are useful for cryogenic and quantum systems.
- name: microkelvin
  symbol: uK
  conversion_factor: 1000000.0
  description: Microkelvin are useful for ultracold atoms and precision experiments.
- name: megakelvin
  symbol: MK
  conversion_factor: 1.0e-06
  description: Megakelvin are useful for stellar interiors and hot plasmas.
- name: Planck temperatures
  symbol: T_P
  conversion_factor: 7.057929871370515e-33
  description: Planck temperature is the natural high-temperature scale in Planck units.
required_min_items: 24
preferred_target_items: 50
preferred_max_items: 80
selection_bin_count: 24
description_format: markdown
scale_mode: log
frontend_group: fundamental
frontend_group_label: Fundamental Scales
frontend_order: 180
