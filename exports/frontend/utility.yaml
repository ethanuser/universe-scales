dimension: utility
base_unit: qaly_equivalent
dimension_description: 'This phase-one utility scale is intentionally a proxy: it stores welfare or utility in quality-adjusted life-year equivalents. That makes the values easier to compare with health and time scales, but it is not a universal theory of value. Use it as a pedagogical scaffold for “how much good or bad is this outcome roughly like,” not as a final moral ranking.'
related_resources:
- name: Quality-adjusted life year
  url: https://en.wikipedia.org/wiki/Quality-adjusted_life_year
- name: Utilitarianism
  url: https://en.wikipedia.org/wiki/Utilitarianism
show_limitations: true
units:
- name: QALY-equivalent
  symbol: QALYe
  conversion_factor: 1.0
  description: Phase one stores utility in quality-adjusted life-year equivalents.
- name: healthy days equivalent
  symbol: day-eq
  conversion_factor: 365.0
  description: Convert QALY-equivalent utility into full-quality days.
- name: healthy hours equivalent
  symbol: hour-eq
  conversion_factor: 8760.0
  description: Convert QALY-equivalent utility into full-quality hours.
- name: healthy minutes equivalent
  symbol: min-eq
  conversion_factor: 525600.0
  description: Convert QALY-equivalent utility into full-quality minutes.
required_min_items: 24
preferred_target_items: 50
preferred_max_items: 80
selection_bin_count: 24
description_format: markdown
scale_mode: log
frontend_group: society
frontend_group_label: Society, Economy & Abstract Quantities
frontend_order: 1080
