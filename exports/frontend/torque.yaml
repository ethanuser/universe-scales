dimension: torque
base_unit: newton_meters
dimension_description: 'Torque measures rotational push: how strongly a force tries to twist something around an axis. This scale mixes microscopic rotary motors, hand tools, engines, and utility-scale machinery. Many values are representative operating torques rather than immutable constants, so the qualifiers and source notes matter.'
related_resources:
- name: Torque
  url: https://en.wikipedia.org/wiki/Torque
- name: Newton-metre
  url: https://en.wikipedia.org/wiki/Newton-metre
show_limitations: true
units:
- name: newton-meters
  symbol: N*m
  conversion_factor: 1.0
  description: Newton-meters are the canonical storage unit for torque.
- name: millinewton-meters
  symbol: mN*m
  conversion_factor: 1000.0
  description: Millinewton-meters are useful for small motors and precision tools.
- name: kilonewton-meters
  symbol: kN*m
  conversion_factor: 0.001
  description: Kilonewton-meters are useful for vehicles and utility-scale machinery.
- name: pound-feet
  symbol: lb*ft
  conversion_factor: 0.7375621493
  description: Pound-feet are a familiar torque unit in automotive contexts.
required_min_items: 24
preferred_target_items: 50
preferred_max_items: 80
selection_bin_count: 24
description_format: markdown
scale_mode: log
frontend_group: motion
frontend_group_label: Motion & Mechanics
frontend_order: 360
