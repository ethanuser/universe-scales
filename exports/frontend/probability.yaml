  symbol: p
  conversion_factor: 1.0
  description: Probability as a fraction from 0 to 1.
- name: percent
  symbol: '%'
  conversion_factor: 100.0
  description: Percent is the most familiar display form for probability.
- name: parts per million
  symbol: ppm
  conversion_factor: 1000000.0
  description: PPM is useful for low-probability risks.
- name: parts per billion
  symbol: ppb
  conversion_factor: 1000000000.0
  description: PPB is useful for extremely small probabilities.
