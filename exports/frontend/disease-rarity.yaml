dimension: disease-rarity
base_unit: prevalence_fraction
dimension_description: This scale stores disease rarity as prevalence fraction, so higher values mean more common conditions and lower values mean rarer ones. It is intentionally simple and does not collapse incidence, prevalence, lifetime risk, and carrier frequency into one number unless that qualifier is stated. The frontend can later re-express these as “1 in N” when helpful.
related_resources:
- name: Rare disease
  url: https://en.wikipedia.org/wiki/Rare_disease
show_limitations: true
units:
- name: prevalence fraction
  symbol: fraction
  conversion_factor: 1.0
  description: Fraction of a population affected under the stated qualifier.
- name: percent
  symbol: '%'
  conversion_factor: 100.0
  description: Percent affected under the stated prevalence qualifier.
- name: per 1,000 people
  symbol: per 1k
  conversion_factor: 1000.0
  description: Common public-health display unit.
- name: per 100,000 people
  symbol: per 100k
  conversion_factor: 100000.0
  description: Common epidemiology display unit.
required_min_items: 24
preferred_target_items: 50
preferred_max_items: 80
selection_bin_count: 24
description_format: markdown
scale_mode: log
frontend_group: health
frontend_group_label: Health & Biology
frontend_order: 930
items:
