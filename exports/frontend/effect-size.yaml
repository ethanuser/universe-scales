dimension: effect-size
base_unit: cohens_d
dimension_description: This phase-one effect-size scale uses the magnitude of Cohen's d, the standardized difference between two means in units of standard deviations. It is more comparable than raw percentage changes, but only when the underlying comparison is well defined. Large values are genuinely dramatic because they imply groups separated by substantial fractions of a standard deviation or more.
related_resources:
- name: Effect size
  url: https://en.wikipedia.org/wiki/Effect_size
- name: Cohen's d
  url: https://en.wikipedia.org/wiki/Effect_size#Cohen%27s_d
show_limitations: true
units:
- name: Cohen's d
  symbol: d
  conversion_factor: 1.0
  description: Cohen's d expresses a standardized mean difference in standard-deviation units.
- name: deci-d
  symbol: 0.1 d
  conversion_factor: 10.0
  description: One deci-d is one tenth of a standard-deviation effect size.
- name: centi-d
  symbol: 0.01 d
  conversion_factor: 100.0
  description: Centi-d is useful for very small standardized effects.
- name: milli-d
  symbol: 0.001 d
  conversion_factor: 1000.0
  description: Milli-d captures extremely small but nonzero standardized effects.
required_min_items: 24
preferred_target_items: 50
preferred_max_items: 80
selection_bin_count: 24
description_format: markdown
scale_mode: linear
frontend_group: society
frontend_group_label: Society, Economy & Abstract Quantities
frontend_order: 1070
