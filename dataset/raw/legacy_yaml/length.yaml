base_unit: meters
dimension: length
dimension_description: Length measures the distance between two points, yet it spans everything from the
  Planck length, where spacetime ripples like quantum foam, to the 93-billion-light-year reach of the
  observable universe. Across these 61 orders of magnitude, the same physical laws shape quarks, atoms,
  planets, and galaxies. If the universe were the size of Earth, a human would be smaller than an atom.
related_resources:
- name: Scale of the Universe
  url: https://scaleofuniverse.com
- name: Powers of Ten
  url: https://www.eamesoffice.com/the-work/powers-of-ten/
- name: Magnifying the Universe
  url: https://www.numbersleuth.org/universe/
show_limitations: true
items:
- description: The fundamental length scale in string theory, where quantum strings vibrate in 10-dimensional
    spacetime. At this scale, space itself becomes 'fuzzy' and quantum fluctuations are so violent that
    measuring distances shorter than this becomes meaningless. This length emerges from the interplay
    between quantum mechanics and gravity, offering a potential solution to the black hole information
    paradox and providing a natural cutoff for the infinite energies that plague quantum field theory.
  name: String Length
  source: https://en.wikipedia.org/wiki/String_theory
  value: 1e-35
- description: A length constructed from the constants of quantum mechanics, gravity, and relativity.
    It marks the scale at which we expect our separate descriptions of these forces to need a quantum
    theory of gravity. Ideas such as spacetime foam and black-hole limits on measurement make it a compelling
    frontier, but it has not been established experimentally as the smallest possible distance. The ruler
    shows a derived scale, not an observed grain of spacetime.
  name: Planck Length
  source: https://physics.nist.gov/cgi-bin/cuu/Value?plkl
  value: 1.616255e-35
- description: An experimental upper limit on an effective quark radius from combined HERA electron-proton
    collision data, at 95% confidence within the study's form-factor model. It is not a measured particle
    surface. Quarks are never found alone due to 'color confinement' - the strong force becomes stronger
    as you try to separate them, like cosmic rubber bands. Scattering lets us probe these hidden building
    blocks without ever holding an isolated quark in our hands.
  name: Quark
  source: https://arxiv.org/abs/1611.03825
  value: 4.3e-19
- name: Weak Force Range
  value: 2.4552562474181655e-18
  source: https://pdg.lbl.gov/2024/listings/rpp2024-list-w-boson.pdf
  description: The weak force, which lets the Sun fuse hydrogen and makes some atomic nuclei decay, reaches
    only about 2.5 billionths of a billionth of a meter. Its carriers, the W and Z bosons, are about 86 times
    heavier than a proton, and a force carried by heavy particles fades within roughly their reduced Compton
    wavelength, here hbar divided by the W mass times the speed of light. A proton is about 340 times wider
    than the reach of this force.
- name: Tau Compton Wavelength
  value: 6.97771e-16
  source: https://physics.nist.gov/cgi-bin/cuu/Value?tcomwl
  description: A tau lepton's Compton wavelength is about 0.70 femtometers, a quantum length calculated
    from its rest mass rather than a measured particle diameter. The tau is a heavier relative of the
    electron, so its associated wavelength is much shorter. It belongs beside nuclear dimensions on this
    scale even though experiments do not describe the tau as a tiny solid ball.
- description: The charge radius of the proton, measured through electron-proton scattering and muonic
    hydrogen spectroscopy. This measurement sparked the 'proton radius puzzle' when muonic hydrogen gave
    a different result than electronic hydrogen - a discrepancy that challenged quantum electrodynamics
    and hinted at possible new physics. The proton's internal structure contains three quarks constantly
    exchanging gluons in a quantum soup.
  name: Proton Radius
  source: https://physics.nist.gov/cuu/Constants/Table/allascii.txt
  value: 8.4075e-16
- name: Proton Compton Wavelength
  value: 1.3214098536e-15
  source: https://physics.nist.gov/cgi-bin/cuu/Value?pcomwl
  description: The proton's Compton wavelength is about 1.32 femtometers, a length set by its rest mass
    and the constants of quantum mechanics and relativity. It is distinct from the proton's measured charge
    radius, which describes how electric charge is distributed inside it. These two lengths happen to
    occupy the same nuclear neighborhood, but they answer different questions about the same particle.
- description: The classical electron radius, an electromagnetic length scale derived from its charge
    and rest energy, not an observed electron size. Electrons appear point-like in experiments. In the
    classical picture, spreading a charge over a small sphere stores electrostatic energy; equating a
    characteristic Coulomb energy to the electron's rest energy gives this scale. The exact self-energy
    depends on the assumed charge distribution, so it does not define a physical surface for the electron.
  name: Electron
  source: https://physics.nist.gov/cgi-bin/cuu/Value?re
  value: 2.8179403205e-15
- name: Helium Nucleus Charge Diameter
  value: 3.357e-15
  source: https://physics.nist.gov/cgi-bin/cuu/Value?ral
  description: Twice the helium nucleus's root-mean-square charge radius is about 3.36 femtometers. This
    is a way to compare the spread of its positive charge, rather than a sharp outer surface around its
    two protons and two neutrons. The same tightly bound nucleus appears as an alpha particle in radioactive
    decay, far smaller than the electron cloud of a complete helium atom.
- description: The diameter of atomic nuclei, where 99.97% of an atom's mass is concentrated in a space
    100,000 times smaller than the atom itself. Nuclear size scales roughly as the cube root of atomic
    mass, meaning uranium nuclei are only about 6 times larger than hydrogen nuclei despite being 238
    times more massive. This incredible density means nuclear matter is 100 trillion times denser than
    water.
  name: Atomic Nucleus
  source: https://en.wikipedia.org/wiki/Atomic_nucleus
  value: 1e-14
- name: Muon Compton Wavelength
  value: 1.17344411e-14
  source: https://physics.nist.gov/cgi-bin/cuu/Value?mcomwl
  description: A muon's Compton wavelength is about 11.7 femtometers, a quantum length associated with
    its rest mass. Muons carry the same electric charge as electrons but are much heavier, which makes
    this wavelength correspondingly shorter. The marker measures a relationship between mass and quantum
    behavior, not the width of a muon; it sits far below the dimensions of an atom.
- description: A 1.173 MeV gamma ray emitted during cobalt-60 decay has a wavelength of about 1.06 picometers,
    from wavelength equals h c over energy.
  name: Gamma Ray Wavelength
  source: https://nvlpubs.nist.gov/nistpubs/jres/088/3/V88-3.pdf
  value: 1.057e-12
- description: The de Broglie wavelength of a neutrino with 1 MeV of energy, about 1.24 picometers in
    the ultrarelativistic approximation. This is a wavelength, not the particle's physical size; increasing
    its energy makes the wavelength shorter. Trillions of neutrinos pass through your body every second
    from the Sun, and most pass through the Earth without interacting. Their tiny mass and ghostly nature
    make them crucial messengers from stellar cores and supernova explosions.
  name: 1 MeV Neutrino Wavelength
  source: https://pdg.lbl.gov/2025/reviews/rpp2025-rev-phys-constants.pdf
  value: 1.239841984e-12
- name: Muonic Hydrogen Atom
  value: 5.694950864874306e-13
  source: https://doi.org/10.1038/nature09250
  description: Replace hydrogen's electron with a muon, its 207-times-heavier cousin, and the atom shrinks
    about 186 times, to roughly 0.57 picometers across. The muon then orbits only about 340 proton radii
    out, close enough that its energy levels reveal the proton's size. Measurements of muonic hydrogen in
    2010 found a proton smaller than electron-based experiments did, a puzzle that later work largely
    resolved in favor of the smaller value. A muon decays in about two microseconds.
- name: Electron Compton Wavelength
  value: 2.42631023538e-12
  source: https://physics.nist.gov/cgi-bin/cuu/Value?ecomwl
  description: The electron's Compton wavelength is about 2.43 picometers, a quantum length that appears
    when light scatters from electrons. A photon can lose energy to an electron and emerge with a longer
    wavelength, revealing that light carries momentum as well as energy. This length is much smaller than
    an atom and must not be read as the electron's physical diameter.
- description: A hydrogen atom is about 106 picometers across if its edge is drawn at the Bohr radius,
    52.9 pm, the electron's most probable distance from the proton. The electron has no orbit or surface;
    it is a probability cloud, and only about 32% of it lies inside that sphere, thinning out exponentially
    beyond. The proton at the center is roughly 60,000 times smaller than the sphere, so the atom is almost
    entirely empty space. This marker is the diameter of the Bohr-radius sphere.
  name: Hydrogen Atom
  source: https://physics.nist.gov/cgi-bin/cuu/Value?bohrrada0
  value: 1.058e-10
- description: A carbon atom is about 140 picometers across, twice its empirical atomic radius of 70 pm,
    a convention for comparing atom sizes rather than a hard edge. Its two inner 1s electrons stay very
    close to the nucleus, while its four outer electrons, the ones that form chemical bonds, spread out
    to about this radius. Carbon's van der Waals radius, how close a non-bonded neighbor can approach,
    is much larger, about 170 pm.
  name: Carbon Atom
  source: https://webelements.co.uk/carbon/atom_sizes.html
  value: 1.4e-10
- description: The copper K-alpha-1 X-ray emission line, used in diffraction, has a measured wavelength
    of 0.15405925 nanometers.
  name: X-ray Wavelength
  source: https://tsapps.nist.gov/publication/get_pdf.cfm?pub_id=920358
  value: 1.5405925e-10
- description: The O-H bond length in water, the most important molecule for life. This precise distance
    creates water's unique properties - its high boiling point, surface tension, and ability to dissolve
    salts. Water's bent geometry makes it polar, allowing it to form hydrogen bonds that give ice its
    unusual property of being less dense than liquid water, crucial for aquatic life in cold climates.
  name: Water Molecule
  source: https://en.wikipedia.org/wiki/Water
  value: 2.75e-10
- name: Graphene Layer Spacing
  value: 3.35e-10
  source: https://en.wikipedia.org/wiki/Graphite
  description: Neighboring carbon sheets in graphite are about 0.335 nanometers apart. Each sheet is a
    honeycomb of strongly bonded atoms, but the attraction between sheets is much weaker, allowing pencil
    graphite to leave thin flakes on paper. This marker is the separation of layers in the stack, not
    the thickness of an isolated graphene sheet, whose apparent thickness depends on how it is measured.
- name: Buckminsterfullerene
  value: 7.1e-10
  source: https://en.wikipedia.org/wiki/Buckminsterfullerene
  description: The carbon cage of a buckminsterfullerene molecule is about 0.71 nanometers across, measured
    between the nuclei on opposite sides. Its sixty carbon atoms form a closed arrangement of pentagons
    and hexagons resembling a football. The surrounding electron clouds make its effective outer size
    larger, an example of why even a familiar-looking molecular cage needs a careful definition of diameter.
- description: The size of a glucose molecule, the primary fuel for cellular respiration. This sugar's
    compact structure allows it to efficiently store chemical energy - one glucose molecule can power
    a cell for several minutes. The molecule's size is optimized for transport through cell membranes
    and interaction with metabolic enzymes. Interestingly, glucose exists in multiple ring forms, with
    this size representing the most stable configuration in solution.
  name: Glucose Molecule
  source: https://en.wikipedia.org/wiki/Glucose
  value: 1e-9
- name: One-Nanometer Transistor Gate
  value: 1.0e-09
  source: https://news.berkeley.edu/2016/10/10/smallest-transistor-ever/
  description: A research transistor demonstrated in 2016 used a physical gate just one nanometer long.
    A carbon nanotube controlled current through a sheet of molybdenum disulfide, bringing an electronic
    switch down to a dimension comparable with a small molecule. This measures the gate in that experimental
    device; it is different from the commercial process names used to describe generations of computer
    chips.
- description: The diameter of DNA's double helix, the molecular blueprint of life. This remarkably consistent
    width accommodates the universal genetic code across all species. The helix's major groove provides
    access for proteins to read genetic information, while the minor groove offers binding sites for regulatory
    molecules. This precise dimension has remained constant through billions of years of evolution, reflecting
    the fundamental constraints of molecular biology.
  name: DNA Helix Width
  source: https://en.wikipedia.org/wiki/DNA
  value: 2e-9
- name: Cell Membrane
  value: 4.0e-09
  source: https://en.wikipedia.org/wiki/Cell_membrane
  description: A typical cell membrane is about four nanometers thick, although its composition and embedded
    proteins make the boundary uneven. Its lipids arrange themselves into a double layer with water-loving
    surfaces and water-avoiding tails tucked inside. This exceedingly thin barrier lets a cell maintain
    a different chemical world from its surroundings while specialized proteins control which substances
    can pass through it.
- description: The size of small proteins like insulin, molecular machines that perform specific cellular
    functions. Proteins fold into precise shapes determined by their amino acid sequence - a single wrong
    amino acid can cause diseases like sickle cell anemia. This size represents the optimal balance between
    stability and flexibility, allowing proteins to interact with other molecules while maintaining their
    functional structure. Remarkably, proteins can fold from random coils to precise shapes in microseconds.
  name: Protein (Small)
  source: https://en.wikipedia.org/wiki/Protein
  value: 5e-9
- name: Actin Filament
  value: 7.0e-09
  source: https://en.wikipedia.org/wiki/Microfilament
  description: An actin filament is about seven nanometers across, built from two intertwined strands
    of protein subunits. Networks of these filaments support a cell's surface and help it change shape,
    while interactions with motor proteins produce movement. A filament is only a little wider than a
    small protein, yet joining many subunits turns molecular parts into scaffolding that can span a cell.
- name: Nucleosome
  value: 1.1e-08
  source: https://en.wikipedia.org/wiki/Nucleosome
  description: A nucleosome is a disc about eleven nanometers across, formed when DNA winds around a core
    of histone proteins. Repeating these packages helps a cell fit a long genetic molecule into its nucleus
    while keeping different stretches available for use. The DNA strand itself is much narrower than the
    disc, so the first stage of chromosome packaging already changes its visible scale.
- name: SARS-CoV-2 Spike
  value: 2.0e-08
  source: https://pmc.ncbi.nlm.nih.gov/articles/PMC7665311/
  description: A prefusion SARS-CoV-2 spike is roughly twenty nanometers long, projecting from the virus
    membrane like a flexible molecular club. Three protein chains join to form each spike, whose head
    can bind to a receptor on a host cell. Hinges in its stalk let the head tilt, helping a virus much
    smaller than a bacterium make the first contact needed for infection.
- name: Microtubule
  value: 2.5e-08
  source: https://en.wikipedia.org/wiki/Microtubule
  description: A microtubule is a hollow protein tube about twenty-five nanometers across. Cells assemble
    and dismantle these tubes from tubulin subunits, building tracks for molecular motors and the spindle
    that separates chromosomes during division. Its length can grow across much of a cell, while its width
    remains molecular; the number here measures the tube's outer diameter rather than its changing length.
- name: Ribosome
  value: 3.0e-08
  source: https://en.wikipedia.org/wiki/Ribosome
  description: A large eukaryotic ribosome can be about thirty nanometers across. It reads the sequence
    carried by messenger RNA and joins amino acids into a protein, using RNA at the heart of its catalytic
    machinery. The finished protein leaves a machine larger than many of its individual products, placing
    this miniature factory between ordinary molecules and the smaller viruses on the scale.
- description: SARS-CoV-2, the coronavirus behind COVID-19, is a roughly spherical particle about 91 nm
    across. Its fatty envelope is studded with a few dozen spike proteins that reach another 20 nm or
    so outward and latch onto ACE2 receptors on human cells. Inside, a single strand of RNA about 30,000
    letters long is one of the largest genomes of any RNA virus. This marker is the mean envelope diameter
    measured by cryo-electron tomography, not counting the spikes; viruses as a group range from about
    20 nm to more than a micrometer.
  name: Virus
  source: https://www.nature.com/articles/s41586-020-2665-2
  value: 9.1e-08
- name: Nuclear Pore Complex
  value: 1.2e-07
  source: https://en.wikipedia.org/wiki/Nuclear_pore
  description: A vertebrate nuclear pore complex is about 120 nanometers across, forming a protein gateway
    through the envelope around the nucleus. It allows selected molecules to move between the nucleus
    and the surrounding cell while helping control the traffic of large cargo. The whole assembly is wider
    than many viruses, even though it operates as one small feature in a much larger cell.
- name: Bacteriophage T4
  value: 2.0e-07
  source: https://en.wikipedia.org/wiki/Escherichia_virus_T4
  description: Bacteriophage T4 is about 200 nanometers long from its protein head through its tail. It
    infects bacteria, using tail fibers to recognize a host and a contractile apparatus to deliver its
    genetic material into the cell. The virus resembles a landing craft at this scale, but its moving
    parts are proteins, assembled into an infection mechanism far smaller than the bacterium it attacks.
- name: Mycoplasma Cell
  value: 2.0e-07
  source: https://en.wikipedia.org/wiki/Mycoplasma
  description: A small mycoplasma cell can be about 200 nanometers across, near the lower end of the sizes
    found among independently reproducing cells. Unlike many bacteria, mycoplasmas lack a rigid cell wall,
    leaving their membrane to enclose the machinery of life. A whole cell can therefore share the scale
    of a large virus, despite having a very different internal organization and life cycle.
- description: A low-pressure mercury germicidal lamp emits strongly at 253.7 nanometers in the ultraviolet.
  name: UV Wavelength
  source: https://www.cdc.gov/infection-control/hcp/environmental-control/air.html
  value: 2.537e-07
- name: Tobacco Mosaic Virus
  value: 3.0e-07
  source: https://en.wikipedia.org/wiki/Tobacco_mosaic_virus
  description: 'A tobacco mosaic virus particle is a rod about 300 nanometers long. Its RNA lies within
    a repeating helix of protein subunits, showing how a relatively simple set of parts can build a highly
    regular structure. Its narrow width and much greater length also show why a single size number needs
    a definition: this marker follows the rod along its long axis.'
- name: Blu-ray Track Pitch
  value: 3.2e-07
  source: https://en.wikipedia.org/wiki/Blu-ray
  description: Adjacent tracks on a Blu-ray disc are about 320 nanometers apart, less than half the spacing
    on a DVD. A shorter-wavelength laser and carefully focused optics let the reader distinguish the more
    tightly packed pattern. The disc remains a familiar object held in a hand, but the separation of its
    information tracks belongs beside viruses and other microscopic structures on this scale.
- description: The wavelength of green light, the peak sensitivity of human vision. This wavelength defines
    the resolution limit of optical microscopes and explains why we can't see individual atoms with visible
    light. The evolution of color vision in primates was driven by the need to distinguish ripe fruits
    from foliage, with green being the most common color in nature. This wavelength also determines the
    diffraction patterns that create the iridescent colors in butterfly wings and soap bubbles.
  name: Visible Light Wavelength
  source: https://en.wikipedia.org/wiki/Visible_spectrum
  value: 5e-7
- name: Mimivirus
  value: 6.0e-07
  source: https://en.wikipedia.org/wiki/Mimivirus
  description: A mimivirus particle can be about 600 nanometers across when its surrounding protein fibers
    are included. Its unusually large size helped it evade recognition as a virus when researchers first
    encountered it in amoebae. It sits near the dimensions of some small bacteria, a reminder that viruses
    and cells overlap in size even though their ways of reproducing are fundamentally different.
- name: DVD Track Pitch
  value: 7.4e-07
  source: https://en.wikipedia.org/wiki/Blu-ray
  description: Adjacent data tracks on a DVD are about 740 nanometers apart. A laser follows the spiral
    pattern as it reads the disc, distinguishing changes too small to see without magnification. The spacing
    is close to the wavelengths of visible light, which explains why the optical design matters so much;
    packing the spiral more tightly requires a system able to distinguish finer detail.
- description: The length of E. coli bacteria, the workhorse of molecular biology. These rod-shaped microbes
    can reproduce every 20 minutes under ideal conditions, meaning a single bacterium could theoretically
    produce more offspring than there are atoms in the observable universe in just two days. Their streamlined
    shape optimizes nutrient absorption and allows them to swim efficiently through viscous environments
    using rotating flagella.
  name: Bacteria
  source: https://en.wikipedia.org/wiki/Escherichia_coli
  value: 2e-6
- name: Human Platelet
  value: 2.5e-06
  source: https://en.wikipedia.org/wiki/Platelet
  description: A resting human platelet is about 2.5 micrometers across, a small fragment released by
    a much larger cell in the bone marrow. When a blood vessel is damaged, platelets adhere, change shape
    and help assemble a plug at the injury. Several can fit across the width of one red blood cell, making
    this essential repair system a collaboration among very small cellular fragments.
- name: Spider Silk Fiber
  value: 3.0e-06
  source: https://en.wikipedia.org/wiki/Spider_silk
  description: A representative spider silk thread is about three micrometers thick, although spiders
    make several kinds of silk with different dimensions and purposes. Its protein chains organize into
    a material that combines strength with stretch, helping a web absorb a moving insect's energy. The
    filament is far thinner than a human hair; much of a web's apparent delicacy comes from this narrow
    diameter.
- name: Chloroplast
  value: 5.0e-06
  source: https://en.wikipedia.org/wiki/Chloroplast
  description: A representative chloroplast is about five micrometers across, with substantial variation
    among plants and cell types. Inside, folded membranes hold the machinery that captures light energy
    and supports photosynthesis. These organelles retain their own DNA, reflecting an ancient partnership
    with photosynthetic bacteria; their dimensions still sit comfortably in the neighborhood of bacterial
    cells rather than those of whole plant cells.
- name: Budding Yeast Cell
  value: 5.0e-06
  source: https://en.wikipedia.org/wiki/Saccharomyces_cerevisiae
  description: A budding yeast cell can be about five micrometers across, at the small end of the usual
    size range. This single-celled fungus reproduces by growing a daughter cell from its surface, and
    its metabolism makes bread rise and supports fermentation. A familiar kitchen process therefore depends
    on cells comparable in width to a chloroplast, each carrying the machinery of a complete organism.
- name: Human Capillary
  value: 7.0e-06
  source: https://en.wikipedia.org/wiki/Capillary
  description: A representative capillary is about seven micrometers across, within the narrow range of
    the body's smallest blood vessels. Red blood cells can deform as they pass through, bringing oxygen
    close to tissues that would be unreachable by larger vessels alone. The diameter of this tiny conduit
    is comparable with the cells it carries, turning blood flow into a procession through microscopic
    passages.
- description: The diameter of red blood cells, the oxygen carriers of the human body. These cells lack
    nuclei to maximize space for hemoglobin, the protein that binds oxygen. Their biconcave shape increases
    surface area for gas exchange while allowing them to squeeze through capillaries narrower than their
    own diameter. Remarkably, an adult human has about 25 trillion red blood cells, and they complete
    a full circuit of the body in just 20 seconds.
  name: Red Blood Cell
  source: https://en.wikipedia.org/wiki/Red_blood_cell
  value: 8e-6
- description: Thermal radiation from a 310 kelvin body peaks near 9.35 micrometers by Wien's law, in
    the infrared.
  name: Infrared Wavelength
  source: https://lhea.gsfc.nasa.gov/archive/mwmw/mmw_bbody.html
  value: 9.35e-06
- description: This mitochondrion, from a human T cell imaged by electron microscopy, is about 4.3 micrometers
    long and 1.4 wide; others range from under one micrometer to about ten. Mitochondria make most of a
    cell's ATP on their inner membrane, which folds into plates called cristae to fit more surface inside.
    They descend from bacteria taken in by an ancestral cell more than 1.5 billion years ago and still
    carry a small genome of their own.
  name: Mitochondrion
  source: https://openorganelle.janelia.org/datasets/jrc_jurkat-1
  value: 4.3e-6
- name: Neutrophil
  value: 1.2e-05
  source: https://en.wikipedia.org/wiki/Neutrophil
  description: A human neutrophil is about twelve micrometers across in a stained blood smear, with its
    apparent size depending on preparation. It is a white blood cell that can engulf microbes and move
    out of blood vessels toward damaged or infected tissue. It is wider than a red blood cell, yet flexible
    enough to squeeze through confined spaces while pursuing its targets.
- name: Human Cone Cell
  value: 4.5e-05
  source: https://en.wikipedia.org/wiki/Cone_cell
  description: A retinal cone cell is roughly forty-five micrometers long, within the usual range for
    these light-sensitive cells. Different cone pigments respond most strongly to different parts of the
    visible spectrum, giving the brain signals it can compare to produce color vision. The whole cell
    is far longer than the wavelengths it detects, because detecting light also requires cellular machinery
    to maintain and transmit the signal.
- description: A reconstructed rat cortical interneuron spans roughly 0.8 millimeters, including its
    dendrites and the axon that branches through nearby tissue. The explorer shows NeuroMorpho.Org cell
    NMO_109111, traced from a layer-4 barrel-cortex neuron by Emmenegger and colleagues, with its full
    traced geometry. The traveling glow illustrates an action potential starting near the cell body and
    spreading through the axon's branches; its speed and position are explanatory, not measured for this
    cell. Some neurons send axons over a meter, from the spinal cord to the foot.
  name: Neuron
  source: https://neuromorpho.org/neuron_info.jsp?neuron_name=BC140212B_21
  value: 8e-4
- description: The diameter of human hair, a remarkable biological fiber that grows continuously throughout
    life. Hair is stronger than steel by weight and can stretch up to 30% before breaking. Each hair follicle
    cycles through growth phases lasting 2-7 years, which is why hair can grow so long. The diameter varies
    by ethnicity, with Asian hair typically being thicker than European hair, and red hair being the thickest.
  name: Human Hair
  source: https://en.wikipedia.org/wiki/Hair
  value: 1e-4
- name: Human Egg Cell
  value: 0.00012
  source: https://en.wikipedia.org/wiki/Egg_cell
  description: A human egg cell is about 120 micrometers across, among the largest individual cells in
    the body. Its generous cytoplasm provides material for the earliest stages after fertilization, while
    the much smaller sperm mainly contributes genetic material. The egg's diameter is comparable with
    the width of a human hair, bringing a single cell close to the edge of unaided human vision.
- name: Optical Fiber Cladding
  value: 0.000125
  source: https://en.wikipedia.org/wiki/Optical_fiber
  description: 'The glass cladding around a common telecommunications optical fiber is 125 micrometers
    across. Light travels through a much narrower central core, with the surrounding glass helping keep
    it guided along the fiber. This marker excludes the protective coatings and cable jacket: the glass
    itself is near the width of a human hair, while carrying signals over distances far beyond anything
    visible at this scale.'
- name: Rotifer
  value: 0.0002
  source: https://en.wikipedia.org/wiki/Rotifer
  description: A representative rotifer is about 0.2 millimeters long, a complete multicellular animal
    living at a scale often associated with single cells. A ring of beating cilia around its head sweeps
    food toward its mouth and can create the appearance of turning wheels. Its body fits within a fraction
    of a sand grain, while still containing specialized organs for feeding and reproduction.
- name: Paramecium
  value: 0.00025
  source: https://en.wikipedia.org/wiki/Paramecium
  description: A representative paramecium is about a quarter of a millimeter long, although different
    species vary substantially in size. Thousands of tiny beating cilia move this single-celled organism
    through water and sweep food toward its feeding groove. It is larger than many human cells, yet all
    of its swimming, feeding and internal organization belong to one cell rather than a multicellular
    body.
- name: Dust Mite
  value: 0.0003
  source: https://en.wikipedia.org/wiki/House_dust_mite
  description: An adult house dust mite is about 0.3 millimeters long, at the upper end of its usual range.
    These tiny relatives of spiders live among the fibers and sheltered surfaces of homes, where humidity
    helps them avoid drying out. Their bodies are too small to inspect easily without magnification, yet
    proteins associated with them can make their presence noticeable to people with allergies.
- name: Tardigrade
  value: 0.0005
  source: https://en.wikipedia.org/wiki/Tardigrade
  description: A grown tardigrade is commonly about half a millimeter long, small enough to disappear
    among grains of sand. Its plump body carries four pairs of legs tipped with claws, which help it clamber
    through films of water on moss and other surfaces. Some species survive severe drying by entering
    a dormant state, making an animal of microscopic dimensions unusually resilient to losing water.
- name: Fruit Fly Brain
  value: 0.0008
  source: https://doi.org/10.1038/s41586-024-07558-y
  description: An adult fruit fly brain spans roughly 0.8 millimeters from one optic lobe to the other,
    as measured in the FlyWire reconstruction. In 2024 the FlyWire collaboration published the complete
    wiring diagram of this female brain, about 139,000 neurons joined by more than fifty million synapses.
    The model shows 2,200 of those reconstructed neurons, colored by broad class. A brain smaller than
    a poppy seed steers flight, navigation, learning and courtship.
- description: The size of sand grains, the building blocks of beaches and deserts. Sand forms through
    the weathering of rocks over millions of years, with each grain representing a tiny piece of geological
    history. The size determines how sand behaves - fine sand flows like liquid when dry but becomes solid
    when wet, while coarse sand maintains its shape. Remarkably, there are more grains of sand on Earth
    than there are stars in the observable universe.
  name: Grain of Sand
  source: https://en.wikipedia.org/wiki/Sand
  value: 1e-3
- name: Cat Flea
  value: 0.0015875
  source: https://trace.tennessee.edu/utk_agexdise/16
  description: An adult cat flea is about 1.6 millimeters long, with a body flattened from side to side
    so it can move between hairs. Enlarged hind legs let it jump almost two hundred times its own height,
    a remarkable mechanical feat at this size. It is only a little larger than a grain of sand, yet its
    shape and movement suit a highly specialized life on a host.
- name: Fruit Fly
  value: 0.0025
  source: https://en.wikipedia.org/wiki/Drosophila_melanogaster
  description: A female fruit fly (Drosophila melanogaster) is about 2.5 mm long, roughly a third the
    length of a housefly. Its short life cycle and easily studied genes made it a workhorse of biology
    for more than a century, and its entire adult brain has now been mapped as a [connectome](https://en.wikipedia.org/wiki/Connectome),
    a neuron-by-neuron wiring diagram. An insect smaller than a grain of rice is therefore one of the
    few animals whose brain circuitry can be read like a circuit board.
- description: The length of worker ants, among the most successful insects on Earth. Ants can carry objects
    50 times their own weight and work together in colonies of millions. They communicate through chemical
    trails and can navigate using the Earth's magnetic field. Some species farm fungi, while others keep
    aphids as livestock. The total biomass of ants on Earth exceeds that of all humans combined.
  name: Ant
  source: https://en.wikipedia.org/wiki/Ant
  value: 5e-3
- description: The length of houseflies, masterful fliers that can hover, fly backwards, and perform aerial
    acrobatics. Their compound eyes contain 4,000 lenses and can detect movement 10 times faster than
    human eyes. Flies taste with their feet and can walk on ceilings using tiny hairs and adhesive pads.
    They're vectors for over 100 diseases, making them one of humanity's deadliest enemies.
  name: Housefly
  source: https://en.wikipedia.org/wiki/Housefly
  value: 7e-3
- name: Paedophryne Amauensis
  value: 0.0077
  source: https://en.wikipedia.org/wiki/Paedophryne_amauensis
  description: Paedophryne amauensis, a leaf-litter frog from Papua New Guinea, averages just 7.7 mm from
    snout to vent, a little longer than a housefly. Described in 2012, it was billed as the smallest known
    vertebrate, and it remains among the smallest, rivaled only by a few frogs of the genus Brachycephalus.
    A complete animal with a backbone, a brain and eyes fits in a length shorter than the width of a pencil.
- name: Honeybee
  value: 0.0125
  source: https://dimensions.com/element/western-honey-bee-apis-mellifera
  description: A worker western honeybee is about 10 to 15 mm long, nearly twice the length of a housefly.
    Workers report food sources to the hive with the [waggle dance](https://en.wikipedia.org/wiki/Waggle_dance),
    a figure-eight run whose angle and duration encode direction and distance, work that earned Karl von
    Frisch a share of the 1973 Nobel Prize in Physiology or Medicine. A whole colony's map of the countryside
    is built from animals this small.
- name: Human Eye
  value: 0.024
  source: https://en.wikipedia.org/wiki/Human_eye
  description: The adult human eyeball is a slightly flattened sphere about 24 mm across, roughly the
    width of a large coin. Its length is set tightly by the cornea and lens, which is why short-sightedness
    is usually caused by an eyeball that has grown a little too long. Giant squid eyes reach at least
    27 cm, more than ten times wider, and rank among the largest eyes of any living animal.
- name: Bumblebee Bat
  value: 0.031
  source: https://en.wikipedia.org/wiki/Kitti%27s_hog-nosed_bat
  description: Kitti's hog-nosed bat, also called the bumblebee bat, is only 29 to 33 mm long and weighs
    about 2 g, making it potentially the smallest mammal by body length. The Etruscan shrew can be lighter
    but is longer, at 36 to 53 mm, so the title depends on whether length or mass is counted. It is about
    half the length of a bee hummingbird, yet it is a warm-blooded, furred, flying mammal.
- name: Table Tennis Ball
  value: 0.04
  source: https://en.wikipedia.org/wiki/Table_tennis
  description: A regulation table tennis ball is forty millimeters across. Replacing the smaller balls
    used before 2000 increased air resistance and helped slow the game, showing how a modest change in
    diameter can alter familiar motion. Its hollow shell keeps the mass low while presenting a comparatively
    broad surface to the air, placing a precise sporting standard beside naturally variable animal sizes.
- name: Bee Hummingbird
  value: 0.055
  source: https://en.wikipedia.org/wiki/Bee_hummingbird
  description: A male bee hummingbird is about 5.5 centimeters long, placing a complete bird near the
    dimensions of a large insect. This Cuban hummingbird sustains hovering flight with rapid wingbeats
    while feeding at flowers, where its small body and slender bill bring it close to the nectar. The
    female is slightly larger, so this marker uses a representative male length rather than a limit shared
    by every individual.
- name: Tennis Ball
  value: 0.067
  source: https://en.wikipedia.org/wiki/Tennis_ball
  description: A standard tennis ball is about 6.7 centimeters across, within the permitted range for
    ordinary competition balls. Its pressurized rubber core and felt covering control how it bounces and
    moves through air, so its size works together with material and surface texture. The sphere is only
    a little wider than a small hummingbird is long, connecting a familiar object with an unexpectedly
    compact animal.
- name: Credit Card
  value: 0.0856
  source: https://en.wikipedia.org/wiki/ISO/IEC_7810
  description: The ID-1 card format has a long edge of 85.60 millimeters, a short edge of 53.98 millimeters
    and a thickness of 0.76 millimeters. Shared dimensions let payment cards and many identity cards fit
    the same kinds of wallets and readers. A precise rectangle creates compatibility between everyday
    objects made around the world, sitting close to the spread wings of a small butterfly.
- description: The wingspan of monarch butterflies, champions of long-distance migration. These insects
    travel up to 3,000 miles from Canada to Mexico, using the Sun's position and Earth's magnetic field
    for navigation. Their orange and black pattern warns predators of their toxicity, while their wings
    contain scales that create iridescent colors through light interference. Remarkably, the migration
    takes multiple generations to complete.
  name: Butterfly Wingspan
  source: https://en.wikipedia.org/wiki/Monarch_butterfly
  value: 1e-1
- description: A 2.45 gigahertz household microwave has a free-space wavelength of about 12.2 centimeters,
    calculated from the speed of light.
  name: Microwave Wavelength
  source: https://www.fda.gov/media/103619/download
  value: 0.12236
- name: Smartphone
  value: 0.1476
  source: https://www.apple.com/iphone-16/specs/
  description: An iPhone 16 is 147.6 mm tall, 71.6 mm wide and 7.8 mm thick, and weighs 170 g. Inside,
    the processor holds billions of transistors, each much smaller than a bacterium, cut from a silicon
    wafer of the kind a few items further up the scale. The whole device is about 1.7 times the length
    of a credit card.
- name: Titan Beetle
  value: 0.17
  source: https://en.wikipedia.org/wiki/Titan_beetle
  description: The titan beetle of South American rainforests can exceed seventeen centimeters in body
    length, longer than a smartphone is tall. Its heavy body, spiny thorax and powerful jaws give an unusually
    imposing form to an insect that still fits within a hand's span. The measurement follows the body
    rather than the antennae, which helps distinguish its size from that of other long-horned beetles.
- name: Vivian Hailstone
  value: 0.2032
  source: https://www.weather.gov/abr/vivianhailstone
  description: A hailstone recovered at Vivian, South Dakota, in July 2010 measured eight inches, or about
    twenty centimeters, across. It set a United States record for hail diameter after a thunderstorm repeatedly
    lifted growing ice through cold cloud layers. The measurement follows the stone's greatest width,
    a reminder that ice falling from a cloud can reach the dimensions of an everyday ball.
- name: Basketball
  value: 0.239
  source: https://en.wikipedia.org/wiki/Basketball_(ball)
  description: A basketball with a circumference of 29.5 inches is about twenty-four centimeters in diameter.
    The circumference wraps all the way around the ball, so reading it as the width would exaggerate its
    size by a factor of pi. This marker uses the derived diameter, making a familiar object useful for
    seeing the distinction between a straight line across a sphere and a measurement around it.
- name: Queen Alexandra's Birdwing
  value: 0.26
  source: https://en.wikipedia.org/wiki/Queen_Alexandra%27s_birdwing
  description: A female Queen Alexandra's birdwing can span about twenty-six centimeters across its wings,
    within a reported range of roughly twenty-five to twenty-eight centimeters. This large butterfly lives
    in Papua New Guinea, with males smaller than females. Its wings extend well beyond the insect's body,
    so this marker measures the spread flight surfaces rather than the body length used for a beetle or
    fly.
- name: A4 Paper
  value: 0.297
  source: https://en.wikipedia.org/wiki/ISO_216
  description: An A4 sheet has a long edge of 297 millimeters and a short edge of 210 millimeters. The
    proportions preserve the same shape when a sheet is cut in half, allowing the successive sizes of
    the A series to fit together systematically. This marker follows the long edge, a precisely standardized
    length that happens to sit close to the diameter of a modern silicon wafer.
- name: Silicon Wafer
  value: 0.3
  source: https://en.wikipedia.org/wiki/Wafer_(electronics)
  description: A large silicon wafer used in chip manufacturing is three hundred millimeters across. Its
    polished surface can carry many integrated circuits at once, each patterned with details enormously
    smaller than the disc that supports them. The wafer is a thin slice of a grown crystal, placing the
    industrial material at an everyday scale while its finished electronic features belong in the microscopic
    world.
- name: Elephant Bird Egg
  value: 0.33
  source: https://en.wikipedia.org/wiki/Elephant_bird
  description: Eggs of the extinct elephant birds (Aepyornis) of Madagascar were roughly 26 to 40 cm long
    and held 5.6 to 13 litres, among the largest eggs ever laid by any bird. The largest weighed an estimated
    10.5 kg, with a shell about 3.3 mm thick. Their mothers stood up to 3 m tall, and a single egg is
    close to the width of a 300 mm silicon wafer.
- description: From nose to rump, a typical domestic cat is about 46 cm long; its tail adds roughly another
    30 cm. Cats are obligate carnivores with retractable claws and exceptional night vision. They can
    rotate their ears 180 degrees and hear frequencies up to 65 kHz, far beyond human hearing. Remarkably,
    cats purr at frequencies that promote bone healing, and they spend 12-16 hours per day sleeping.
  name: Cat Length
  source: https://www.govinfo.gov/content/pkg/GOVPUB-A101-PURL-gpo173402/pdf/GOVPUB-A101-PURL-gpo173402.pdf
  value: 0.46
- name: Meganeura
  value: 0.7
  source: https://en.wikipedia.org/wiki/Meganeura
  description: Meganeura, a giant dragonfly-like insect that flew about 300 million years ago in the Late
    Carboniferous, had a wingspan of roughly 65 to 75 cm, each wing about 32 cm long. That is wider than
    a house cat is long and seven times the wingspan of the butterfly on the scale. It was long thought
    that higher oxygen levels let insects grow so large, but the idea has problems and is still debated.
- name: Rafflesia
  value: 1.0
  source: https://en.wikipedia.org/wiki/Rafflesia_arnoldii
  description: A Rafflesia arnoldii flower can grow to about one meter across, making a single bloom comparable
    with a doorway in width. The plant lives as a parasite within a host vine and lacks the familiar visible
    leaves and stems of most flowering plants. Its bloom emerges as a large, temporary structure, concentrating
    the scale of the organism's visible life into one extraordinary flower.
- description: The average height of humans, a species that walks upright on two legs. This bipedal stance
    freed our hands for tool use and allowed us to see over tall grass on the African savanna. Human height
    varies dramatically across populations due to genetics, nutrition, and environment. The tallest recorded
    human was 8 feet 11 inches, while the shortest was 1 foot 9 inches. Height affects everything from
    health outcomes to social perceptions and career success.
  name: Human Height
  source: https://en.wikipedia.org/wiki/Human_height
  value: 1.7
- name: Komodo Dragon
  value: 2.6
  source: https://en.wikipedia.org/wiki/Komodo_dragon
  description: The Komodo dragon, the largest living lizard, lives on a handful of Indonesian islands.
    Guinness World Records gives an average adult male as 2.59 m long and 79 to 91 kg; the largest verified
    captive specimen reached about 3.13 m and 166 kg. A mature male is one and a half times as long as
    a human is tall.
- description: A 100 megahertz FM broadcast signal has a free-space wavelength of about three meters,
    calculated from the speed of light.
  name: Radio Wavelength
  source: https://www.ecfr.gov/current/title-47/chapter-I/subchapter-C/part-73/subpart-H/section-73.201
  value: 2.9979
- name: African Bush Elephant
  value: 3.2
  source: https://en.wikipedia.org/wiki/African_bush_elephant
  description: A mature male African bush elephant stands about 3.2 meters tall at the shoulder, with
    considerable variation between individuals. Its pillar-like legs carry a massive body while its long
    trunk can reach, grasp and explore without the animal lowering its head. This marker measures shoulder
    height rather than trunk reach or body length, placing the largest living land animal within a clearly
    defined human-scale comparison.
- name: Wandering Albatross
  value: 3.7
  source: https://en.wikipedia.org/wiki/Wandering_albatross
  description: The wandering albatross has the greatest known wingspan of any living bird. Typical adults
    span about 3 to 3.1 m, and the largest reliably measured birds reached about 3.7 m, wider than a bull
    African elephant is tall. Reports of 4 m or more remain unverified. It is a long-range soarer over
    the Southern Ocean, travelling vast distances with few wingbeats by extracting energy from wind gradients
    above the waves.
- name: Giant Pacific Octopus
  value: 4.3
  source: https://en.wikipedia.org/wiki/Giant_Pacific_octopus
  description: The giant Pacific octopus is the largest octopus, usually weighing around 15 kg with an
    arm span up to about 4.3 m. Its largest suckers are about 6.4 cm wide and can support around 16 kg
    each. A soft animal with no skeleton can flatten itself through any gap larger than its beak, which
    is why an octopus can escape from containers that seem far too small for it.
- description: The height of male giraffes, the tallest living animals on Earth. Their incredible height
    allows them to browse leaves 20 feet above ground, accessing food unavailable to other herbivores.
    Giraffes have the same number of neck vertebrae as humans (seven), but each one is 10 inches long.
    Their hearts pump blood 6 feet uphill to reach their brains, requiring blood pressure twice that of
    humans and special valves to prevent fainting when they lower their heads.
  name: Giraffe Height
  source: https://en.wikipedia.org/wiki/Giraffe
  value: 5.5
- name: Lolong the Crocodile
  value: 6.17
  source: https://en.wikipedia.org/wiki/Saltwater_crocodile
  description: Lolong, a saltwater crocodile caught in the Philippines, measured 6.17 meters long and
    weighed more than a tonne. That exceptional body length exceeded the usual dimensions of mature males,
    showing why a record specimen needs to be distinguished from a typical animal. His length was greater
    than a giraffe's standing height, putting the crocodile's horizontal silhouette among the largest
    living land-associated animals on the scale.
- name: Very Large Telescope Mirror
  value: 8.2
  source: https://en.wikipedia.org/wiki/Very_Large_Telescope
  description: Each of the Very Large Telescope's main unit telescopes has a primary mirror 8.2 meters
    across. Such a broad collecting surface gathers faint starlight that would miss a smaller telescope,
    while carefully controlled supports help preserve the mirror's shape. Its diameter is comparable with
    the height of a small building, giving an everyday sense of the engineering needed to study objects
    vastly farther away.
- name: Tyrannosaurus Rex SUE
  value: 12.3
  source: https://en.wikipedia.org/wiki/Sue_(dinosaur)
  description: SUE, the Field Museum's Tyrannosaurus rex specimen FMNH PR 2081, measures roughly 12.3
    to 12.8 m along the backbone and stood about 3.66 to 3.96 m tall at the hips. It was 27 to 33 years
    old when it died, with 33 the best-supported estimate. The skeleton is among the most complete of
    any T. rex, and stretched out it is more than twice the height of a giraffe.
- name: Giant Squid
  value: 13.0
  source: https://en.wikipedia.org/wiki/Giant_squid
  description: The giant squid is estimated to reach about 12 to 13 m in total length for females and
    10 m for males, including its two long feeding tentacles, which account for roughly 10 m. The body
    with arms is rarely more than 5 m. Reports of 20 m or more are not scientifically documented. A giant
    squid was first filmed alive in its natural habitat only in 2012.
- name: Hubble Space Telescope
  value: 13.2
  source: https://en.wikipedia.org/wiki/Hubble_Space_Telescope
  description: The Hubble Space Telescope is about 13.2 meters long, with its mirror and instruments enclosed
    in a spacecraft larger than a bus. Operating above most of the atmosphere allows it to avoid the blur
    that moving air introduces into astronomical images. The telescope is modest beside a rocket or space
    station, yet its view reaches far beyond the stars visible to unaided eyes.
- name: Sperm Whale
  value: 15.8496
  source: https://www.fisheries.noaa.gov/species/sperm-whale
  description: Male sperm whales reach about 52 feet (15.8 m) and females up to roughly 35 to 40 feet.
    NOAA reports dives that routinely reach 2,000 feet (about 600 m) and can last 45 minutes. At about
    half the length of a blue whale it is still the largest toothed whale, and it hunts in water so deep
    that no sunlight reaches it.
- name: James Webb Sunshield
  value: 21.197
  source: https://en.wikipedia.org/wiki/Sunshield_(JWST)
  description: The James Webb Space Telescope's deployed sunshield is about 21.2 meters long. Its five
    thin layers separate the telescope's cold observing side from sunlight and heat, allowing sensitive
    infrared instruments to detect faint radiation from distant objects. A spacecraft capable of studying
    galaxies therefore carries a shade comparable in length to a small building, even though its layers
    fold for launch.
- description: The length of blue whales, the largest animals ever to live on Earth. These marine giants
    can weigh up to 200 tons and consume 4 tons of krill daily. Their hearts are the size of small cars
    and beat only twice per minute. Blue whales communicate across entire ocean basins using low-frequency
    sounds that travel thousands of miles underwater. Despite their massive size, they feed on tiny shrimp-like
    krill.
  name: Blue Whale
  source: https://en.wikipedia.org/wiki/Blue_whale
  value: 30
- name: Titanosaur Cast
  value: 37.2
  source: https://www.pbs.org/newshour/amp/science/massive-titanosaur-biggest-dinosaur-ever-found-squeezes-into-museum-of-natural-history
  description: The American Museum of Natural History's cast of a Patagonian titanosaur (Patagotitan mayorum)
    is 122 feet (about 37 m) long, so large that its head and part of its 39-foot neck poke out of the
    gallery doorway while the back barely grazes the 19-foot-4-inch ceiling. Estimates for the living
    animal range from about 31 to 40 m depending on method. It is longer than a blue whale and ranks among
    the largest land animals known.
- name: Space Shuttle Orbiter
  value: 37.24
  source: https://en.wikipedia.org/wiki/Space_Shuttle_orbiter
  description: A Space Shuttle orbiter is about 37.24 meters long from nose to tail. Its wings and heat-protected
    underside allowed a spacecraft returning from orbit to descend through the atmosphere and finish as
    an unpowered glider. The measured length excludes the external tank and launch boosters, placing the
    reusable spacecraft itself near the body length of the largest animals on this scale.
- name: Giant Siphonophore
  value: 45.7
  source: https://schmidtocean.org/new-species-discovered-during-exploration-of-abyssal-deep-sea-canyons-off-ningaloo/
  description: In 2020 the research ship Falkor filmed an estimated 150-foot (about 46 m) siphonophore
    in deep canyons off Western Australia, an unusually large observed colony. A siphonophore is not a
    single body but a floating colony of many specialised clones strung along a stem, working together
    like one animal. This one was about one and a half times the length of a blue whale.
- name: Boeing 747-8
  value: 76.25
  source: https://en.wikipedia.org/wiki/Boeing_747-8
  description: The Boeing 747-8 Intercontinental is 76.25 meters long, with wings spanning 68.40 meters.
    Its stretched fuselage extends the familiar raised-forward-deck profile of the earlier 747, carrying
    a large passenger cabin within a structure that must also endure the forces of flight. Its nose-to-tail
    length is about two and a half times that of a blue whale, with an equally striking span across its
    wings.
- description: The length of American football fields, standardized playing surfaces that have become
    cultural landmarks. The field's dimensions were designed to balance offense and defense, creating
    strategic depth while maintaining spectator visibility. Interestingly, the field is exactly 100 yards
    long, but with end zones it spans 120 yards total. This length has remained constant since the sport's
    early days, making it one of the most consistent measurements in professional sports.
  name: Football Field
  source: https://en.wikipedia.org/wiki/American_football_field
  value: 91.44
- description: From the ground at its star-shaped fort to the tip of the torch, the Statue of Liberty
    stands 93 m (305 ft) tall. Half of that is the copper statue itself, 46 m from base to torch; the
    rest is Richard Morris Hunt's granite pedestal and the walls of Fort Wood beneath it. The statue's
    skin of copper sheets, only about 2.4 mm thick, hangs on an iron framework designed by Gustave Eiffel,
    the engineer behind the Eiffel Tower, and it weathered from brown to its familiar green patina within
    about two decades of the 1886 dedication.
  name: Statue of Liberty
  source: https://www.nps.gov/stli/learn/historyculture/statue-statistics.htm
  value: 92.99
- name: International Space Station
  value: 109.0
  source: https://www.nasa.gov/international-space-station/space-station-facts-and-figures/
  description: NASA lists the space station at 356 feet (109 m) end to end, with a pressurized module
    length of 67 m, 1,005 cubic metres of pressurized volume and a mass of 419,725 kg. It is the largest
    single structure humans have built in orbit, slightly longer than the 91.4 m football field, and it
    circles Earth about every 90 minutes at five miles per second.
- name: Hyperion Moon
  value: 270000
  source: https://science.nasa.gov/saturn/moons/hyperion/
  description: Saturn's moon Hyperion has a mean diameter of about 270 kilometers, though its irregular
    body is longer in some directions than others. Cassini images reveal a sponge-like surface of deep,
    sharp-edged craters, and the moon tumbles chaotically rather than keeping one face toward Saturn. Its
    low density suggests much of its interior is empty space between loosely packed ice.
- name: Hyperion
  value: 116.2
  source: https://en.wikipedia.org/wiki/Hyperion_(tree)
  description: Hyperion, a coast redwood in California, was measured at about 116.2 meters tall in 2026.
    An entire living tree rises above the height of the space station's end-to-end span, supported by
    wood built over many years of growth. The measurement follows height above the base, a familiar vertical
    dimension that makes a single organism comparable with substantial engineered structures.
- name: Great Pyramid of Giza
  value: 146.6
  source: https://en.wikipedia.org/wiki/Great_Pyramid_of_Giza
  description: The Great Pyramid originally rose 146.6 m (280 royal cubits); erosion and the loss of its
    capstone and casing have reduced it to about 138.5 m. Its base side is 230.33 m, and it is made of
    an estimated 2.3 million large blocks. It was the tallest human-made structure on Earth for more than
    3,700 years, a record that stood until the Middle Ages.
- name: Dimorphos
  value: 151.0
  source: https://en.wikipedia.org/wiki/Dimorphos
  description: Dimorphos had a volume-equivalent diameter of about 151 meters in pre-impact shape measurements.
    NASA's DART spacecraft deliberately struck this moonlet of the asteroid Didymos, changing its orbit
    and testing a method of planetary defense. The target was comparable with a substantial building in
    size, showing how a controlled collision with a small body can produce a measurable change in celestial
    motion.
- name: Gateway Arch
  value: 192.0
  source: https://en.wikipedia.org/wiki/Gateway_Arch
  description: The Gateway Arch rises about 192 meters above the ground in St. Louis, and its overall
    width is approximately the same. Its hollow legs taper upward and meet at the summit, turning a vast
    span of space into the monument's central feature. This marker measures the height, a dimension large
    enough to make a person at its base almost disappear in the overall shape.
- name: Hoover Dam
  value: 221.4
  source: https://en.wikipedia.org/wiki/Hoover_Dam
  description: Hoover Dam rises about 221 meters from its foundation to its crest. Its curved concrete
    body transfers water pressure into the canyon walls, using the surrounding rock as part of the structure
    that holds back Lake Mead. This is the dam's structural height, rather than the depth of water behind
    it, placing a single engineered barrier among the larger landmarks on a human scale.
- name: Hindenburg
  value: 245.0
  source: https://en.wikipedia.org/wiki/LZ_129_Hindenburg
  description: The airship LZ 129 Hindenburg was 245 m long and 41 m in diameter, held about 200,000 cubic
    metres of gas and is the largest airship by envelope volume. It was only about 24 m shorter than the
    Titanic. Lifting that size of structure through the air required a hull that was mostly hydrogen,
    with thin framework and fabric holding the shape.
- name: Titanic
  value: 269.1
  source: https://en.wikipedia.org/wiki/Titanic
  description: RMS Titanic was 882 feet 9 inches (269.1 m) long overall with a beam of 28.2 m. The hull
    rose 53.3 m from keel to the top of the funnels. At about four fifths of the Eiffel Tower's height,
    the ship was the largest afloat when she entered service in 1912, and she lies broken in two on the
    seabed of the North Atlantic.
- name: Arecibo Telescope
  value: 305.0
  source: https://en.wikipedia.org/wiki/Arecibo_Telescope
  description: The former Arecibo radio telescope's reflector was about 305 meters across, spread through
    a natural depression in Puerto Rico. Instruments suspended above the dish collected radio signals
    and supported radar studies, making the landscape part of the observing system. Its suspended platform
    collapsed in 2020, but the dish's dimensions still illustrate an astronomical instrument comparable
    with a major city landmark in width.
- description: The height of the Eiffel Tower, an iron lattice structure that was initially criticized
    but became the symbol of Paris. Built for the 1889 World's Fair, it was the tallest human-made structure
    for 41 years. The tower expands 6 inches in summer heat and contracts in winter cold. It weighs 10,100
    tons but exerts the same pressure on the ground as a person sitting in a chair. Over 300 million people
    have visited this engineering marvel.
  name: Eiffel Tower
  source: https://en.wikipedia.org/wiki/Eiffel_Tower
  value: 330
- name: Ever Given
  value: 399.94
  source: https://en.wikipedia.org/wiki/Ever_Given
  description: Ever Given is a container ship 399.94 m long with a 58.8 m beam and a capacity of 20,124
    TEU. When she ran aground on 23 March 2021 she blocked the Suez Canal in both directions for just
    over six days, holding up a large share of world shipping. Longer than the Eiffel Tower is tall, she
    is among the largest ships ever built.
- name: Prelude FLNG
  value: 488.0
  source: https://en.wikipedia.org/wiki/Prelude_FLNG
  description: Prelude FLNG is a floating gas-liquefaction facility 488 meters long and seventy-four meters
    wide. Rather than transporting cargo between ports like an ordinary ship, it provides a platform for
    processing gas offshore, with a vast arrangement of industrial equipment above its hull. Its length
    exceeds that of many large ocean liners; stood on end, it would reach well over half the height of
    the Burj Khalifa.
- name: Bennu
  value: 490.0
  source: https://en.wikipedia.org/wiki/101955_Bennu
  description: Bennu has a mean diameter of about 490 meters, putting an entire asteroid near the length
    of a large ship. Its surface is covered in boulders and its interior behaves as a collection of material
    held together weakly, rather than a single solid rock. The OSIRIS-REx mission collected a sample from
    this small world, connecting a distant body with material studied in laboratories on Earth.
- name: FAST Radio Telescope
  value: 500.0
  source: https://en.wikipedia.org/wiki/Five-hundred-meter_Aperture_Spherical_Telescope
  description: FAST's reflector spans five hundred meters across a natural depression in China's landscape.
    Only part of the full surface is illuminated for a particular observation, with movable panels helping
    reshape the active region as the telescope points. The number measures the entire dish, a structure
    wider than many large ships are long, built to collect extraordinarily faint radio signals from the
    sky.
- name: Lituya Bay Megatsunami
  value: 524.0
  source: https://en.wikipedia.org/wiki/1958_Lituya_Bay_megatsunami
  description: On 9 July 1958 a landslide of about 30 million cubic metres fell into Lituya Bay in Alaska,
    and the resulting [megatsunami](https://en.wikipedia.org/wiki/Megatsunami) ran 524 m up the opposite
    slope at Gilbert Inlet, the highest run-up of the wave on record. That is taller than the 330 m Eiffel
    Tower and well over half the height of the Burj Khalifa.
- name: Dinkinesh
  value: 738
  source: https://en.wikipedia.org/wiki/152830_Dinkinesh
  description: Dinkinesh has a volume-equivalent diameter of about 738 meters, meaning a sphere of that
    width would contain the same volume as its irregular body. NASA's Lucy mission found that it has a
    small companion made of two joined lobes. A system of multiple asteroid pieces fits within a scale
    familiar from buildings and bridges, while preserving clues to how small bodies assemble and change.
- description: The height of the Burj Khalifa, the world's tallest building that pierces the sky at over
    half a mile high. This architectural marvel uses a bundled tube design inspired by desert flowers,
    with setbacks that reduce wind loads. The building contains 57 elevators and can sway up to 2 meters
    in strong winds. At the top, temperatures are 10 degrees cooler than ground level, and the air pressure
    is 20% lower than at sea level.
  name: Burj Khalifa
  source: https://en.wikipedia.org/wiki/Burj_Khalifa
  value: 828
- name: Ryugu
  value: 896.0
  source: https://en.wikipedia.org/wiki/162173_Ryugu
  description: Ryugu has a mean diameter of about 896 meters and a broad equatorial ridge that gives it
    a spinning-top profile. Japan's Hayabusa2 spacecraft brought material from its dark surface back to
    Earth, allowing scientists to examine an asteroid directly. Its size is comparable with a very tall
    building, yet it is a separate world whose shape and surface reflect conditions in extremely weak
    gravity.
- name: Angel Falls
  value: 979.0
  source: https://en.wikipedia.org/wiki/Angel_Falls
  description: Angel Falls in Venezuela drops 979 m in total, with an uninterrupted plunge of 807 m, almost
    the height of the Burj Khalifa. The official height was determined by a 1949 expedition led by Ruth
    Robertson. Because the heights were measured from a considerable distance, it remains uncertain whether
    Angel Falls or Tugela Falls in South Africa is the tallest in the world.
- name: Meteor Crater
  value: 1186.0
  source: https://en.wikipedia.org/wiki/Meteor_Crater
  description: Meteor Crater in Arizona is about 1.19 kilometers across, a bowl left when a much smaller
    incoming body struck the ground. The impact transferred energy abruptly into rock, excavating and
    overturning material far beyond the projectile's own dimensions. Its size provides a readable example
    of impact physics on Earth before the scale moves outward to the enormous craters and battered surfaces
    of other worlds.
- name: Mount Thor Cliff
  value: 1200
  source: https://en.wikipedia.org/wiki/Mount_Thor
  description: Mount Thor's west face drops about 1,200 meters in a nearly unbroken cliff on Baffin Island.
    Its slight overhang makes the rock face different from a steep slope that gradually descends across
    the ground. This marker measures the vertical drop, a wall of rock taller than the highest buildings
    elsewhere on the scale, rather than the mountain's elevation above the sea.
- name: Golden Gate Bridge Main Span
  value: 1280.0
  source: https://www.goldengate.org/bridge/history-research/statistics-data/design-construction-stats/
  description: The Golden Gate Bridge's main span, the distance between its towers, is 4,200 feet (1,280
    m), and the towers rise 227 m above the water. Each main cable is 0.92 m thick and 2,332 m long, together
    containing about 129,000 km of steel wire, enough to circle Earth more than three times. The span
    is one and a half times the height of the Burj Khalifa.
- name: Lake Baikal Depth
  value: 1642.0
  source: https://en.wikipedia.org/wiki/Lake_Baikal
  description: Lake Baikal in Siberia is 1,642 m deep at its maximum, almost exactly twice the height
    of the Burj Khalifa, and 636 km long. It is about 25 to 30 million years old, the oldest lake, and
    holds around 19 percent of the planet's unfrozen fresh water. Its measured maximum depth makes it
    the deepest lake on Earth.
- name: Victoria Falls
  value: 1708.0
  source: https://en.wikipedia.org/wiki/Victoria_Falls
  description: Victoria Falls extends about 1,708 meters across the Zambezi River where water plunges
    into a narrow gorge. Its broad curtain changes with seasonal river flow, so the same rock edge can
    present very different scenes of exposed cliff and rushing water. The measurement is the combined
    width of the falls, placing a single river crossing beside the spans of major bridges.
- name: El Reno Tornado
  value: 4184.294400000001
  source: https://www.weather.gov/oun/events-20130531
  description: The tornado that hit El Reno, Oklahoma, on 31 May 2013 reached a maximum width of 2.6 miles
    (about 4.2 km), the widest tornado known. Mobile radar measured winds of at least 295 miles per hour
    very close to the ground, yet surveyors rated it EF-3 because the strongest winds occurred in small
    sub-vortices that did not hit structures. Its width is more than three times the Golden Gate's main
    span.
- name: Comet 67P
  value: 4300.0
  source: https://en.wikipedia.org/wiki/67P/Churyumov%E2%80%93Gerasimenko
  description: Comet 67P's nucleus is about 4.3 kilometers across its longest overall dimension, with
    two lobes joined by a narrow neck. Sunlight warms its icy material and releases gas and dust, creating
    an atmosphere and tail vastly larger than the solid body. Rosetta followed this small nucleus closely,
    revealing that a comet's spectacular appearance begins with an object comparable in width to a stretch
    of city.
- name: Mount Kilimanjaro
  value: 5895.0
  source: https://en.wikipedia.org/wiki/Mount_Kilimanjaro
  description: Uhuru Peak, the summit of Kilimanjaro in Tanzania, is 5,895 m above sea level, measured
    by a 1952 British survey; later measurements range from 5,892 to 5,902 m. The volcano rises about
    4,900 m above its surrounding plateau and is the highest free-standing mountain above sea level in
    the world. It stands about two thirds the height of Everest.
- description: The height of Mount Everest, Earth's highest peak that continues growing 1 centimeter per
    year due to tectonic plate collision. At this altitude, the air contains only one-third the oxygen
    of sea level, making it the 'death zone' where human survival becomes impossible without supplemental
    oxygen. The mountain's height was first measured in 1856, and over 300 people have died attempting
    to reach its summit. The peak is actually moving northeast at 4 centimeters per year.
  name: Mount Everest
  source: https://en.wikipedia.org/wiki/Mount_Everest
  value: 8848
- name: Mauna Kea
  value: 10211.0
  source: https://www.usgs.gov/faqs/how-big-are-hawaiian-volcanoes
  description: Mauna Kea's summit is 4,205 m above sea level, but the volcano rises nearly 10,211 m from
    the ocean floor, according to the USGS. Measured that way it is more than a kilometre taller than
    Everest, though the definition of a mountain's base is a loose one and different authors choose different
    ones. About 6,000 m of it lies beneath the Pacific.
- description: The depth of the Mariana Trench, Earth's deepest point where pressure reaches 1,000 times
    that at sea level. At this crushing depth, water temperature is near freezing and sunlight never reaches.
    Yet life thrives here - giant amphipods, pressure-resistant fish, and bacteria that feed on chemicals
    from hydrothermal vents. The trench is deeper than Mount Everest is tall, and only three people have
    ever reached its bottom.
  name: Mariana Trench
  source: https://en.wikipedia.org/wiki/Mariana_Trench
  value: 11000
- name: Kola Superdeep Borehole
  value: 12262.0
  source: https://en.wikipedia.org/wiki/Kola_Superdeep_Borehole
  description: The Kola Superdeep Borehole in Russia reached 12,262 m in 1989, the deepest hole drilled
    into the Earth, and is only about 23 cm wide. It is deeper than the Mariana Trench, and temperatures
    of 180 degrees Celsius at about 11.9 km, far hotter than predicted, stopped one deeper attempt. Even
    this reaches less than 0.2 percent of the way to Earth's centre.
- name: Deimos
  value: 12540
  source: https://en.wikipedia.org/wiki/Deimos_(moon)
  description: Deimos is about 12.5 kilometers across in mean diameter, a small, irregular moon of Mars.
    Its subdued, dusty surface contrasts with the sharply cratered appearance of some other small bodies,
    while its weak gravity gives loose material a different environment from that on Earth. An entire
    moon occupies a scale comparable with a deep borehole's length rather than the dimensions of a planet.
- name: Strait of Gibraltar
  value: 14200.0
  source: https://en.wikipedia.org/wiki/Strait_of_Gibraltar
  description: The Strait of Gibraltar narrows to about 14.2 kilometers between Europe and Africa. It
    links the Atlantic Ocean with the Mediterranean Sea, making a short gap between continents an important
    route for water exchange and shipping. This marker follows the narrowest crossing rather than the
    length of the strait, a distance shorter than Manhattan Island from end to end.
- description: The length of Manhattan Island, about 21.6 kilometers from the Battery to Inwood and only
    about 3.7 wide, a sliver of land that houses over 1.6 million people and generates more economic output
    than most countries. This densely packed urban environment contains 1,000 buildings over 100 meters
    tall and processes 2.5 million subway riders daily. The island's narrow shape forced vertical development,
    creating the iconic skyline that defines New York City. Despite its small size, Manhattan's real estate
    value exceeds $3 trillion.
  name: Manhattan Island
  source: https://en.wikipedia.org/wiki/Manhattan
  value: 21600
- name: Phobos
  value: 22160
  source: https://en.wikipedia.org/wiki/Phobos_(moon)
  description: Phobos has a mean diameter of about 22.2 kilometers, though its irregular shape makes its
    longest dimension larger. This small moon circles Mars so closely that it moves across the Martian
    sky much faster than Earth's Moon does across ours. A whole natural satellite can therefore be comparable
    in width to an island or a city, far below the scale of the planet it accompanies.
- name: PSR J0437-4715 Neutron Star
  value: 22720
  source: https://heasarc.gsfc.nasa.gov/docs/nicer/science_nuggets/20240822.html
  description: The pulsar PSR J0437-4715 has an inferred equatorial diameter of about 22.7 kilometers,
    twice the radius measured with NASA's NICER telescope. A star's remnant can therefore fit within the
    width of a city while containing more mass than the Sun. The measurement constrains how matter behaves
    at extraordinary density, where the interior cannot be recreated as a stable sample in a laboratory.
- name: Large Hadron Collider Ring
  value: 27000
  source: https://home.cern/science/accelerators/large-hadron-collider
  description: The Large Hadron Collider follows a ring about twenty-seven kilometers in circumference
    beneath the countryside near Geneva. Superconducting magnets bend beams around this route while electric
    fields accelerate the particles before collisions. The number measures the complete path around the
    machine, rather than its diameter; a structure spanning several kilometers lets scientists investigate
    phenomena far below the dimensions of an atomic nucleus.
- name: Eros
  value: 34400.0
  source: https://en.wikipedia.org/wiki/433_Eros
  description: Eros measures about 34.4 kilometers along its longest dimension, far more than its width
    across. NASA's NEAR Shoemaker spacecraft studied it from orbit before landing on its surface, bringing
    a small asteroid into direct exploration. This marker follows the long axis, emphasizing how a single
    size comparison can conceal a stretched, irregular body rather than the rounded shape expected of
    a planet.
- description: The length of marathon races, a distance born from ancient Greek legend. The original marathon
    commemorates Pheidippides' run from Marathon to Athens to announce victory over Persia. This distance
    represents the limit of human endurance without specialized equipment - most people can walk this
    far, but running requires months of training. The marathon has become a global phenomenon, with over
    800 marathons held worldwide annually, attracting millions of participants.
  name: Marathon Distance
  source: https://worldathletics.org/disciplines/road-running-event/marathon
  value: 42195
- name: Channel Tunnel
  value: 50460.0
  source: https://en.wikipedia.org/wiki/Channel_Tunnel
  description: The Channel Tunnel between England and France is 50.46 km long, of which 37.9 km is under
    the sea, the longest undersea section of any tunnel in the world. It runs 75 m below sea level at
    its deepest and on average 45 m below the seabed. It is longer than a marathon, and a train crosses
    the strait in roughly the time it takes to run a mile.
- name: Hunga Tonga Eruption Plume
  value: 58000.0
  source: https://en.wikipedia.org/wiki/2022_Hunga_Tonga%E2%80%93Hunga_Ha%CA%BBapai_eruption_and_tsunami
  description: On 15 January 2022 the Hunga Tonga-Hunga Haʻapai eruption sent a plume up to about 58 km,
    into the mesosphere, with material also reaching the stratosphere. That is about six and a half times
    the height of Everest and more than half the way to the Karman line. The column is a reminder that
    a volcano can push material to the edge of space.
- description: The length of the Panama Canal, an engineering marvel that revolutionized global trade
    by eliminating the need to sail around South America. This artificial waterway uses a system of locks
    to lift ships 26 meters above sea level, saving ships 8,000 miles of dangerous journey. The canal
    handles 5% of global trade and generates $2 billion annually. It took 75,000 workers and 10 years
    to complete, with over 25,000 deaths during construction.
  name: Panama Canal
  source: https://en.wikipedia.org/wiki/Panama_Canal
  value: 82000
- name: Karman Line
  value: 100000.0
  source: https://en.wikipedia.org/wiki/K%C3%A1rm%C3%A1n_line
  description: The Karman line, set by the FAI at 100 km above mean sea level, is the conventional boundary
    of space. Aircraft can fly only where air is dense enough to give lift, and above this height a vehicle
    would need to travel at orbital speeds to be supported by lift alone. The boundary is a convention
    rather than a sharp edge, and the US Armed Forces award astronaut wings above 80 km.
- name: Danyang-Kunshan Grand Bridge
  value: 164800.0
  source: https://en.wikipedia.org/wiki/Danyang%E2%80%93Kunshan_Grand_Bridge
  description: The Danyang-Kunshan Grand Bridge in China is 164.8 km long and was recognized by Guinness
    World Records in 2011 as the longest bridge in the world. It is a viaduct for high-speed trains, twice
    as long as the Panama Canal. Most of its length carries the line over rice paddies, rivers and lakes
    of the Yangtze delta.
- name: Chicxulub Crater
  value: 180000.0
  source: https://en.wikipedia.org/wiki/Chicxulub_crater
  description: The Chicxulub crater, buried beneath about a kilometre of younger sediment on Mexico's
    Yucatan coast, formed about 66 million years ago and is roughly 180 to 200 km across. It marks the
    impact linked to the [Cretaceous-Paleogene extinction](https://en.wikipedia.org/wiki/Cretaceous%E2%80%93Paleogene_extinction_event).
    The transient cavity was about 100 km wide and 30 km deep, deeper than three Everests are tall.
- name: Suez Canal
  value: 193300.0
  source: https://en.wikipedia.org/wiki/Suez_Canal
  description: The Suez Canal is about 193 kilometers long along its navigable route between the Mediterranean
    and Red seas. It gives ships a passage that avoids sailing around Africa, so a relatively narrow cut
    through land changes voyages on an oceanic scale. The number follows the waterway's course; it should
    be read as a route length rather than the width of a straight geographical footprint.
- name: ISS Orbital Altitude
  value: 402336.0
  source: https://www.nasa.gov/international-space-station/
  description: NASA describes the International Space Station as orbiting 250 miles (about 400 km) above
    Earth at 17,500 miles per hour. That is four times the Karman line, yet only about 3 percent of Earth's
    diameter, the equivalent of a couple of centimetres above the surface of a one-metre globe. It circles
    the planet about every 90 minutes, so the crew sees sixteen sunrises a day.
- name: Grand Canyon Length
  value: 446000.0
  source: https://nps.gov/grca/faqs.htm
  description: The Grand Canyon is 277 river miles (446 km) long, as measured along the Colorado River
    from Lees Ferry to the Grand Wash Cliffs. It is up to 18 miles (29 km) wide and about 6,000 vertical
    feet (1,829 m) deep at its deepest, so its length is about 240 times its greatest depth. The age of
    the canyon is debated, with different segments formed at different times.
- name: Enceladus
  value: 504080.0
  source: https://en.wikipedia.org/wiki/Enceladus
  description: 'Enceladus is about 504 kilometers across, small enough to sit within the span of a large
    terrestrial region. Yet jets escaping near its south pole reveal liquid-water activity beneath an
    icy surface, sending material into space where a spacecraft can sample it. Its modest diameter makes
    that activity striking: a moon much smaller than our own can maintain an accessible connection to
    an internal ocean.'
- name: Vesta
  value: 525400.0
  source: https://en.wikipedia.org/wiki/4_Vesta
  description: Vesta is about 525 kilometers across in mean diameter, with an irregular shape marked by
    enormous impact basins. It differentiated early, separating material into layers, and fragments linked
    to it have reached Earth as meteorites. A body only a fraction of the Moon's width can therefore preserve
    evidence of planetary building processes, making this asteroid a surviving piece of the Solar System's
    early history.
- name: Olympus Mons Width
  value: 585000.0
  source: https://science.nasa.gov/photojournal/pj-olympus-mons-lava-flows-2
  description: 'Olympus Mons is about 585 km across, wider than the state of Arizona and more than 20
    times wider than it is tall. That proportion explains its gentle shape: its flanks climb at an average
    of only a few degrees, rising 26 km over a distance of roughly 290 km from rim to summit. Seen from
    the ground, it would not look like a mountain so much as a slowly rising plain.'
- name: Lake Tanganyika
  value: 673000.0
  source: https://en.wikipedia.org/wiki/Lake_Tanganyika
  description: Lake Tanganyika stretches about 673 kilometers along its longest dimension. The lake occupies
    a deep basin within the East African Rift, where the continent is slowly pulling apart and shaping
    a narrow, elongated landscape. Its length is far greater than its width, so one number cannot convey
    the whole shape; this marker follows the lake from one end toward the other.
- name: Mammoth Cave
  value: 685000.0
  source: https://www.nps.gov/maca/learn/management/statistics.htm
  description: The surveyed passages of Mammoth Cave in Kentucky total about 685 kilometers in the National
    Park Service's cited inventory. This is an accumulated route length through a branching underground
    network, rather than the distance between two entrances or the width of a chamber. Explorers can increase
    the total by connecting more passages, revealing how a folded, connected system fits great length
    into a much smaller region.
- name: Longest Lightning Flash
  value: 829000.0
  source: https://public.wmo.int/news/media-centre/wmo-certifies-megaflash-lightning-record-usa
  description: The World Meteorological Organization certified an 829 km megaflash on 31 July 2025, a
    bolt from 22 October 2017 that stretched from eastern Texas to near Kansas City, Missouri, with a
    margin of error of plus or minus 8 km. It beat the previous record, 768 km across the southern United
    States in 2020. Such flashes spread sideways through huge storm systems.
- name: Ceres
  value: 939400.0
  source: https://en.wikipedia.org/wiki/Ceres_(dwarf_planet)
  description: Ceres has a mean diameter of about 939 kilometers, making it the largest object in the
    main asteroid belt. Gravity has drawn it into an approximately rounded shape, while bright deposits
    in some craters reveal a chemically active history involving salts and water. It is much smaller than
    Earth's Moon, yet large enough for the distinction between a loose-looking asteroid and a miniature
    world to become visible.
- name: San Andreas Fault
  value: 1210000
  source: https://en.wikipedia.org/wiki/San_Andreas_Fault
  description: The San Andreas Fault runs roughly 750 miles (1,210 km) through California, marking the
    [transform boundary](https://en.wikipedia.org/wiki/Transform_fault) where the Pacific and North American
    plates slide past each other. Along its length the slip averages 20 to 35 mm per year, about the pace
    at which fingernails grow. The fault is nearly three times the length of the Grand Canyon.
- name: Charon
  value: 1212000.0
  source: https://en.wikipedia.org/wiki/Charon_(moon)
  description: Charon has a mean diameter of about 1,212 kilometers, more than half the width of Pluto.
    Its unusually large size relative to its partner places their shared center of mass outside Pluto,
    giving the pair a distinctive orbital arrangement. A moon much smaller than Earth's can therefore
    play a proportionally larger role in its system, making relative size as revealing as size alone.
- name: Typhoon Tip
  value: 2220000.0
  source: https://en.wikipedia.org/wiki/Typhoon_Tip
  description: Typhoon Tip in 1979 reached a wind field diameter of 2,220 km (1,380 mi), the largest tropical
    cyclone on record, and a lowest pressure of 870 hPa, also a record. That diameter is about half the
    width of the contiguous United States. A storm that wide covers an area comparable to the whole of
    Europe's western half.
- name: Great Barrier Reef
  value: 2300000.0
  source: https://en.wikipedia.org/wiki/Great_Barrier_Reef
  description: The Great Barrier Reef stretches over 2,300 km along Australia's Queensland coast, with
    an area of about 344,400 square kilometres, more than 2,900 individual reefs and 900 islands. It is
    the largest coral reef system, built by billions of tiny polyps rather than any single organism. Its
    length is more than five times the Grand Canyon.
- name: Eris
  value: 2326000.0
  source: https://en.wikipedia.org/wiki/Eris_(dwarf_planet)
  description: Eris is about 2,326 kilometers across, close to Pluto's diameter despite being a separate
    icy world in the distant Solar System. Finding bodies like it helped force astronomers to reconsider
    what they meant by a planet and establish the dwarf-planet category. This marker follows its measured
    diameter, showing how an object comparable with Pluto could change the classification of familiar
    worlds.
- name: Pluto
  value: 2376000
  source: https://nssdc.gsfc.nasa.gov/planetary/factsheet/plutofact.html
  description: Pluto is a dwarf planet about two-thirds as wide as Earth's Moon, circling the Sun roughly
    39 times farther away than Earth does. NASA's New Horizons spacecraft reached it in 2015 after nearly
    ten years in flight and found mountains of water ice and a broad heart-shaped plain of frozen nitrogen.
    The International Astronomical Union reclassified Pluto in 2006, once astronomers began finding other
    worlds of similar size in the Kuiper Belt.
- name: Earth's Inner Core
  value: 2442000.0
  source: https://en.wikipedia.org/wiki/Earth%27s_inner_core
  description: Earth's inner core is a solid ball of mostly iron and nickel about 1,221 km in radius,
    or 2,442 km in diameter, with a radius about 70 percent that of the Moon. Its temperature is estimated
    at about 5,700 K, comparable to the surface of the Sun, but the pressure keeps it solid. It lies about
    5,100 km beneath our feet.
- name: Triton
  value: 2706800.0
  source: https://en.wikipedia.org/wiki/Triton_(moon)
  description: Triton has a mean diameter of about 2,707 kilometers, making it Neptune's largest moon.
    It travels around the planet in the opposite direction to Neptune's rotation, an unusual orbit consistent
    with a captured origin. Its icy surface and observed plumes show that even a cold world far from the
    Sun can be active, at a diameter smaller than Earth's Moon but much larger than most asteroids.
- name: Europa
  value: 3121600.0
  source: https://en.wikipedia.org/wiki/Europa_(moon)
  description: Europa has a mean diameter of about 3,122 kilometers, slightly smaller than Earth's Moon.
    Beneath its fractured ice surface, evidence points to a global ocean kept from freezing solid by heat
    associated with its interior and tidal interactions. The size marker follows the whole moon, giving
    a planetary scale to the question of whether water hidden under ice can provide environments suitable
    for life.
- name: Moon
  value: 3474800.0
  source: https://nssdc.gsfc.nasa.gov/planetary/factsheet/moonfact.html
  description: The Moon is about 3,475 km across, just over a quarter of Earth's diameter, which is unusually
    large for a moon of a planet. Its whole surface is only a bit larger than Africa. It is about 400
    times narrower than the Sun and also about 400 times closer, a coincidence that lets it cover the
    Sun almost exactly during a total solar eclipse.
- name: Appalachian Trail
  value: 3536400.0
  source: https://en.wikipedia.org/wiki/Appalachian_Trail
  description: The Appalachian Trail is 2,197.4 miles (3,536.4 km) long as of 2024, running through 14
    states from Georgia to Maine. Its highest point is Kuwohi at 6,643 feet (2,025 m), and it is the longest
    hiking-only footpath in the world. The length changes slightly as the route is relocated. It is about
    three quarters the width of the contiguous United States.
- name: Io
  value: 3648400.0
  source: https://en.wikipedia.org/wiki/Io_(moon)
  description: 'Io has a mean diameter of about 3,648 kilometers, placing it close to Earth''s Moon in
    overall width. Its surface is dramatically different: intense tidal flexing associated with Jupiter
    and neighboring moons helps power widespread volcanism. Similar size does not guarantee a similar
    world, because the gravitational environment can change how a moon''s interior releases energy and
    continually renews its exterior.'
- name: Valles Marineris
  value: 4000000.0
  source: https://en.wikipedia.org/wiki/Valles_Marineris
  description: Valles Marineris is the largest canyon in the Solar System, more than 4,000 km long, about
    200 km wide and up to 7 km deep in places. Placed on Earth it would run for roughly nine times the
    length of the Grand Canyon, about as far as the width of the continental United States. Most geologists
    think it began as a vast crack opened as the neighboring Tharsis volcanic region swelled, rather than
    as a river valley.
- name: Contiguous US Longest Distance
  value: 4509000.0
  source: https://en.wikipedia.org/wiki/Contiguous_United_States
  description: The longest great-circle route entirely within the contiguous United States is about 4,509
    kilometers, between the coasts of Florida and Washington. This follows a path on Earth's curved surface,
    rather than measuring the country along a horizontal line on a map. The span exceeds a third of Earth's
    diameter, connecting a continental journey with the scale of the whole planet beneath it.
- name: Sahara
  value: 4800000.0
  source: https://en.wikipedia.org/wiki/Sahara
  description: The Sahara extends roughly 4,800 kilometers from east to west across northern Africa. Its
    landscapes include broad rocky and gravel-covered regions as well as the sand dunes that often represent
    it in photographs. This marker follows the desert's long dimension, a continental span comparable
    with a crossing of the contiguous United States and far greater than any individual dune field.
- name: Callisto
  value: 4820600.0
  source: https://en.wikipedia.org/wiki/Callisto_(moon)
  description: Callisto has a mean diameter of about 4,821 kilometers, nearly the width of Mercury. Its
    heavily cratered surface preserves a long record of impacts, unlike the rapidly renewed volcanic surface
    of Jupiter's moon Io. Both are large moons of the same planet, but their different histories show
    why diameter is only one part of the story a planetary body can tell.
- name: Mercury
  value: 4879400.0
  source: https://nssdc.gsfc.nasa.gov/planetary/factsheet/mercuryfact.html
  description: Mercury has a mean diameter of about 4,879 kilometers, only a little wider than some of
    the Solar System's largest moons. A disproportionately large metallic core makes it much denser than
    an icy moon of similar width. Its placement shows why the labels planet and moon describe orbital
    relationships rather than a simple ladder of sizes, with smaller planets overlapping the dimensions
    of large satellites.
- name: Titan
  value: 5149530.0
  source: https://en.wikipedia.org/wiki/Titan_(moon)
  description: Titan has a mean diameter of about 5,150 kilometers, making Saturn's largest moon wider
    than the planet Mercury. A dense atmosphere hides much of its surface from visible-light cameras,
    while radar revealed lakes and channels associated with liquid hydrocarbons. It is a reminder that
    a moon can be a substantial world, with weather and landscapes whose ingredients differ profoundly
    from those familiar on Earth.
- name: Ganymede
  value: 5268000.0
  source: https://en.wikipedia.org/wiki/Ganymede_(moon)
  description: Ganymede, a moon of Jupiter, is the largest moon in the Solar System at about 5,270 km
    across, wider than the planet Mercury (4,880 km). Mercury is still heavier, because Ganymede is a
    mix of rock and water ice with only about 45 percent of Mercury's mass. Ganymede is the only moon
    known to generate its own magnetic field.
- description: The approximate 6,400 km length of the Amazon River, Earth's mightiest waterway that carries
    more water than the next seven largest rivers combined. This river system drains 40% of South America
    and discharges 200,000 cubic meters of water per second into the Atlantic. The Amazon contains 20%
    of the world's fresh water and supports 10% of Earth's biodiversity. Its length is disputed because
    it has multiple sources, and depends on which headwater and mouth are counted.
  name: Amazon River
  source: https://modis.gsfc.nasa.gov/gallery/individual.php?db_date=2018-10-26
  value: 6400000
- name: Mars
  value: 6779000.0
  source: https://nssdc.gsfc.nasa.gov/planetary/factsheet/marsfact.html
  description: Mars has a mean diameter of about 6,779 kilometers, a little over half Earth's width. Its
    surface records impact craters, enormous volcanoes, canyons and traces of past water activity, providing
    evidence of a complex planetary history. Because most of Earth is covered by oceans, the total surface
    of the smaller planet is comparable in area with all of Earth's exposed land.
- name: Trans-Siberian Railway
  value: 9289000.0
  source: https://en.wikipedia.org/wiki/Trans-Siberian_Railway
  description: The Trans-Siberian Railway's route from Moscow to Vladivostok runs about 9,289 kilometers.
    Rails connect cities and landscapes across a large portion of Eurasia, turning a continental distance
    into a continuous path traveled by trains. The marker measures the railway route rather than the straight-line
    separation of its ends, placing one engineered connection above the length of the Amazon River on
    this scale.
- name: Sirius B
  value: 11300000.0
  source: https://en.wikipedia.org/wiki/Sirius
  description: Sirius B is a white dwarf about 11,300 kilometers across, slightly smaller than Earth despite
    containing roughly the mass of the Sun. It is the dense remnant of a star, shining beside the much
    brighter Sirius A in our nearby stellar neighborhood. Compressing a stellar mass into a planetary
    diameter produces a radically different kind of object from the planets beside it on this scale.
- name: Venus
  value: 12103600.0
  source: https://nssdc.gsfc.nasa.gov/planetary/factsheet/venusfact.html
  description: 'Venus has a mean diameter of about 12,104 kilometers, making it remarkably close to Earth
    in size. Its surface environment is profoundly different, beneath a dense atmosphere that traps heat
    and supports clouds far above the ground. Placing the two worlds beside each other exposes a useful
    limit of scale comparisons: nearly matching dimensions can still produce very different planetary
    conditions.'
- description: The diameter of Earth, our home planet that orbits the Sun at 67,000 mph while rotating
    at 1,000 mph at the equator. Earth is slightly flattened at the poles due to its rotation, making
    it an oblate spheroid rather than a perfect sphere. This diameter determines Earth's gravity, atmospheric
    retention, and climate patterns. If Earth were compressed to the size of a basketball, its surface
    would be smoother than the ball itself, with mountains and ocean trenches representing tiny imperfections.
  name: Earth Diameter
  source: https://en.wikipedia.org/wiki/Earth
  value: 1.27e7
- name: Great Red Spot
  value: 16350000
  source: https://en.wikipedia.org/wiki/Great_Red_Spot
  description: 'Jupiter''s Great Red Spot measured about 16,350 kilometers wide in April 2017, wider than
    Earth. The storm is an anticyclone: a vast, rotating atmospheric system that has persisted while changing
    shape and shrinking over time. This marker preserves a dated width rather than treating the weather
    as fixed geometry, giving a familiar planetary globe as a comparison for the scale of a storm.'
- description: The combined surveyed length of the Great Wall of China's walls and trenches, a massive
    defensive system built over 2,000 years to protect against nomadic invasions. This ancient wonder
    is actually a series of walls built by different dynasties, with some sections dating back to the
    7th century BC. The wall is wide enough for five horses to ride abreast and contains watchtowers every
    200 meters. Despite its reputation, the wall was never completely effective at stopping invaders,
    but it remains one of humanity's most ambitious construction projects.
  name: Great Wall of China
  source: https://www.greatwallheritage.cn/CCMCMS/html/1/54/index.html
  value: 21196180
- name: Saturn's Hexagon
  value: 25000000.0
  source: https://en.wikipedia.org/wiki/Saturn%27s_hexagon
  description: A jet stream circling Saturn's north pole has settled into a six-sided shape about 25,000
    km across, wide enough to hold almost two Earths side by side. Each straight side is roughly 14,500
    km long, which is longer than Earth's diameter, and the whole pattern turns once every 10 hours 39
    minutes. The hexagon is around 300 km tall and was first seen by the Voyager spacecraft and then studied
    in detail by Cassini.
- name: Geostationary Orbit
  value: 35786000.0
  source: https://en.wikipedia.org/wiki/Geostationary_orbit
  description: A satellite 35,786 km above the equator circles Earth once per sidereal day, so it appears
    to hang motionless over one spot on the ground. Arthur C. Clarke popularized the idea in 1945, and
    the ring of satellites there now carries television, communications and weather observations. A radio
    signal needs about 0.12 seconds to reach the ground from that height, and the orbit lies about a tenth
    of the way to the Moon.
- name: Neptune
  value: 49244000
  source: https://nssdc.gsfc.nasa.gov/planetary/factsheet/neptunefact.html
  description: Neptune is about 49,000 km across, nearly four times the width of Earth, yet it is too
    dim to see without a telescope. It was found in 1846 after astronomers calculated where an unseen
    planet must be pulling Uranus away from its predicted path. It orbits about 30 times farther from
    the Sun than Earth does, and takes roughly 165 years to complete a single lap.
- name: Uranus
  value: 50724000.0
  source: https://nssdc.gsfc.nasa.gov/planetary/factsheet/uranusfact.html
  description: Uranus has a mean diameter of about 50,724 kilometers, roughly four times Earth's width.
    Its rotation axis is tilted so far that the planet effectively rolls through its orbit on its side,
    producing extreme seasonal geometry. The number measures a mean diameter of a flattened giant planet,
    giving a consistent comparison with the other worlds rather than following only its broader equator.
- name: Saturn
  value: 116464000.0
  source: https://nssdc.gsfc.nasa.gov/planetary/factsheet/saturnfact.html
  description: 'Saturn has a mean diameter of about 116,464 kilometers, excluding its extensive ring system.
    Its rapid rotation makes the planet visibly flattened, so its equatorial diameter is larger than the
    value shown here. Separating the globe from the rings helps reveal the geometry: the planet is already
    immense, while the bright material surrounding it reaches much farther outward in a remarkably thin
    plane.'
- description: The diameter of Jupiter, the solar system's largest planet that acts as a cosmic vacuum
    cleaner, protecting Earth from asteroids and comets. This gas giant contains more mass than all other
    planets combined and has a Great Red Spot storm larger than Earth. Jupiter's massive gravity influences
    the orbits of other planets and has 95 known moons, including Europa, which may harbor life beneath
    its icy surface.
  name: Jupiter Diameter
  source: https://en.wikipedia.org/wiki/Jupiter
  value: 1.4e8
- name: Proxima Centauri Diameter
  value: 214553880.0
  source: https://en.wikipedia.org/wiki/Proxima_Centauri
  description: Proxima Centauri's diameter is about 215,000 kilometers. This red dwarf is only modestly
    wider than Jupiter, despite being a star that produces energy by nuclear fusion. It is the Sun's nearest
    stellar neighbor, yet its small, cool surface makes it too faint for unaided eyes, showing how strongly
    stellar size and temperature shape what we see.
- name: Saturn's Rings
  value: 280360000.0
  source: https://en.wikipedia.org/wiki/Rings_of_Saturn
  description: Saturn's bright main-ring system spans about 280,000 kilometers when measured out to the
    narrow F ring. Across that immense width, much of the material occupies an extraordinarily thin plane,
    though ring thickness varies and some structures rise higher. The rings are countless separate orbiting
    particles rather than a solid sheet, extending through a substantial fraction of the distance between
    Earth and the Moon.
- description: The distance to the Moon, Earth's closest celestial neighbor that influences our tides,
    stabilizes our rotation, and lights our nights. This distance varies by 50,000 km due to the Moon's
    elliptical orbit, creating supermoons and micromoons. The Moon is slowly drifting away at 3.8 cm per
    year, meaning it was much closer in ancient times. Twelve people have walked on the Moon, and it's
    the only celestial body humans have visited beyond Earth.
  name: Earth-Moon Distance
  source: https://en.wikipedia.org/wiki/Lunar_distance_(astronomy)
  value: 3.84e8
- description: The diameter of the Sun, our star that converts 600 million tons of hydrogen into helium
    every second, releasing energy equivalent to 100 billion nuclear bombs. This nuclear fusion process
    has been ongoing for 4.6 billion years and will continue for another 5 billion years. The Sun contains
    99.86% of the solar system's mass and generates enough energy in one second to power human civilization
    for 500,000 years.
  name: Sun Diameter
  source: https://en.wikipedia.org/wiki/Sun
  value: 1.39e9
- name: James Webb Space Telescope Orbit
  value: 1500000000.0
  source: https://science.nasa.gov/mission/webb/orbit/
  description: The James Webb Space Telescope operates around the Sun–Earth L2 region, roughly 1.5 million
    kilometers from Earth. Its orbit around this gravitationally useful location lets one sunshield keep
    the Sun, Earth and Moon on the warm side of the observatory. The marker measures an approximate Earth-to-observatory
    distance, which varies along the orbit, at about four times the distance to our Moon.
- name: Vega Diameter
  value: 3792956400.0
  source: https://en.wikipedia.org/wiki/Vega
  description: Vega's equatorial diameter is about 3.79 million kilometers, wider than its diameter measured
    through the poles. The star rotates rapidly enough to distort its shape, so a single spherical outline
    would hide an important part of its structure. This marker follows the equator, placing a familiar
    bright star on the scale while showing that stars need not be perfectly round.
- name: Sun-Neptune Distance
  value: 4514953000000.0
  source: https://nssdc.gsfc.nasa.gov/planetary/factsheet/neptunefact.html
  description: Neptune's orbital semimajor axis is about 4.51 billion kilometers, a measure of the size
    of its path around the Sun. At this distance the outermost major planet needs far longer than Earth
    to complete a circuit. The marker measures a star-to-orbit distance rather than the diameter of the
    whole orbit, placing familiar planetary globes within the much wider architecture of their system.
- name: Parker Solar Probe Closest Approach
  value: 6115507200.0
  source: https://svs.gsfc.nasa.gov/14741/
  description: On 24 December 2024 NASA's Parker Solar Probe flew about 6.1 million km (3.8 million miles)
    above the visible surface of the Sun, inside the outer corona, moving at roughly 700,000 km/h. That
    is the closest any spacecraft has come to a star, nearly seven times closer to the Sun's center than
    Mercury ever gets. Sunlight leaving the surface reaches the probe in about 20 seconds.
- name: TRAPPIST-1 System
  value: 18520216392.66
  source: https://en.wikipedia.org/wiki/TRAPPIST-1
  description: TRAPPIST-1 is a dim red dwarf 40.7 light-years away with seven roughly Earth-sized planets,
    and the whole system could fit comfortably inside Mercury's orbit. The outermost planet, h, circles
    only 0.0619 AU (9.3 million km) from the star, so the system is about 18.5 million km wide, less than
    one sixth the width of Mercury's orbit. The star itself is only about 12 percent of the Sun's radius,
    just a little larger than Jupiter.
- name: Sagittarius A* Event Horizon
  value: 25400000000.0
  source: https://en.wikipedia.org/wiki/Sagittarius_A*
  description: For a non-rotating black hole with Sagittarius A*'s estimated mass, the event horizon would
    be about twenty-five million kilometers across. The horizon marks a causal boundary beyond which light
    cannot escape, rather than a glowing material surface. The Event Horizon Telescope observes emission
    around a larger shadow, so the image and this mass-based reference diameter describe different parts
    of the same black-hole environment.
- name: Sun-Mercury Distance
  value: 57900000000.0
  source: https://nssdc.gsfc.nasa.gov/planetary/factsheet/mercuryfact.html
  description: Mercury orbits the Sun at an average distance of 57.9 million km, about 0.39 of Earth's,
    so sunlight takes just over three minutes to arrive and is about seven times brighter than at Earth.
    The orbit is stretched, swinging between 46.0 and 69.8 million km from the Sun, and a Mercury year
    lasts only 88 Earth days. It is the innermost planet, and this scale shows how much room remains between
    it and the Sun's surface.
- description: The distance from Earth to the Sun, known as one astronomical unit - the yardstick of the
    solar system. This distance defines the habitable zone where liquid water can exist, making Earth
    perfectly positioned for life. Light takes 8 minutes and 20 seconds to travel this distance, meaning
    we see the Sun as it was 8 minutes ago. This distance varies by 5 million km due to Earth's elliptical
    orbit, affecting our seasons and climate.
  name: Astronomical Unit
  source: https://en.wikipedia.org/wiki/Astronomical_unit
  value: 1.5e11
- name: Sun-Jupiter Distance
  value: 778500000000.0
  source: https://nssdc.gsfc.nasa.gov/planetary/factsheet/jupiterfact.html
  description: Jupiter orbits the Sun at an average distance of 778 million km, about 5.2 times Earth's
    distance, so sunlight takes roughly 43 minutes to reach it and the planet needs almost 12 years to
    circle the Sun once. Its orbit lies just outside the asteroid belt, and the planet is heavier than
    all the other planets combined, more than twice over. The orbit would be swallowed whole by the largest
    red supergiants.
- description: The diameter of Betelgeuse, a red supergiant star that could explode as a supernova within
    the next 100,000 years. This massive star is so large that if placed at the center of our solar system,
    it would extend beyond Jupiter's orbit. Betelgeuse is one of the brightest stars in the night sky
    and appears red due to its cool surface temperature. When it explodes, it will be visible during daylight
    and brighter than the full Moon.
  name: Betelgeuse Diameter
  source: https://en.wikipedia.org/wiki/Betelgeuse
  value: 1e12
- name: Halley's Comet Orbit
  value: 5306834865211.8
  source: https://en.wikipedia.org/wiki/Halley%27s_Comet
  description: The long axis of Halley's comet's orbit spans about 35.5 astronomical units, or 5.31 billion
    kilometers, using a representative orbital solution. Its elongated path carries it from the inner
    Solar System to a distant region beyond Neptune's orbital distance. The number measures the orbit's
    major axis, not the comet or its tail, and the exact path changes as planets perturb successive returns.
- name: Alpha Centauri A-B Orbit
  value: 7001180348760.0
  source: https://en.wikipedia.org/wiki/Alpha_Centauri
  description: Alpha Centauri A and B, a Sun-like star and a slightly smaller orange one, circle each
    other along an ellipse about 47 AU long, once every 79.8 years. They approach to 11.2 AU, about the
    distance from the Sun to Saturn, and recede to 35.6 AU, about the distance from the Sun to Pluto.
    The pair belongs to the nearest star system to the Sun, together with the faint red dwarf Proxima
    Centauri.
- description: The diameter of our solar system, a vast region dominated by the Sun's gravitational influence.
    This space contains eight planets, hundreds of moons, millions of asteroids, and trillions of comets.
    The solar system formed 4.6 billion years ago from a collapsing cloud of gas and dust. Despite its
    enormous size, the solar system is just a tiny speck in our galaxy, which contains 100 billion other
    solar systems.
  name: Solar System
  source: https://en.wikipedia.org/wiki/Solar_System
  value: 1.2e13
- name: Kuiper Belt
  value: 15000000000000.0
  source: https://en.wikipedia.org/wiki/Kuiper_belt
  description: The Kuiper Belt is a wide ring of icy bodies beyond Neptune, stretching from about 30 AU
    to roughly 50 AU from the Sun, so about 100 AU across counting both sides. It is 20 times as wide
    as the asteroid belt and 20 to 200 times as massive, yet its total mass is only about 2 percent of
    Earth's. Pluto lives here, and its main population ends abruptly near 48 AU for reasons still debated.
- description: A representative 240-au diameter of the heliosphere's nose region, twice the roughly 120-au
    heliopause distance measured near the Voyager crossings, not the uncertain length of its tail. This
    protective bubble of solar wind shields our solar system from cosmic radiation. This bubble extends
    far beyond Pluto and acts as a barrier against the harsh interstellar environment. The heliosphere's
    shape changes as the Sun moves through the galaxy, creating a comet-like tail that extends for billions
    of kilometers. Only two spacecraft, Voyager 1 and 2, have ever left this protective bubble.
  name: Heliosphere
  source: https://science.nasa.gov/mission/voyager/interstellar-mission/
  value: 3.5903488968e13
- name: M87* Shadow
  value: 103000000000000.0
  source: https://en.wikipedia.org/wiki/Messier_87
  description: In 2019 the Event Horizon Telescope produced the first image of a black hole, a bright
    lopsided ring about 690 AU (103 billion km) across around the 6.5 billion solar mass black hole at
    the heart of the galaxy M87, 53 million light-years away. The dark center of the ring is the black
    hole's shadow, about 2.6 times larger than the event horizon itself. The ring is more than ten times
    wider than the orbit of Neptune.
- name: Sedna Aphelion
  value: 140000000000000.0
  source: https://en.wikipedia.org/wiki/Sedna_(dwarf_planet)
  description: Sedna reaches about 937 astronomical units from the Sun at the farthest point of its elongated
    orbit, roughly 140 billion kilometers. Its path carries it far beyond the region occupied by the major
    planets, with a full circuit taking many thousands of years. This marker measures the Sun-to-object
    distance at aphelion, an orbital extreme whose origin remains an active question about the distant
    Solar System.
- name: TON 618 Event Horizon
  value: 240000000000000.0
  source: https://en.wikipedia.org/wiki/TON_618
  description: TON 618 is a quasar at redshift 2.2 powered by one of the most massive black holes known,
    estimated at between about 40 and 66 billion Suns. For the lower mass, the event horizon is about
    1,600 AU (240 billion km) across, roughly 20 times the width of Pluto's orbit, and light would take
    about nine days to cross it. The black hole is not seen directly, and the mass estimate depends on
    a velocity measurement that carries a large uncertainty.
- name: Light-Year
  value: 9460730472580800
  source: https://en.wikipedia.org/wiki/Light-year
  description: A light-year is the distance light travels in a vacuum in one Julian year of 365.25 days,
    exactly 9,460,730,472,580,800 meters. It equals about 63,000 times the distance from Earth to the
    Sun. At the 17 km/s speed of Voyager 1, a spacecraft would need roughly 18,000 years to cover it,
    and the nearest star lies just over four of them away.
- name: Ring Nebula
  value: 9460730472580800
  source: https://en.wikipedia.org/wiki/Ring_Nebula
  description: 'The Ring Nebula (Messier 57) is a [planetary nebula](https://en.wikipedia.org/wiki/Planetary_nebula):
    the glowing shell of gas shed by a dying Sun-like star about 2,570 light-years away in the constellation
    Lyra. After expanding for about 1,610 years it is now roughly one light-year across, with a faint
    white dwarf at its center. The Sun is expected to end its life the same way in several billion years.'
- description: A representative 200,000-au diameter of the hypothesized Oort Cloud, using the upper end
    of NASA's uncertain 10,000-100,000-au outer-radius range. This vast reservoir of icy objects lies
    at the outer reaches of our solar system rather than having a directly observed sharp edge. This distant
    region contains trillions of comets and extends halfway to the nearest star. The Oort Cloud is the
    source of long-period comets that occasionally visit the inner solar system. These icy bodies are
    pristine remnants from the solar system's formation, preserving the original composition of the protoplanetary
    disk.
  name: Oort Cloud
  source: https://science.nasa.gov/solar-system/oort-cloud/facts/
  value: 2.991957414e16
- description: The distance to Proxima Centauri, our nearest stellar neighbor that hosts an Earth-sized
    planet in its habitable zone. This red dwarf star is part of the Alpha Centauri triple star system
    and is 4.24 light-years away. At current spacecraft speeds, it would take 75,000 years to reach Proxima
    Centauri. This star is much smaller and cooler than our Sun, but its planet Proxima b could potentially
    harbor life.
  name: Proxima Centauri
  source: https://en.wikipedia.org/wiki/Proxima_Centauri
  value: 4e16
- description: The Pillars of Creation rise about five light-years within the Eagle Nebula, columns of
    cold hydrogen gas mixed with dust. Ultraviolet light from nearby massive stars heats and erodes their
    exposed surfaces, while denser material shelters gas beneath it and stars form deep inside. Their
    height exceeds the distance from the Sun to Proxima Centauri, turning a familiar astronomical photograph
    into a structure on an interstellar scale.
  name: Pillars of Creation
  source: https://svs.gsfc.nasa.gov/30774
  value: 4.7303652362904e+16
- name: Barnard's Star Distance
  value: 5.6413389734952056e+16
  source: https://en.wikipedia.org/wiki/Barnard%27s_Star
  description: Barnard's Star lies about 5.96 light-years from the Sun, beyond the Alpha Centauri system
    but still in our immediate stellar neighborhood. It is a faint red dwarf whose rapid apparent motion
    across the sky made it particularly distinctive to astronomers. The distance separates entire star
    systems, an enormous step outward from the diameters of the stars and the paths of their planets.
- name: Distance to Sirius
  value: 8.136228206419488e+16
  source: https://en.wikipedia.org/wiki/Sirius
  description: Sirius lies about 8.6 light-years from the Sun, so the light reaching us tonight began
    its journey more than eight years ago. The system includes the bright star Sirius A and the compact
    white dwarf Sirius B, two very different objects sharing a stellar neighborhood. Their distance is
    roughly twice that of Proxima Centauri, placing another familiar point of light among the nearest
    stars.
- name: Crab Nebula
  value: 104068035198388800
  source: https://en.wikipedia.org/wiki/Crab_Nebula
  description: The Crab Nebula is the debris of a star that exploded in the year 1054, a supernova recorded
    by astronomers in China and elsewhere. About 6,500 light-years from Earth, its filaments are still
    expanding at roughly 1,500 km/s and are now about 11 light-years across. At its center, a pulsar spinning
    about 30 times per second powers the whole nebula's glow.
- description: The size of the Orion Nebula, a stellar nursery visible to the naked eye where hundreds
    of new stars are being born. This massive cloud of gas and dust contains enough material to form 2,000
    Sun-like stars. The nebula glows because young, hot stars ionize the surrounding hydrogen gas. It's
    one of the most studied objects in astronomy and provides insights into how solar systems like ours
    form from collapsing clouds.
  name: Orion Nebula
  source: https://en.wikipedia.org/wiki/Orion_Nebula
  value: 2.4e17
- name: Pleiades
  value: 813622820641948800
  source: https://en.wikipedia.org/wiki/Pleiades
  description: The Pleiades is an open star cluster about 444 light-years away with more than 1,000 members,
    of which the naked eye picks out only the brightest handful as the Seven Sisters. Its core has a radius
    of about 8 light-years, but the cluster's gravity binds stars out to a tidal radius of about 43 light-years,
    so the whole cluster is roughly 86 light-years across. It is young, and its stars will slowly drift
    apart over time.
- name: Omega Centauri
  value: 1419109570887120000
  source: https://en.wikipedia.org/wiki/Omega_Centauri
  description: Omega Centauri is the largest globular cluster in the Milky Way, about 150 light-years
    across and holding roughly 10 million stars with a combined mass of about 4 million Suns. It is so
    massive and complex, with several distinct generations of stars, that astronomers suspect it is the
    stripped core of a small galaxy swallowed long ago by the Milky Way. To the naked eye it looks like
    a single fuzzy star.
- description: The roughly 300-light-year span of the Carina Nebula, a massive stellar factory containing
    some of the most massive and luminous stars in our galaxy. This nebula is home to Eta Carinae, a binary
    star system that's 5 million times brighter than the Sun and may explode as a supernova within the
    next million years. The nebula's complex structures include dark dust lanes, bright star clusters,
    and vast regions of ionized gas sculpted by stellar winds.
  name: Carina Nebula
  source: https://science.nasa.gov/missions/hubble/hubbles-sparkling-new-view-of-the-carina-nebula/
  value: 2.83821914177424e18
- description: The size of the Tarantula Nebula, the most active stellar nursery in our galactic neighborhood.
    This massive star-forming region in the Large Magellanic Cloud produces stars at a rate 10 times higher
    than our entire Milky Way galaxy. The nebula contains some of the most massive stars known, including
    R136a1, which is 300 times more massive than the Sun. This intense star formation creates spectacular
    light shows visible across vast distances.
  name: Tarantula Nebula
  source: https://en.wikipedia.org/wiki/Tarantula_Nebula
  value: 9e18
- name: Orion Arm
  value: 33112556654032800000
  source: https://en.wikipedia.org/wiki/Orion_Arm
  description: The Orion Arm, also called the Local Arm, is a region of the Milky Way about 3,500 light-years
    wide. It contains the Solar System and extends much farther along the galaxy than across it, with
    star-forming clouds tracing part of its structure. This marker follows the arm's width, giving a scale
    to our stellar neighborhood between the tiny Solar System and the whole galactic disk.
- name: M87 Jet
  value: 47303652362904000000
  source: https://science.nasa.gov/asset/hubble/galaxy-m87-jet-annotated/
  description: A jet of superheated plasma streams out of the giant elliptical galaxy M87, and Hubble
    can follow its visible portion for 5,000 light-years. It is launched at nearly the speed of light
    by the same supermassive black hole that the Event Horizon Telescope imaged, whose ring is millions
    of times smaller. The jet is longer than the Orion Arm is wide, yet it all begins within a region
    the size of a solar system.
- name: Radcliffe Wave
  value: 83254428158711040000
  source: https://en.wikipedia.org/wiki/Radcliffe_Wave
  description: The Radcliffe Wave is a long, undulating chain of star-forming gas clouds near the Sun,
    found in 2020 by mapping the three-dimensional positions of stars and dust with Gaia data. It is about
    8,800 light-years long and rises and falls by roughly 520 light-years as it snakes through the Milky
    Way's disk. Many of the nearby star-forming clouds seen from Earth are part of this single structure.
- name: Sun-Galactic Center Distance
  value: 2.5234671261436402e+20
  source: https://arxiv.org/abs/1904.05721
  description: The Sun is about 8,178 parsecs from the center of the Milky Way, as measured by the GRAVITY
    instrument by watching stars orbit the central black hole. That is roughly 26,700 light-years, a little
    more than halfway out to the edge of the galaxy's stellar disk. The Sun takes about 230 million years
    to complete one orbit of the center, so it has made only about 20 laps in its lifetime.
- name: Large Magellanic Cloud
  value: 3.042478095350488e+20
  source: https://en.wikipedia.org/wiki/Large_Magellanic_Cloud
  description: The Large Magellanic Cloud is a satellite galaxy of the Milky Way, visible to the naked
    eye from the Southern Hemisphere. It is about 9.9 kiloparsecs, or 32,000 light-years, across, roughly
    a third the width of the Milky Way's disk, and lies about 163,000 light-years away. It hosts the Tarantula
    Nebula and was the site of Supernova 1987A, the closest supernova seen in modern times.
- name: Milky Way Central Bar
  value: 3.0856775814913674e+20
  source: https://arxiv.org/abs/1504.01401
  description: Through the Milky Way's bulge runs a bar of old stars, rotated about 28 to 33 degrees from
    the line between the Sun and the Galactic Center. Counts of red clump giant stars put its half-length
    at about 5 kiloparsecs, which makes the bar around 10 kiloparsecs, or 32,000 light-years, from end
    to end. Other methods give shorter bars, so its exact length is still being refined.
- name: Fermi Bubbles
  value: 473036523629040000000
  source: https://www.nasa.gov/universe/nasas-fermi-telescope-finds-giant-structure-in-our-galaxy
  description: The Fermi bubbles extend about 25,000 light-years above and below the Milky Way's center,
    giving the pair a combined height of roughly 50,000 light-years. Discovered through gamma-ray observations,
    these enormous lobes reveal energetic activity whose origin remains under study. Their full span is
    comparable with a large fraction of the galaxy's diameter, even though the structures are difficult
    to recognize in ordinary visible-light images.
- description: The diameter of the Milky Way, our home galaxy containing 100-400 billion stars orbiting
    a supermassive black hole. Our solar system orbits the galactic center at 220 km/s, completing one
    revolution every 230 million years. The galaxy's spiral arms contain most of its stars and gas, while
    the central bulge contains older stars. The Milky Way is on a collision course with the Andromeda
    Galaxy, which will merge with us in 4.5 billion years.
  name: Galaxy Diameter
  source: https://en.wikipedia.org/wiki/Milky_Way
  value: 1e21
- name: Andromeda Galaxy Diameter
  value: 1.4366914819423805e+21
  source: https://en.wikipedia.org/wiki/Andromeda_Galaxy
  description: Andromeda's bright stellar disk has a characteristic diameter of about 152,000 light-years
    when measured to a defined surface-brightness contour. Fainter stars and gas continue beyond that
    contour, so the number is an observational convention rather than a sharp galactic edge. Its visible
    disk is broader than the Milky Way's on this scale, while the much larger surrounding gas halo appears
    farther along the explorer.
- name: Magellanic Stream
  value: 5.554219646684461e+21
  source: https://en.wikipedia.org/wiki/Magellanic_Stream
  description: The Magellanic Stream is a vast ribbon of hydrogen gas trailing behind the Large and Small
    Magellanic Clouds, stripped from them as they fall around the Milky Way. It stretches at least 180
    degrees across the sky, which at its distance of roughly 55 kiloparsecs corresponds to about 180 kiloparsecs,
    or 600,000 light-years. It was discovered in radio observations in the 1970s, and later work showed
    it to be much longer than first thought.
- name: IC 1101
  value: 1.604552342375511e+22
  source: https://arxiv.org/abs/2607.15340
  description: Deep imaging places a characteristic outer stellar edge of IC 1101 about 260 kiloparsecs
    from its center, implying a diameter near 1.7 million light-years. This giant galaxy sits at the center
    of the Abell 2029 cluster, where its faint outskirts blend gradually into surrounding light. The marker
    follows a particular observational definition of the stellar extent, not a sharp surface or a boundary
    to all its matter.
- description: The distance to the Andromeda Galaxy, our nearest major galactic neighbor that's approaching
    us at 110 km/s. This massive spiral galaxy contains over a trillion stars and is twice the size of
    the Milky Way. Andromeda is visible to the naked eye as a faint smudge in the night sky. In 4.5 billion
    years, it will collide with our galaxy, creating a new elliptical galaxy called Milkomeda. The collision
    will dramatically reshape both galaxies but stars are so far apart that direct collisions are unlikely.
  name: Andromeda Distance
  source: https://en.wikipedia.org/wiki/Andromeda_Galaxy
  value: 2.37e22
- name: Andromeda Gas Halo
  value: 2.459789922871008e+22
  source: https://www.stsci.edu/contents/news-releases/2020/news-2020-46
  description: Andromeda's diffuse gas halo reaches about 1.3 million light-years from its center in a
    representative direction, giving a characteristic diameter of 2.6 million light-years. Astronomers
    traced it through the absorption it leaves in light from distant background quasars. The halo reaches
    still farther in some directions, making the bright visible galaxy a small central feature within
    a much larger, uneven envelope of gas.
- description: The diameter of the Local Group, our galactic neighborhood containing about 50 galaxies
    bound together by gravity. This group is dominated by the Milky Way and Andromeda galaxies, which
    together contain 90% of the group's mass. The Local Group is falling toward the Virgo Cluster at 600
    km/s due to dark matter's gravitational pull. Despite its name, this group spans millions of light-years
    and represents our cosmic backyard in the vast universe.
  name: Local Group
  source: https://en.wikipedia.org/wiki/Local_Group
  value: 1e23
- name: Porphyrion
  value: 2.159974307043957e+23
  source: https://www.nature.com/articles/s41586-024-07879-y
  description: Porphyrion's two black-hole jets have an estimated total extent of about seven megaparsecs,
    or twenty-three million light-years; their directly measured projected span is about 6.43 megaparsecs.
    They carry energy far outside their host galaxy and into
    the environment of the cosmic web. This measurement follows the extended radio-emitting structure
    rather than the galaxy's stars, making an outflow from one central engine wider than an entire small
    group of galaxies.
- name: Distance to the Virgo Cluster
  value: 5.091368009460756e+23
  source: https://en.wikipedia.org/wiki/Virgo_Cluster
  description: The center of the Virgo Cluster lies about 16.5 megaparsecs (54 million light-years) away,
    the nearest large galaxy cluster to us. It holds more than a thousand galaxies, with a total mass
    of about a quadrillion Suns, and spans roughly eight degrees of sky. Light that we see from it left
    when mammals were just beginning to diversify after the extinction of the dinosaurs.
- description: The approximate 100-million-light-year span of the Virgo (Local) Supercluster, a massive
    collection of galaxy groups containing thousands of galaxies. This structure contains about 100 galaxy
    groups and clusters with a total mass of 10^15 solar masses. The Virgo Supercluster is falling toward
    the Great Attractor, a mysterious region of space that's pulling galaxies toward it. Its irregular
    disk and halo of galaxy clouds are a large-scale neighborhood, not one gravitationally bound object
    with a sharply defined surface.
  name: Virgo Supercluster
  source: https://imagine.gsfc.nasa.gov/features/cosmic/local_supercluster_info.html
  value: 9.46e23
- name: Local Void
  value: 1.8514065488948202e+24
  source: https://en.wikipedia.org/wiki/Local_Void
  description: The Local Void is a vast, almost empty region of space that borders the Local Group, stretching
    about 60 megaparsecs, or 200 million light-years, according to current estimates, though the uncertainty
    is large and it may be as small as 45 megaparsecs. Galaxies avoid such regions, lying on the walls
    and filaments of the cosmic web that surround them. It is roughly twenty times as wide as the Local
    Group.
- name: Bootes Void
  value: 3.8262402010492955e+24
  source: https://en.wikipedia.org/wiki/Bo%C3%B6tes_void
  description: The Bootes Void has a historical diameter estimate of about 124 megaparsecs using a radius
    of 62 megaparsecs and H0 = 50 km/s/Mpc; the same redshift span corresponds to about 89 megaparsecs for
    H0 = 70 km/s/Mpc. It is a region with far fewer galaxies than a typical volume of
    similar size, rather than an empty bubble with a hard wall. Its dimensions depend on how its boundary
    and distance scale are defined, placing absence itself among the largest structures on this scale.
- name: Baryon Acoustic Oscillation Scale
  value: 4.6285163722370506e+24
  source: https://en.wikipedia.org/wiki/Baryon_acoustic_oscillations
  description: When the universe was a hot plasma, sound waves rippled outward from every dense spot;
    when the plasma cooled 380,000 years after the Big Bang, those waves froze in place. The result is
    that galaxies are slightly more likely to be separated by about 150 megaparsecs, roughly 490 million
    light-years in today's expanded universe. First detected in 2005 in galaxy surveys, this ruler is
    now used to measure the expansion history of the universe.
- description: The approximate 160-megaparsec diameter of the Laniakea Supercluster, our cosmic home that
    contains 100,000 galaxies including our Milky Way. This Hawaiian-named structure means 'immeasurable
    heaven' and is defined by a basin of peculiar galaxy velocities, not by a gravitationally bound boundary.
    Laniakea contains a mass of 10^17 solar masses and shows how galaxies flow toward its center like
    water flowing downhill. This supercluster is part of an even larger cosmic web that spans the observable
    universe.
  name: Laniakea Supercluster
  source: https://doi.org/10.1038/nature13674
  value: 4.937084130386187e24
- description: The length of the Sloan Great Wall, one of the largest structures in the observable universe.
    This massive filament contains thousands of galaxies arranged in a wall-like formation. Gott and colleagues
    estimated its curved length as 450 megaparsecs in present-epoch comoving coordinates, about 1.47 billion
    light-years. At the epoch seen in its light, the same estimate is about 419 Mpc. Such walls also occur
    in simulations of standard cosmology; their connected extent depends on how the structure is defined.
    This structure represents the cosmic web's filamentary nature, where galaxies cluster along vast interconnected
    threads.
  name: Sloan Great Wall
  source: https://arxiv.org/html/astro-ph/0310571v2
  value: 1.3885549116711151e25
- name: Putative Giant Arc
  value: 3.122041055951664e+25
  source: https://en.wikipedia.org/wiki/Giant_Arc
  description: The putative Giant Arc spans about 3.3 billion light-years in a reported arrangement of
    absorption systems seen against distant quasars. Those absorption lines trace intervening gas, letting
    astronomers search for patterns beyond what an ordinary photograph reveals. Whether the pattern constitutes
    one physically meaningful structure remains debated, so this marker follows the reported span rather
    than a settled wall with a measured outer boundary.
- description: A reported gamma-ray-burst concentration nicknamed the Hercules-Corona Borealis Great Wall,
    with a proposed extent of roughly 2,000-3,000 megaparsecs. The marker uses the upper end, about 10
    billion light-years; it is not a measured edge of a mapped galaxy wall. Bursts can act as distant
    tracers of stellar populations, but their rarity and uneven detection make this an intriguing, disputed
    inference. Studies disagree about whether selection effects can explain the clustering. The question
    is not whether a visible wall fills this span, but whether sparse flashes reveal an unusually large
    structure.
  name: Hercules-Corona Borealis Great Wall
  source: https://arxiv.org/abs/1401.0533
  value: 9.4607304725808e25
- name: Hubble Radius
  value: 1.3623451880516352e+26
  source: https://en.wikipedia.org/wiki/Hubble%27s_law
  description: 'The Hubble radius is about 14.4 billion light-years for the expansion rate used here,
    marking where recession in the idealized expanding universe equals the speed of light. It is not the
    edge of what we can observe: light travels through a universe whose expansion rate changes over time.
    The observable universe''s radius is much larger, so a recession-speed marker and a visibility horizon
    occupy different positions on the scale.'
- name: JADES-GS-z14-0
  value: 3.2018896211402456e+26
  source: https://en.wikipedia.org/wiki/JADES-GS-z14-0
  description: JADES-GS-z14-0, found by the James Webb Space Telescope, is one of the most distant galaxies
    known, seen as it was less than 300 million years after the Big Bang at redshift near 14.2. Its light
    has traveled for about 13.5 billion years, but because space expanded during the trip, the galaxy's
    present distance (comoving) is about 33.8 billion light-years. The galaxy is only about 1,600 light-years
    wide.
- description: The diameter of the observable universe, the ultimate limit of what we can see. This boundary
    exists because light has only had 13.8 billion years to travel since the Big Bang. Cosmic expansion
    has stretched the present distance to those regions to about 46.5 billion light-years; recession faster
    than light does not by itself make a galaxy unobservable. The observable universe contains about 2
    trillion galaxies and may represent only a tiny fraction of the entire universe, which may be infinite
    in extent. This diameter defines the horizon of human knowledge about cosmic reality.
  name: Observable Universe
  source: https://en.wikipedia.org/wiki/Observable_universe
  value: 8.8e26
units:
- conversion_factor: 1
  description: The fundamental unit of length, defined as the distance light travels in vacuum during
    1/299,792,458 seconds. This definition makes the meter a universal constant based on the speed of
    light, ensuring precision across all scientific measurements. The meter serves as the reference for
    all other length units and forms the foundation for dimensional analysis in physics and engineering.
    Remarkably, this definition means the speed of light is exactly 299,792,458 meters per second by definition.
  name: meters
  symbol: m
- conversion_factor: 3.28084
  description: A unit of length in the imperial system, originally based on the length of a human foot.
    This practical unit is defined as exactly 0.3048 meters through international agreement. The foot
    is widely used in construction, aviation, and maritime applications, particularly in the United States.
    Interestingly, the foot was standardized in 1959 when the international yard was redefined, making
    it exactly 12 inches. This unit provides a convenient scale for human-scale measurements and remains
    deeply embedded in American culture.
  name: feet
  symbol: ft
- conversion_factor: 39.3701
  description: A unit of length in the imperial system, defined as exactly 25.4 millimeters through international
    standardization. The inch provides high precision for measurements requiring fine resolution, particularly
    in manufacturing, engineering, and scientific applications. This unit is derived from the width of
    a human thumb and has been standardized across different measurement systems. The inch serves as a
    fundamental building block for larger imperial units and enables precise dimensional specifications.
    Interestingly, the inch was redefined in 1959 to be exactly 2.54 centimeters, creating a precise metric
    conversion.
  name: inches
  symbol: in
- conversion_factor: 0.001
  description: A metric unit of length equal to 1,000 meters, representing the most commonly used unit
    for terrestrial distances. The kilometer provides an optimal scale for measuring distances on Earth,
    from city blocks to continental spans. This unit is fundamental to transportation, geography, and
    Earth sciences, enabling precise navigation and spatial analysis. The kilometer serves as the standard
    unit for expressing distances in most countries worldwide. Interestingly, the kilometer was originally
    defined as 1/10,000 of the distance from the North Pole to the Equator through Paris.
  name: kilometers
  symbol: km
- conversion_factor: 0.000621371
  description: A unit of length in the imperial system, defined as exactly 1,609.344 meters through international
    standardization. The mile represents a practical unit for measuring longer distances, particularly
    in transportation and navigation applications. This unit is derived from the Roman 'mille passus'
    (thousand paces) and has evolved into a standard measure for road distances, speed limits, and athletic
    competitions. The mile remains deeply embedded in American culture, with phrases like 'miles per hour'
    and 'miles per gallon' being everyday expressions. Interestingly, the nautical mile is different,
    being based on one minute of latitude.
  name: miles
  symbol: mi
- conversion_factor: 1.057e-16
  description: A unit of astronomical distance representing the distance traveled by light in vacuum during
    one Julian year (365.25 days). The light-year provides a natural scale for measuring interstellar
    and intergalactic distances, where conventional units become impractical. This unit is fundamental
    to astronomy and cosmology, enabling precise measurements of stellar distances, galactic dimensions,
    and cosmic expansion. The light-year represents both a distance and a time measurement, reflecting
    the finite speed of light in the universe. Interestingly, when we look at stars, we're seeing them
    as they were years or even millennia ago due to light travel time.
  name: light-years
  symbol: ly
